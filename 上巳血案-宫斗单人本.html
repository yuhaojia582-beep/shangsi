      <p style="color:var(--gold-2)">次日天明，圣上密召你入殿，只说了两句话：「三日之内，查清贵妃怎么没的。」「查到谁，就报谁，不必顾着谁的脸。」</p>
      <hr class="rule">
      <p><strong style="color:#f0d68a">你的身份：内廷司正 · 谢绥。</strong>前大理寺司直，因父获罪没入宫籍，擅刑名，为尚宫所拔，掌宫规稽核。宫中人怕你，也叫你「查案的谢司正」。</p>
      <p><strong style="color:#f0d68a">你的权限：</strong>三日之内，可行走六宫、勘验现场、调阅内务府与太医院档册、传唤宫人问话。你手里的不是腰牌，是三日的命。</p>
    </div>

    <div class="intro-note">
      <b style="color:var(--gold)">本子规则</b>
      <ol>
        <li>共三日，<b>每日十五筹上下</b>，三日共四十六筹。<b>每勘验一处、每问一句话、每呈一次证，皆耗一筹。</b>本子经精算：只要方向不错，<b>全部三十四条线索都拿得到</b>；余下十二筹，够你搜错几处、呈错几回。你缺的从来不是筹，是判断。</li>
        <li>入一处，先选<b>「勘验」</b>还是<b>「问话」</b>。<b>勘验</b>是搜现场——八处地点皆是一幅现场长卷，<b>你去点画面里的物事</b>。物事有明有暗，<b>搜错了，筹也照样花出去</b>；下方的提示语，是给你判方向的。</li>
        <li>窄屏（手机）上画面可<b>左右滑动</b>看全；轻触物事只<b>先看清是什么</b>，<b>再点一次才真的勘验</b>——免得手指一滑白花一筹。</li>
        <li>有些话<b>空口问不进去</b>（标为虚线者，须先握有凭据）。有些话须得<b>呈证逼问</b>——由你从线索簿里挑一条证据推过去。挑对了，他才开口；<b>挑错了，筹白花</b>。但你手上若根本没有能与他对质的东西，他会直说——这一筹不花。</li>
        <li>线索分三日投放：<b>第一日建立疑点，第二日制造矛盾，第三日拿出决定性证据。</b>一日查不完，来日可补。</li>
        <li><b style="color:#e79aa2">线索不都是真的。</b>有一类线索，指向写得很明白，看着也像铁证——可分两种：<b>一种是「指向错人」</b>，东西是真的，安错了人；<b>一种是「证据无效」</b>，指向的人也许没错，可这条证据本身什么都证明不了——因为<u>那样的东西，满宫都有</u>。六条这样的线索藏在案子里，<b>每一条都必定有另一条线索能推翻它</b>，绝不会是死胡同。结案时你要交代：<b>哪一条，你认为不可采信。</b></li>
        <li>终局须指认：<b>下毒之人</b>、<b>断其生路之人</b>，<b>呈上关键证据</b>，并<b>剔去一条不可采信的线索</b>。<b>本案不止一只手，也不止一个坑。</b></li>
      </ol>
    </div>

    <div class="intro-actions">
      <button class="btn primary" onclick="startGame()">入 宫 查 案</button>
      <span class="dim" style="font-size:12.5px;letter-spacing:.14em">—— 三人死于一句闲话，六宫各有各的算盘。</span>
    </div>
  </section>`;
}

function startGame(){
  S.round=1; S.ap=S.apMax[1]; S.found={}; S.done={}; S.denied={};
  S.current=null; S.tab=null; S.view=null; S.settled=0; S.verdict=null; S.tapSel=null;
  renderGame();
  backToTop();
}

/* ---------------- 可用性 ---------------- */
function spotsOf(p){ return p.spots || []; }
function topicsOf(p){ return p.topics || []; }
function spotVisible(sp){ return (sp.open||1) <= S.round; }
function spotLocked(sp){ return !!(sp.req && !S.found[sp.req.clue]); }
function topicVisible(t){ return (t.open||1) <= S.round; }
function topicLocked(t){ return !!(t.req && !S.found[t.req.clue]); }

/* ---------------- 主界面 ---------------- */
function renderGame(){
  const pips = [1,2,3].map(r=>{
    const cls = r===S.round ? "pip on" : (r<S.round ? "pip done" : "pip");
    return `<span class="${cls}">${["第一日","第二日","第三日"][r-1]}</span>`;
  }).join("");
  const dots = Array.from({length:S.apMax[S.round]},(_,i)=>`<span class="apdot ${i<S.ap?"on":""}"></span>`).join("");

  const places = PLACES.map(p=>{
    const locked = p.open > S.round;
    const vis = spotsOf(p).filter(spotVisible).length + topicsOf(p).filter(topicVisible).length;
    const got = spotsOf(p).filter(sp=>spotVisible(sp)&&S.done[sp.id]).length
              + topicsOf(p).filter(t=>topicVisible(t)&&S.done[t.id]).length;
    let badge = "";
    if(locked) badge = `<span class="p-badge" style="color:var(--paper-3)">未开</span>`;
    else if(vis>0) badge = `<span class="p-badge">${got}/${vis}</span>`;
    return `<div class="place ${S.current===p.id?"on":""} ${locked?"locked":""}"
      ${locked?"":`onclick="selectPlace('${p.id}')"`}>
      <div class="p-ico">${p.ico}</div>
      <div style="flex:1;min-width:0">
        <div class="p-name">${p.name}</div>
        <div class="p-sub">${p.sub}</div>
      </div>${badge}
    </div>`;
  }).join("");

  app().innerHTML = `
  <section id="game">
    <div class="topbar">
      <div class="brand">上巳血案<small>大昭 · 景和十七年</small></div>
      <div class="daypips">${pips}</div>
      <div class="spacer"></div>
      <div class="apbox">
        <span class="lab">余 筹</span>
        <div class="apdots">${dots}</div>
        <span style="color:var(--gold-2);font-size:14px;min-width:20px;text-align:right">${S.ap}</span>
      </div>
      <button class="btn sm ghost" onclick="endDay(true)">结束本日</button>
    </div>

    <div class="layout">
      <div class="panel col-left">
        <div class="panel-h"><span>宫 城</span><span style="color:var(--paper-3);font-size:10.5px">六宫 + 三司</span></div>
        <div class="panel-b">
          <div class="places">${places}</div>
          <div class="stats" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--paper-3);line-height:1.9">
            <span>已获线索 <b style="color:var(--gold)">${clueCount()}</b> / ${TOTAL_CLUES}</span>
            <span>勘验 · 问话 <b style="color:var(--gold)">${S.settled}</b> 次</span>
          </div>
        </div>
      </div>

      <div class="panel col-mid">
        <div class="panel-h"><span>${S.current?PLACE_MAP[S.current].name:"查 案 台"}</span>
          <span style="color:var(--paper-3);font-size:10.5px">${["第一日 · 疑点","第二日 · 矛盾","第三日 · 定谳"][S.round-1]}</span></div>
        <div class="stage" id="stage">${renderStage()}</div>
      </div>

      <div class="panel col-right">
        <div class="panel-h"><span>线 索 簿</span><span style="color:var(--paper-3);font-size:10.5px">${clueCount()} 条</span></div>
        <div class="cluebox">${renderCluebook()}</div>
      </div>
    </div>
  </section>`;
}

function renderStage(){
  if(!S.current){
    return `<div class="stage-empty">
      <div class="big">卷</div>
      <p>案卷已启。左侧为宫中可往之处。<br>入一处，先择「勘验」或「问话」。</p>
      <p class="dim" style="font-size:12.5px">今日余筹 ${S.ap}。勘验一处、问话一次、呈证一回，各耗一筹。</p>
    </div>`;
  }
  if(S.view) return renderRead();

  const p = PLACE_MAP[S.current];
  const sps = spotsOf(p).filter(spotVisible);
  const tps = topicsOf(p).filter(topicVisible);
  const hasS = sps.length>0, hasT = tps.length>0;

  if(!hasS && !hasT){
    return `<div class="stage-h"><div><h2>${p.name}</h2><div class="sub">${p.sub}</div></div></div>
    <div class="stage-empty" style="min-height:300px">
      <div class="big">闭</div><p>今日此处无事可查。<br><span class="dim">换个地方，或结束本日。</span></p>
    </div>`;
  }

  let tab = S.tab;
  if(!hasS) tab="talk";
  if(!hasT) tab="search";
  if(tab!=="search"&&tab!=="talk") tab = hasS?"search":"talk";
  S.tab = tab;

  const tabsHtml = (hasS&&hasT) ? `<div class="tabs">
      <div class="tab ${tab==="search"?"on":""}" onclick="setTab('search')">勘 验<span class="cnt">${sps.filter(sp=>!S.done[sp.id]).length} 处</span></div>
      <div class="tab ${tab==="talk"?"on":""}" onclick="setTab('talk')">问 话<span class="cnt">${tps.filter(t=>!S.done[t.id]).length} 人</span></div>
    </div>` : "";

  const sc = (SCENES[p.id] && SCENES[p.id][tab]) || null;
  const note = tab==="search"
    ? (sc
        ? `<div class="tabnote">此间可以走动了。物事有明有暗，<b style="color:#d98b7a">搜错了，筹也照样花出去。</b></div>`
        : `<div class="tabnote">现场之物有明有暗，每处那句提示语是给你判方向的——<b style="color:#d98b7a">搜错了，筹也照样花出去。</b>虚线者，是你还没想到要查的去处。</div>`)
    : `<div class="tabnote">虚线者，<b style="color:#d98b7a">空口问不进去</b>，须先握有凭据。<span style="color:#e79aa2">朱色者，须呈证逼问</span>——由你挑一条证据推过去，挑对了，他才开口。</div>`;

  const sceneHtml = sc ? renderScene(sc, p, tab) : "";

  let listHtml = "";
  if(tab==="search"){
    listHtml = `<div class="sec-lab">案 上 清 单 · 可见 ${sps.length} 处</div><div class="spotgrid">${sps.map(sp=>{
      const done = S.done[sp.id];
      const lk = !done && spotLocked(sp);
      const pick = !done && !lk && S.pick===sp.id;      /* 已选中、待确认 */
      const cls = done ? (sp.clue?"hit":"miss") : (lk?"locked":(pick?"pick":""));
      const sf = done ? (sp.clue?"✓ 得":"已勘") : (lk?"——":(pick?"待勘":"可勘"));
      const sub = done ? (sp.clue?("已录："+CLUES[sp.clue].name):"已勘，无所得")
                       : (lk?"（尚无线索可依，想不到该查此处）":sp.hint);
      const act = done ? `onclick="showSpotResult('${sp.id}')"` : (lk?"":`onclick="pickSpot('${sp.id}')"`);
      return `<div class="spot ${cls}" ${act}>
        <div class="sf">${sf}</div>
        <div class="sn">${sp.name}</div>
        <div class="sh">${sub}</div>
        ${pick?`<div class="sdock">
          <span class="sdock-t">此 处 勘 验 · 耗 一 筹</span>
          <button class="btn sm primary" onclick="event.stopPropagation();doSpot('${sp.id}')">勘 验</button>
          <button class="btn sm ghost" onclick="event.stopPropagation();clearPick()">再 想 想</button>
        </div>`:""}
      </div>`;
    }).join("")}</div>`;
  } else {
    listHtml = `<div class="sec-lab">从 何 问 起 · ${tps.length} 项</div><div class="actlist">${tps.map(t=>{
      const done = S.done[t.id];
      const lk = !done && topicLocked(t);
      const isProve = !!t.show;
      const pick = !done && !lk && S.pick===t.id;
      const cls = done?"done":(lk?"locked":(isProve?"prove":(pick?"pick":"")));
      const no = done?"✓":(lk?"无凭":(isProve?(S.ap>0?"呈证":"无筹"):(pick?"待问":"可问")));
      const cost = done?"已录":(lk?"须先得凭据":(S.ap>0?"耗 1 筹":"无筹"));
      const tag = (t.clues&&t.clues.length) ? "" : '<span class="dim" style="font-size:12px">（未必有得）</span>';
      const click = done?`onclick="showTopicResult('${t.id}')"` : (lk?"":`onclick="pickTopic('${t.id}')"`);
      const act = isProve ? `openProve('${t.id}')` : `doTopic('${t.id}')`;
      return `<div class="act ${cls}" ${click}>
        <span class="a-no">${no}</span>
        <span class="a-txt">${t.label}${tag}</span>
        <span class="a-cost">${cost}</span>
        ${pick?`<div class="adock">
          <button class="btn sm primary" onclick="event.stopPropagation();${act}">${isProve?"呈 证":"问 话"}</button>
          <button class="btn sm ghost" onclick="event.stopPropagation();clearPick()">再 想 想</button>
        </div>`:""}
      </div>`;
    }).join("")}</div>`;
  }

  return `<div class="stage-h">
      <div><h2>${p.name}</h2><div class="sub">${p.sub}</div></div>
      <div style="text-align:right"><div class="kicker">今日余筹</div><div style="color:var(--gold-2);font-size:20px">${S.ap}</div></div>
    </div>
    ${tabsHtml}${note}${sceneHtml}${listHtml}`;
}

/* ---------------- 场景渲染 ---------------- */
/* 问话幕的「谁在答话 + 什么情绪」：
   cast 可以是一个人（对象）或一排人（数组）。每个话题用 who 指明问的是谁、react 指明情绪。
   规则优先级：当前选中的话题 → 最近问过的那个人的话题 → 默认。
   于是点不同的话题，画面里的人会各自换姿态——这就是问话幕的联动。 */
function talkCast(sc){
  const c = sc.cast;
  return Array.isArray(c) ? c : (c ? [c] : []);
}
function talkState(sc, tps){
  const cast = talkCast(sc);
  const pickId = S.pick;
  const named = cast.find(c=>c.name);

  /* 选中某话题：那个人摆出该话题的 react */
  if(pickId){
    const t = tps.find(x=>x.id===pickId);
    if(t) return {who:t.who||(named?named.name:null), mood:t.react||"calm"};
  }
  /* 已问过：停在最后一个被问过的人身上 */
  const doneT = tps.filter(x=>S.done[x.id] && x.react);
  if(doneT.length){
    const t = doneT[doneT.length-1];
    return {who:t.who||(named?named.name:null), mood:t.react};
  }
  return {who:named?named.name:null, mood:(named&&named.mood)||"calm"};
}
function renderScene(sc, place, tab){
  const sps = spotsOf(place).filter(spotVisible);
  const byId = {}; sps.forEach(s=>byId[s.id]=s);
  const hot = (sc.hot||[]).filter(h=>byId[h.id]);

  const marks = hot.map(h=>{
    const sp = byId[h.id];
    const done = !!S.done[sp.id];
    const cls = done ? (sp.clue ? "hit" : "miss") : "todo";
    const mx = h.mx!=null ? h.mx : h.x + h.w/2;
    const my = h.my!=null ? h.my : h.y + h.h/2;
    return `<g class="hsm ${cls}"><circle cx="${mx}" cy="${my}" r="${done?4:3.2}"/>`
         + (done && sp.clue ? `<circle class="ring" cx="${mx}" cy="${my}" r="8"/>` : "")
         + `</g>`;
  }).join("");

  /* 问话幕：按当前状态重画被问的人，叠在底景之上（底景里已不画人） */
  let figLayer = "";
  if(tab==="talk" && sc.cast){
    const tps = topicsOf(place).filter(topicVisible);
    const st = talkState(sc, tps);
    figLayer = talkCast(sc).map(c=>{
      const active = !c.name || !st.who || c.name===st.who;
      const mood = active ? st.mood : (c.mood||"calm");
      const rx = (c.react||{})[mood] || {};
      return K.fig(c.x + (rx.dx||0), c.y + (rx.dy||0), c.pose||"seat",
                   Object.assign({mood, tone:c.tone, tone2:c.tone2, mark:c.mark, op:active?(c.op==null?1:c.op):(c.dim||.5)}, rx));
    }).join("");
  }

  const rects = hot.map(h=>{
    const sp = byId[h.id];
    const done = !!S.done[sp.id];
    const lk = !done && spotLocked(sp);
    const cls = done ? "fin" : (lk ? "lock" : "");
    const act = done ? `showSpotResult('${sp.id}')` : (lk ? "" : `hsClick('${sp.id}')`);
    return `<rect class="hs ${cls}${S.tapSel===sp.id?" sel":""}" data-spot="${sp.id}" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="${h.rx||6}"`
         + (act ? ` onclick="${act}"` : "") + `></rect>`;
  }).join("");

  const touch = isTouch();
  /* 只有勘验页（有热区、要点选）才需要横滑保精度；问话页是纯插画，缩放看全就好 */
  const tapable = hot.length > 0;

  const def = tab==="search"
    ? (touch
        ? "轻触物事，先看清是什么；<b>再点一次才勘验</b> —— 有明有暗，搜错了，筹照花。"
        : "把光标移到场景中的物事上 —— 有明有暗，看不清的，筹也照花。")
    : (sc.cast && S.pick ? "她看住你问的这句话。点下方朱色按钮，才算真问出口。" : "她就在那儿。从下方择一处问起。");

  return `<div class="scene">
    <div class="scene-scroll${tapable?" tapable":""}" onmouseover="sceneHover(event)" onmouseout="sceneOut(event)">
      <svg viewBox="0 0 1120 460" xmlns="http://www.w3.org/2000/svg">${sc.svg}${figLayer}${marks}${rects}</svg>
    </div>
    ${tapable ? `<div class="scene-pan">← 左 右 滑 动 看 全 景 →</div>` : ""}
    <div class="scene-tip" id="sceneTip" data-def="${def.replace(/<[^>]+>/g,"")}"><i>${def}</i></div>
  </div>`;
}

function sceneHover(e){
  const t = e.target;
  if(!t || !t.classList || !t.classList.contains("hs")) return;
  hsTip(t.getAttribute("data-spot"));
}
function sceneOut(e){
  const t = e.target;
  if(!t || !t.classList || !t.classList.contains("hs")) return;
  hsTipOff();
}
function hsTip(sid){
  const el = document.getElementById("sceneTip"); if(!el || !sid) return;
  const p = PLACE_MAP[S.current]; if(!p) return;
  const sp = spotsOf(p).find(x=>x.id===sid); if(!sp) return;
  const done = !!S.done[sid];
  const lk = !done && spotLocked(sp);
  const picked = !done && !lk && isTouch() && S.tapSel===sid;
  const st = done ? (sp.clue ? "已录 · "+CLUES[sp.clue].name : "已勘 · 无所得")
                  : (lk ? "尚无由头" : (picked ? "再点一次 · 勘验" : "可勘 · 耗 1 筹"));
  const col = picked ? "#e79aa2" : (done ? "var(--jade)" : (lk ? "var(--paper-3)" : "var(--gold-2)"));
  el.className = "scene-tip on";
  el.innerHTML = `<b>${sp.name}</b><span style="color:var(--paper-3)">${done?"点击可回看":sp.hint}</span>`
               + `<span style="margin-left:auto;white-space:nowrap;color:${col}">${st}</span>`;
}
function hsTipOff(){
  /* 触屏没有「移开」这回事，别把刚点中的提示抹掉 */
  if(isTouch() && S.tapSel && !S.done[S.tapSel]){ hsTip(S.tapSel); return; }
  const el = document.getElementById("sceneTip"); if(!el) return;
  el.className = "scene-tip";
  el.innerHTML = `<i>${el.dataset.def||""}</i>`;
}
function paintSel(sid){
  const rs = document.querySelectorAll(".scene-scroll .hs");
  for(let i=0;i<rs.length;i++) rs[i].classList.toggle("sel", rs[i].getAttribute("data-spot")===sid);
}
/* 场景热区点击：触屏分两段——第一段只「看清」，第二段才真花那一筹 */
function hsClick(sid){
  const p = PLACE_MAP[S.current]; if(!p) return;
  const sp = spotsOf(p).find(x=>x.id===sid); if(!sp) return;
  if(S.done[sid]){ showSpotResult(sid); return; }
  if(spotLocked(sp) || (isTouch() && S.tapSel!==sid)){
    S.tapSel = sid; paintSel(sid); hsTip(sid); return;
  }
  doSpot(sid);
}
function backToTop(){
  try{ window.scrollTo({top:0, behavior: calm() ? "auto" : "smooth"}); }
  catch(e){ window.scrollTo(0,0); }
}
function updToTop(){
  const b = document.getElementById("toTop"); if(!b) return;
  b.classList.toggle("show", isNarrow() && (window.pageYOffset||0) > 420);
}
window.addEventListener("scroll", updToTop, {passive:true});
window.addEventListener("resize", updToTop);

function renderRead(){
  const v = S.view;
  const body = v.body.map(([k,t])=>{
    if(k==="say") return `<p class="say">${t}</p>`;
    if(k==="narr") return `<p class="narr">${t}</p>`;
    return `<p>${t}</p>`;
  }).join("");

  const cards = (v.clues||[]).map(cid=>{
    const c = CLUES[cid];
    const ml = !!c.mislead;
    return `<div class="cluepop">
      <div class="ch">
        <span class="tag ${c.type}">${c.type}</span>
        <span class="ct">${c.name}</span>
        <span style="margin-left:auto;font-size:10.5px;color:var(--paper-3);letter-spacing:.1em">${cid.toUpperCase()} · 得自${c.from}</span>
      </div>
      <div class="cd">${c.desc}</div>
      <div class="cp"><b>指向 · </b>${c.point}</div>
    </div>`;
  }).join("");

  return `<div class="stage-h">
      <div><h2>${PLACE_MAP[S.current].name}</h2><div class="sub">${v.label}</div></div>
      <button class="btn sm ghost" onclick="backToPlace()">返 回</button>
    </div>
    <div class="read"><div class="dialogue ${(v.clues&&v.clues.length)?'':'barren'}">${body}</div>${cards}</div>
    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="backToPlace()">继续查别处</button>
      <button class="btn ghost" onclick="renderGame()">回到案台</button>
    </div>`;
}

function renderCluebook(){
  if(!clueCount()) return `<div class="empty-note">线索簿空着。<br>去搜，去问，去翻档册。</div>`;
  const groups = {"物证":[],"证词":[],"时间":[]};
  Object.keys(S.found).forEach(cid=>{ groups[CLUES[cid].type].push(cid); });
  let html = "";
  ["物证","证词","时间"].forEach(t=>{
    if(!groups[t].length) return;
    html += `<div class="cluegrp"><div class="gh">${t} · ${groups[t].length}</div>`;
    groups[t].forEach(cid=>{
      html += `<div class="cluecard" onclick="showClue('${cid}')">
        <span class="cid">${cid.toUpperCase()}</span>${CLUES[cid].name}</div>`;
    });
    html += `</div>`;
  });
  return html;
}

/* ---------------- 操作 ---------------- */
function selectPlace(id){
  S.current=id; S.view=null; S.tab=null; S.tapSel=null; S.pick=null; renderGame(); focusStage();
}
function setTab(t){
  S.tab=t; S.view=null; S.tapSel=null; S.pick=null; renderGame(); focusStage();
}
function backToPlace(){ S.view=null; S.tapSel=null; renderGame(); focusStage(); }

/* 清单两段式：先选中看清这是什么，再按按钮才真花那一筹。
   规则同触屏热区——点条目只「选中」，确认键才执行；点同一项可撤销。 */
function pickSpot(sid){
  if(S.done[sid]){ showSpotResult(sid); return; }
  const sp = spotsOf(PLACE_MAP[S.current]).find(x=>x.id===sid);
  if(!sp || spotLocked(sp)) return;
  S.pick = (S.pick===sid) ? null : sid;
  if(S.pick) S.tapSel = sid; else S.tapSel = null;
  renderGame(); focusStage();
}
function pickTopic(tid){
  if(S.done[tid]){ showTopicResult(tid); return; }
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t || topicLocked(t)) return;
  /* 呈证型不必先选中再确认——它本来就要在弹层里挑证据，多一层反而累 */
  if(t.show){ openProve(tid); return; }
  S.pick = (S.pick===tid) ? null : tid;
  renderGame(); focusStage();
}
function clearPick(sid){ S.pick=null; S.tapSel=null; renderGame(); focusStage(); }

function spend(){
  if(S.ap>0){ S.ap--; S.settled++; return true; }
  toast("今日余筹已尽。","请结束本日，明日再来。");
  return false;
}

function doSpot(sid){
  const p = PLACE_MAP[S.current];
  const sp = spotsOf(p).find(x=>x.id===sid);
  if(!sp || S.done[sid]) return;
  if(!spend()) return;
  S.done[sid]=true;
  if(sp.clue) S.found[sp.clue]=true;
  S.tapSel=null; S.pick=null;
  S.view = {label: sp.name+(sp.clue?"":" · 勘验记录"), body: sp.clue?sp.body:sp.miss, clues: sp.clue?[sp.clue]:[]};
  renderGame(); scrollToStage();
}
function showSpotResult(sid){
  const sp = spotsOf(PLACE_MAP[S.current]).find(x=>x.id===sid);
  if(!sp) return;
  S.tapSel=null; S.pick=null;
  S.view = {label: sp.name+(sp.clue?"":" · 勘验记录"), body: sp.clue?sp.body:sp.miss, clues: sp.clue?[sp.clue]:[]};
  renderGame(); scrollToStage();
}

function doTopic(tid){
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t || S.done[tid] || topicLocked(t) || t.show) return;
  if(!spend()) return;
  S.done[tid]=true;
  (t.clues||[]).forEach(c=>S.found[c]=true);
  S.pick=null; S.tapSel=null;
  S.view = {label:t.label, body:t.body, clues:t.clues||[]};
  renderGame(); scrollToStage();
}
function showTopicResult(tid){
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t) return;
  S.pick=null;
  S.view = {label:t.label, body:t.body, clues:t.clues||[]};
  renderGame(); scrollToStage();
}

/* ---- 呈证 ---- */
function openProve(tid){
  if(S.ap<=0){ toast("今日余筹已尽。","请结束本日，明日再来。"); return; }
  const ids = Object.keys(S.found);
  if(!ids.length){ toast("你手上没有凭据。","空口问不进去——先去搜，去查，回头再来。"); return; }
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t) return;
  /* 手上若根本没有能与他对质的东西，就不让他白花这一筹 */
  const can = ids.filter(cid => (t.show||[]).includes(cid) && !S.denied[tid+":"+cid]);
  if(!can.length){
    toast("他还没有开口的由头。","空口问不进去。你手上这些东西，推到他面前，他只会看一眼，还给你。","（这一筹，不必花。先去别处搜一搜、翻一翻，手里有了东西再来。）");
    return;
  }
  S.pick=null;        /* 弹层已开，清单上的选中态撤掉，免得回来时还亮着 */
  const rows = ids.map(cid=>{
    const c = CLUES[cid];
    const dead = S.denied[tid+":"+cid];
    return `<div class="pv ${dead?"dead":""}" ${dead?"":`onclick="commitProve('${tid}','${cid}')"`}>
      <span class="pid">${cid.toUpperCase()}</span>
      <span>${c.name}</span>
      <span class="ptype">${dead?"已呈·被否":c.type}</span>
    </div>`;
  }).join("");
  const isVerify = !!t.proveLabel;
  const m = document.createElement("div");
  m.className="modal"; m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML = `<div class="modal-in">
    <h3>${t.proveLabel || "呈 证 逼 问"}</h3>
    <div class="ms">${t.label}</div>
    <p class="muted" style="font-size:13.5px;line-height:1.9">${isVerify?"挑一样东西递过去。":"挑一条凭据推过去。"}<b style="color:#e79aa2">${isVerify?"递错了，这一筹就白花了。":"挑错了，这一筹就白花了。"}</b>已被否认过的，不必再试。</p>
    <div class="provegrid" style="margin-top:16px">${rows}</div>
    <div style="margin-top:18px;text-align:right"><button class="btn sm ghost" onclick="this.closest('.modal').remove()">再 想 想</button></div>
  </div>`;
  document.body.appendChild(m);
}
function commitProve(tid,cid){
  document.querySelectorAll(".modal").forEach(x=>x.remove());
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t) return;
  if(!spend()) return;
  S.pick=null; S.tapSel=null;
  if((t.show||[]).includes(cid)){
    S.done[tid]=true;
    (t.clues||[]).forEach(c=>S.found[c]=true);
    S.view = {label:t.label, body:t.body, clues:t.clues||[]};
  } else {
    S.denied[tid+":"+cid]=true;
    S.view = {label:t.label+" · 呈证未果", body:t.wrong, clues:[]};
  }
  renderGame(); scrollToStage();
}

function showClue(cid){
  const c = CLUES[cid];
  const m = document.createElement("div");
  m.className="modal"; m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML = `<div class="modal-in">
    <h3>${c.name}</h3>
    <div class="ms">${c.type} · ${cid.toUpperCase()} · 得自${c.from}</div>
    <div class="cd" style="color:#ded2bc;font-size:14.5px">${c.desc}</div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <div class="cp"><b>指向 · </b>${c.point}</div>
      <div class="cp warn" style="margin-top:9px"><b>复 核 · </b>${c.warn}</div>
    </div>
    <div style="margin-top:20px;text-align:right"><button class="btn sm" onclick="this.closest('.modal').remove()">收 起</button></div>
  </div>`;
  document.body.appendChild(m);
}

function toast(t,s,small){
  const m = document.createElement("div");
  m.className="modal";
  m.innerHTML = `<div class="modal-in" style="max-width:430px;text-align:center">
    <h3>${t}</h3><p class="muted" style="font-size:13.5px;margin:10px 0 ${small?"7px":"18px"}">${s||""}</p>
    ${small?`<p class="dim" style="font-size:12.5px;margin-bottom:18px">${small}</p>`:""}
    <button class="btn primary sm" onclick="this.closest('.modal').remove()">知 道 了</button></div>`;
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
}

function endDay(confirmFirst){
  const left = PLACES.filter(p=>p.open<=S.round).reduce((n,p)=>
    n + spotsOf(p).filter(sp=>spotVisible(sp)&&!S.done[sp.id]).length
      + topicsOf(p).filter(t=>topicVisible(t)&&!S.done[t.id]).length, 0);
  if(confirmFirst && S.ap>0 && left>0){
    const m=document.createElement("div"); m.className="modal";
    m.innerHTML=`<div class="modal-in" style="max-width:470px;text-align:center">
      <h3>今日尚有 ${S.ap} 筹未用</h3>
      <p class="muted" style="font-size:13.5px;margin:10px 0 8px">这一日未查的去处，来日未必仍想得起来。<br>可筹用尽了，就真的没有了。</p>
      <p class="dim" style="font-size:12.5px;margin-bottom:16px">线索簿：已获 ${clueCount()} 条，尚有 <b style="color:var(--gold)">${TOTAL_CLUES-clueCount()}</b> 条未入手——来日仍可回头补。</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px">
        <button class="btn" onclick="this.closest('.modal').remove()">再 查 一 会</button>
        <button class="btn primary" onclick="this.closest('.modal').remove();forceEndDay()">结 束 本 日</button>
      </div></div>`;
    m.onclick=e=>{if(e.target===m)m.remove();};
    document.body.appendChild(m); return;
  }
  forceEndDay();
}
function forceEndDay(){
  if(S.round>=3){ renderVerdict(); return; }
  S.round++; S.ap=S.apMax[S.round]; S.current=null; S.view=null; S.tab=null; S.tapSel=null;
  renderGame(); backToTop();
}

/* ---------------- 结案 ---------------- */
const SUSPECTS = ["德妃 陈妙真","皇后 韩令仪","婉贵人 卫昭","大宫女 秋棠","太医 周鹤"];
const D_CHAIN = ["c07","c08","c09","c18","c22"];
const E_CHAIN = ["c10","c11","c14","c15","c16","c17","c19","c21","c26"];

function renderVerdict(){
  const evIds = Object.keys(S.found);
  const need = Math.min(3, evIds.length);
  const evHtml = evIds.length ? evIds.map(cid=>{
    const c=CLUES[cid];
    return `<div class="ev" data-cid="${cid}" onclick="toggleEv(this)">
      <span class="box">✓</span>
      <span class="eid">${cid.toUpperCase()}</span>
      <span>${c.name}</span>
      <span style="margin-left:auto;font-size:11px;color:var(--paper-3)">${c.type}</span>
    </div>`;
  }).join("") : `<div class="empty-note">你什么都没查到。<br>这一案，只能凭猜。</div>`;

  const misHtml = evIds.length ? (evIds.map(cid=>{
    const c=CLUES[cid];
    return `<div class="opt" data-v="${cid}" onclick="pick('q4',this)">
      <span class="dot"></span><span>${cid.toUpperCase()} · ${c.name}</span>
      <span class="ohint">${c.type}</span></div>`;
  }).join("") + `<div class="opt" data-v="__none__" onclick="pick('q4',this)">
      <span class="dot"></span><span>皆可采信 · 我没有发现伪证</span></div>`)
    : `<div class="empty-note">你什么都没查到，也无从剔除。</div>`;

  app().innerHTML = `
  <section id="verdict">
    <div class="vhead frame" style="padding:34px 26px 26px">
      <div class="kicker">Final Statement</div>
      <h1>结 案 陈 词</h1>
      <p>三日已尽 · 呈报圣裁</p>
    </div>

    <div class="frame" style="margin-top:16px">
      <div class="q">
        <div class="qn">第 一 问</div>
        <h4>是 谁 在 贵 妃 的 蜜 中 下 了 毒 ？</h4>
        <div class="opts" id="q1">
          ${SUSPECTS.map((s,i)=>`<div class="opt" data-v="${i}" onclick="pick('q1',this)">
            <span class="dot"></span><span>${s}</span>${['<span class="ohint">协办六宫节礼</span>','<span class="ohint">与贵妃结怨最深</span>','<span class="ohint">匣底藏着一包白粉</span>','<span class="ohint">端汤的人</span>','<span class="ohint">改药方的人</span>'][i]||''}</div>`).join("")}
        </div>
      </div>

      <div class="q">
        <div class="qn">第 二 问</div>
        <h4>是 谁 取 走 了 贵 妃 的 活 路 ， 使 其 必 死 ？</h4>
        <div class="opts" id="q2">
          ${SUSPECTS.map((s,i)=>`<div class="opt" data-v="${i}" onclick="pick('q2',this)">
            <span class="dot"></span><span>${s}</span></div>`).join("")}
          <div class="opt" data-v="9" onclick="pick('q2',this)">
            <span class="dot"></span><span>无人 · 只是毒发太快，来不及救</span></div>
        </div>
      </div>

      <div class="q">
        <div class="qn">第 三 问</div>
        <h4>呈 上 关 键 证 据</h4>
        <p class="dim" style="font-size:12.5px;margin-bottom:12px">你三日所获共 ${evIds.length} 条，可呈 <b style="color:var(--gold)">${need}</b> 条。</p>
        <div class="evpick" id="q3">${evHtml}</div>
      </div>

      <div class="q">
        <div class="qn">第 四 问</div>
        <h4>三 日 所 获 之 中 ， 哪 一 条 不 可 采 信 ？</h4>
        <p class="dim" style="font-size:12.5px;margin-bottom:12px">线索不都是真的。有的指向写得很明白，却是错的；有的看着像铁证，其实什么都证明不了。<b style="color:#e79aa2">这一案里必定有这样的东西</b>——把它挑出来。若你断定所获皆实，可选末一项。</p>
        <div class="opts" id="q4" style="max-height:280px;overflow:auto">${misHtml}</div>
      </div>

      <div class="q" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <button class="btn primary" onclick="submitVerdict()">呈 报 圣 裁</button>
        <button class="btn ghost" onclick="renderVerdict()">重 新 填 写</button>
        <span id="vErr" style="color:#dd8e84;font-size:13px"></span>
      </div>
    </div>
    <div class="foot">所举不必尽，所断不可疑。</div>
  </section>`;
  backToTop();
}

function pick(gid, el){
  el.parentNode.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
  el.classList.add("sel");
}
function toggleEv(el){
  const cap = Math.min(3, document.querySelectorAll("#q3 .ev").length);
  const sel = el.parentNode.querySelectorAll(".ev.sel");
  if(!el.classList.contains("sel") && sel.length>=cap){ toast(`只呈 ${cap} 条。`,"关键证据贵精不贵多。"); return; }
  el.classList.toggle("sel");
}

function submitVerdict(){
  const q1 = document.querySelector("#q1 .opt.sel");
  const q2 = document.querySelector("#q2 .opt.sel");
  const q4 = document.querySelector("#q4 .opt.sel");
  const evs = [...document.querySelectorAll("#q3 .ev.sel")].map(e=>e.dataset.cid);
  const err = document.getElementById("vErr");
  if(!q1||!q2){ err.textContent="前两问皆须作答。"; return; }
  const need = Math.min(3, Object.keys(S.found).length);
  if(evs.length < need){ err.textContent=`须举足 ${need} 条证据。`; return; }
  if(Object.keys(S.found).length>0 && !q4){ err.textContent="第四问须作答——剔出一条，或声明皆可采信。"; return; }

  const a1 = +q1.dataset.v, a2 = +q2.dataset.v;
  const dHit = evs.filter(x=>D_CHAIN.includes(x)).length;
  const eHit = evs.filter(x=>E_CHAIN.includes(x)).length;
  const dropped = q4 ? q4.dataset.v : "__none__";
  const badEv = evs.filter(x=>CLUES[x].mislead);
  S.verdict = {a1,a2,evs,dHit,eHit,dropped,badEv};
  renderReveal();
  backToTop();
}

/* ---------------- 复盘 ---------------- */
function renderReveal(){
  const v = S.verdict;
  const ok1 = v.a1===0, ok2 = v.a2===1;
  const both = ok1&&ok2, one = ok1||ok2;
  const dropped = (v.dropped && v.dropped!=="__none__") ? v.dropped : null;
  const droppedOk = !!(dropped && CLUES[dropped].mislead);
  const droppedWrong = !!(dropped && !CLUES[dropped].mislead);
  const badEv = v.badEv || [];
  const cleanEv = badEv.length===0;
  const full = both && v.dHit>=1 && v.eHit>=1 && cleanEv;
  let rank, rsub, rbody;

  if(full && droppedOk){
    rank="明镜高悬"; rsub="上 上 考";
    rbody="两只手你都指认了，两头的证据你都握在手里，还自己揪出了那条安在别人身上的伪证。三日之内做到这一步，靠的不是运气——你看的不是「谁最可疑」，是谁在什么时候关了哪一扇门。";
  }else if(full){
    rank="明镜高悬"; rsub="中 考";
    rbody="这一案你断对了：下毒的是德妃，断生路的是皇后，两头的证据也都立得住。可那条明摆着的伪证，你还当它是真的。断对了案，未必看得清证据——真到有人翻案的时候，这半条会被拿住。";
  }else if(both){
    rank="明镜高悬"; rsub="中 考";
    rbody="两个人你都指对了。但呈上的证据偏于一头，链条的另一半还虚着。若朝上有人翻案，你未必接得住。断案断得对，还要立得住。";
  }else if(one){
    rank="雾里看花"; rsub="下 考";
    rbody="你摸到了一半。这桩案子有两只手：一只下了毒，一只把门关上、把解药撤了、把试毒的人调走。你只抓住了其中一只——剩下那只，此刻大概正在长秋宫里饮茶。";
  }else{
    rank="风波亭外"; rsub="不 第";
    rbody="你指错了人。这一案里最像凶手的是婉贵人，最容易被人忽略的是皇后。三日的筹，你用在了看得到的地方。宫里的案子从来不靠动机断，靠时辰、靠档册、靠谁在什么时候说了什么话。";
  }
  let extra="";
  if(v.a1===2||v.a2===2) extra+='<br><span class="dim" style="font-size:13px">（婉贵人那条线：C23 妆匣夹层里那包白粉，其实是珍珠粉——入口不麻、无味、细润如脂，钩吻之末不是这个样子。她失宠后支不到脂粉，自己买珠子磨的，采买档上还记着「珍珠二两」。）</span>';
  if(v.a1===3||v.a2===3) extra+='<br><span class="dim" style="font-size:13px">（秋棠那条线：C27 她袖袋里那个空纸包，装的是薄荷与冰片——醒神散。她夜里守着贵妃，怕自己睡过去。她从头到尾只想让娘娘活下来。）</span>';
  if(v.a1===4||v.a2===4) extra+='<br><span class="dim" style="font-size:13px">（周鹤那条线：C25 他私药匣里那包灰白药末，是生甘草与紫苏——被皇后撤下来的两味。他偷偷留着，是想寻个机会给贵妃补回去。）</span>';
  if(droppedWrong) extra+='<br><span class="dim" style="font-size:13px">（你剔除的 '+dropped.toUpperCase()+'「'+CLUES[dropped].name+'」，是一条实打实的证据。剔除它不是网开一面，是自断臂膀。）</span>';

  const evRows = v.evs.length ? v.evs.map(cid=>{
    const c=CLUES[cid];
    const side = D_CHAIN.includes(cid) ? '<span style="color:#d59a5e">德妃链</span>'
              : (E_CHAIN.includes(cid) ? '<span style="color:#8fb3c9">皇后链</span>' : '<span class="dim">旁证</span>');
    return `<div class="chainli"><span class="cn">${cid.toUpperCase()}</span><span>${c.name} —— ${side}</span></div>`;

    <div class="frame sec">
      <h2><span class="num">壹</span>真 相 全 貌</h2>
      <p>贵妃沈婉不是死于一个人的手，而是死于两个人的默契。</p>
      <p><b style="color:var(--gold-2)">德妃陈氏</b>在上巳节礼的桂花蜜里下了钩吻末——她要贵妃死，因为沈家正与她父陈邕争两淮盐运，也因为贵妃之子一日日长，压着她的皇三子。她办六宫节礼，便有了单独调换那一瓶蜜的便利；她宫里的林忠，恰在御药房当过差。</p>
      <p><b style="color:var(--gold-2)">皇后韩氏</b>知道这件事。她在德妃身边有耳目。她没有揭发，也没有阻止。她做了三件事：<br>
      ——命太医撤去贵妃药中的生甘草与紫苏，让钩吻之毒发作时无所缓冲；<br>
      ——借「上巳后清整宫器」的常例，收走各宫试毒之器，调开毓秀宫的试毒宫女；<br>
      ——传下夜禁令，把两次求医的人关在门内，并在丑时明知贵妃垂危之后，回了四个字：「知道了，候。」</p>
      <p>德妃下的是毒。皇后断的是生路。<b style="color:#ffd9a0">没有德妃，贵妃不会中毒；没有皇后，贵妃未必会死。</b>这两个人加在一起，才是一条完整的因果链。</p>
      <p class="dim">而皇后最深的一层动机，藏在太医院的脉案里——贵妃孕已两月，未宣。中宫无子九年，这一胎是她的催命符，所以她才会对宫人说：「贵妃这一胎，是留不住的。留不住的东西，何必让她费心。」</p>
      <p style="margin-top:12px"><b style="color:var(--gold-2)">还有一支手：</b>案发之后，有人往《慎刑司案卷》里夹了一张反手写的字条，把罪按在婉贵人头上（C33/C34）。纸是档房通用的竹纸，墨是宫中处处有的松烟墨，笔迹是故意反着写的——它指不出任何人，你也不该用它断任何人。可它说明了一件事：<b>你翻哪一本卷、查到哪一步，都有人在看着。</b>封卷之后来调看过这本书的，有景仁宫的人，也有长秋宫的人。</p>
      <p class="dim">——这一案里值得分辨的，从来不只「谁最可疑」，还有「哪一条证据根本立不住」。</p>

    <div class="frame sec">
      <h2><span class="num">叁</span>手 法 拆 解</h2>
      <p><b style="color:#d59a5e">德妃的两步：</b>其一，借协办六宫节礼之便，涂改《分装单》，使毓秀宫那份由「蜜二瓶」改为「蜜一瓶、蜜饯二盒」，从而把掺毒的那一瓶单独隔离、单独交付；其二，命旧识林忠在分装房换瓶，封蜡照旧，使外观与他宫无异。钩吻末出自御药房外用杀虫的常例药，非禁药，不易引人起疑。</p>
      <p><b style="color:#8fb3c9">皇后的三步：</b>其一，<b style="color:var(--gold)">撤解药</b>——贵妃方中的生甘草、紫苏按例有和缓之效，撤去后毒性无所缓冲，发作骤急；其二，<b style="color:var(--gold)">去防备</b>——借常例收走试毒之器、调开试毒宫女，使贵妃无从自保；其三，<b style="color:var(--gold)">断生路</b>——传夜禁令，拦下亥、子、丑三次求医，丑时明知垂危仍不遣医。前两步是布局，第三步是决定。</p>
      <p class="dim">本案最狠的地方在于：皇后从头到尾没有碰过那瓶蜜。她做的每一件事，写在档册上都是「合规」的——清整宫器是常例，改药方是关切，夜禁是戒备。所以只查「谁下了毒」，永远查不到她。</p>
      <p style="margin-top:12px"><b style="color:var(--gold-2)">附论 · 宫里的「试毒」是怎么一回事：</b>本朝的试毒之制，靠的是银器。可银针验的是<b>硫</b>，不是钩吻——蜜饯熏硫、药材熏硫，连蜜瓶口的封纸都熏过，六宫的银针本来就乌，六宫的银匙本来就干净。这一案的死者身边有三重防线：一根银针、一名试毒宫女、一个每夜必服的安胎方。银针验不出钩吻，试毒宫女被一纸差遣调走，安胎方里两味缓毒的药被朱笔勾掉。<b style="color:#ffd9a0">三重防线，没有一重是真的。</b></p>
      <p class="dim">所以这一案真正的题眼不是「谁下了毒」，是「<b>谁在什么时候把防护一层层拆掉，且每一层都拆得合规</b>」。银针那一条，是留给细心的玩家的：你若从头到尾信银器，这案子的三个关键判断都会歪。</p>
    </div>

    <div class="frame sec">
      <h2><span class="num">肆</span>完 整 线 索 链</h2>
      <p class="dim" style="margin-bottom:14px">每个关键结论，都有两条以上独立线索指向。这就是为什么这一案可以被「推理」出来，而不是靠猜。</p>
      <div class="chain">
        <div class="chainli"><span class="cn">结论一</span><span><b style="color:var(--gold-2)">毒在蜜里，不在汤里，且是分装后被掺入的。</b><br>

        <div class="chainli"><span class="cn">结论四</span><span><b style="color:var(--gold-2)">皇后在当夜撤走了贵妃的自保手段。</b><br>

        <div class="chainli"><span class="cn">误导线 · 甲</span><span><b style="color:#dd8e84">婉贵人：最像凶手的人。</b><br>

        <div class="chainli"><span class="cn">误导线 · 乙</span><span><b style="color:#dd8e84">太医周鹤：手里握着灰白的药末。</b><br>
        → C25（私药匣里那包末，与盏底沉淀同色）<br>
        → C26（药童辨认：生甘草与紫苏，他偷偷留下研磨的）<br>
        <span class="dim">他的心虚不是因为杀了人，是因为偷偷留了药。</span></span></div>

        <div class="chainli"><span class="cn">误导线 · 丙</span><span><b style="color:#dd8e84">秋棠：端汤的人袖里有纸包。</b><br>

        → C28（醒神散：薄荷与冰片，她怕自己守夜睡过去）<br>
        <span class="dim">她从头到尾，只想让娘娘活下来。</span></span></div>

        <div class="chainli"><span class="cn">误导线 · 丁</span><span><b style="color:#dd8e84">封蜡相同，就是同一个人？——这条指向对了人，证据却是废的。</b><br>
        → C29（分装房工具台上的残蜡，与毒蜜瓶口同色同纹）<br>
        → C30（掌事宫女与库册：六宫封蜡本是一炉出，一个色儿）<br>
        <span class="dim">误导线必须能被证伪，不能是死胡同——这是本子的规矩，六条皆如此。</span></span></div>

        <div class="chainli"><span class="cn">误导线 · 戊</span><span><b style="color:#dd8e84">发乌的银针：本朝验毒之制，原是一层纸。</b><br>

        → C34（纸墨手三样皆无从溯源；封卷后两宫都来调看过）<br>
        <span class="dim">它把矛头指向婉贵人，与 C12 那封真信恰成对照：一个是被偷走的真心，一个是送到你手边的假话。</span></span></div>

    <div class="frame sec">
      <h2><span class="num">伍</span>本 案 的 误 导 线 索</h2>
      <p class="dim" style="margin-bottom:8px">本子里有六件「看着像铁证」的东西，分两型——</p>
      <p class="dim" style="margin-bottom:14px">
        <b style="color:#dd8e84">甲、乙、丙 ·「指向错人」</b>：东西是真的，安错了人。三个干净的人，各有各的心虚。<br>
        <b style="color:#dd8e84">丁、戊、己 ·「证据无效」</b>：指向的人也许没错，可这条证据本身什么都证明不了——<b>那样东西，满宫都有。</b>封蜡是一炉出的，银针是硫熏乌的，字条的纸是档房通用的。<br>
        六条都不是死胡同，每一条都必有另一条线索能把它推翻。<b style="color:#e79aa2">误导线索的规矩是：可以被骗，但不能被骗死。</b>
      </p>
      <div class="chain">
        <div class="chainli"><span class="cn">误导 · 甲</span><span><b style="color:#dd8e84">C23 妆匣夹层里的白粉</b>　<span class="dim">指向「婉贵人私藏毒粉」</span><br>
        <b style="color:var(--paper-2)">看起来：</b>失宠的贵人，把二钱白粉藏在匣底夹层。匣底夹层本就不是放脂粉的位置。<br>
        <b style="color:var(--paper-2)">真相：</b>珍珠粉。入口不麻、以水调开则沉底不散——钩吻之末才入口发麻、舌根发紧。她失宠后支不到脂粉，自己买珠子磨的。<br>
        <b style="color:var(--gold-2)">推翻它的线索：C24</b>（送验太医院：入口不麻、粉沉底不散；咸福宫采买档上记着「珍珠二两」）</span></div>

        <div class="chainli"><span class="cn">误导 · 乙</span><span><b style="color:#dd8e84">C25 私药匣里的一包药末</b>　<span class="dim">指向「太医周鹤投毒」</span><br>
        <b style="color:var(--paper-2)">看起来：</b>改药方的是他，改方之日正是贵妃死的那一日；他私匣里还藏着一包灰白药末，而贵妃盏底正沉着灰白色的粉。<br>
        <b style="color:var(--paper-2)">真相：</b>生甘草与紫苏，被撤下来的两味。他不敢明着违中宫的话，偷偷磨成末，想寻个机会给贵妃补回去。<br>
        <b style="color:var(--gold-2)">推翻它的线索：C26</b>（药童亲尝辨认：「娘娘的药，我看着被撤的」）<br>
        <span class="dim">这一条最狠：它是被真凶的另一只手逼出来的——皇后撤了药，才有了这包末。</span></span></div>

        <div class="chainli"><span class="cn">误导 · 丙</span><span><b style="color:#dd8e84">C27 秋棠袖袋里的纸包</b>　<span class="dim">指向「端汤的宫女下手」</span><br>
        <b style="color:var(--paper-2)">看起来：</b>那一夜汤是她端的，她袖里揣着一个空纸包，纸上留着一圈白。屋里没有第二个人碰过那盏汤。<br>
        <b style="color:var(--paper-2)">真相：</b>醒神散。她夜里守着贵妃，怕自己睡过去，困了就抿一点薄荷冰片。<br>
        <b style="color:var(--gold-2)">推翻它的线索：C28</b>（她说另一只袖子里还有半包；翻出来一验，辛凉刺鼻）</span></div>

        <div class="chainli"><span class="cn">误导 · 丁</span><span><b style="color:#dd8e84">C29 分装房里的封蜡残块</b>　<span class="dim">证据无效——这一条最特别</span><br>
        <b style="color:var(--paper-2)">看起来：</b>毒蜜瓶口的蜡，与景仁宫分装房那半块，同色同厚，连压出的纹路都像。换瓶的手，就在这间房里。<br>
        <b style="color:var(--paper-2)">真相：</b>宫中封蜡本由内务府一炉熬制、按宫分发。<b style="color:#e79aa2">它指向的人是对的（确是德妃），可它本身什么都证明不了。</b><br>
        <b style="color:var(--gold-2)">推翻它的线索：C30</b>（掌事宫女与库册：一炉出的，一个色儿）<br>
        <span class="dim">甲、乙、丙是「指向错人」，丁是「指向对了、证据是废的」。断案最容易栽在后一种——因为你正高兴。</span></span></div>

        <div class="chainli"><span class="cn">误导 · 戊</span><span><b style="color:#dd8e84">C31 通体发乌的试毒银针</b>　<span class="dim">证据无效——看着像「毒已经验出来了」</span><br>
        <b style="color:var(--paper-2)">看起来：</b>毓秀宫那根试毒银针通体乌黑。毒物早在案发之前就经了她的手、验了出来，却被收回去，没人报一句。试毒的人知情不报。<br>
        <b style="color:var(--paper-2)">真相：</b>银针乌，是碰到了<b>硫</b>——蜜饯、药材、蜜瓶口的封纸都熏过硫。它验不出钩吻；而七根银针里，乌着四根。<b style="color:#e79aa2">春禧不曾瞒报，她守的那道防线，一直是一层纸。</b><br>
        <b style="color:var(--gold-2)">推翻它的线索：C32</b>（药童：银针验的是砒，不是钩吻；「收它做什么？那东西本来也验不出什么」）<br>
        <span class="dim">这一条最伤：它不只推翻 C31，还把整个「试毒之制」一起推翻了——连你自己验过的香囊、蜜、白粉，凡靠银针得的判断，都要重来。</span></span></div>

        <div class="chainli"><span class="cn">误导 · 己</span><span><b style="color:#dd8e84">C33 案卷里夹着的一张字条</b>　<span class="dim">来源不明——看着像有人递给你内情</span><br>
        <b style="color:var(--paper-2)">看起来：</b>《慎刑司案卷》里夹着一张没头没尾的字条：「毓秀宫膳房有人下手，此事系咸福宫所为。三日之内，必得其证。」有人知道内情，也愿意告诉你。<br>
        <b style="color:var(--paper-2)">真相：</b>纸是档房通用的竹纸，墨是宫中处处有的松烟墨，字是<b>反手</b>写的——三样都无从溯源。它不是证据，是<b>诱饵</b>；有人算准了你会翻开这一页，也算准了你会想听那句话。<br>
        <b style="color:var(--gold-2)">推翻它的线索：C34</b>（档房书吏：纸、墨、手，一样都指不出来；而封卷之后，景仁宫与长秋宫的人都来调看过）<br>
        <span class="dim">这支手与婉贵人的真信，恰成一对：一封是她亲手写的求情书，落在别人箱底；一张是别人反手写的告密条，塞进你要翻的卷里。哪一封是真的，不看内容，看它从哪儿来。</span></span></div>
      </div>

    <div class="frame sec">
      <h2><span class="num">陆</span>人 物 · 动 机 与 秘 密</h2>
      <div class="role">
        <div class="rolecard"><div class="rn">皇后 韩令仪 · 三十二 · 正位中宫九年 · 无子</div>
          <div class="rl"><span>动机｜</span>贵妃孕已两月未宣，其子在朝中被议立储；兄韩骥任御史中丞，方被沈家参劾。「中宫无子」四个字，是她的死穴。<br>
          <span>秘密｜</span>她在德妃宫中安了耳目，三月初三之前就知道德妃要动手。她选了「不揭发，只补刀」。<br>
          <span>不能说的理由｜</span>一旦承认「我早知道」，便等于承认知情不救——那比下毒更难辩解。<br>
          <span>关系｜</span>与贵妃：三年不睦；与德妃：表面姐妹，实则互相提防、互相利用。</div></div>

        <div class="rolecard"><div class="rn">德妃 陈妙真 · 二十八 · 育皇三子 · 三年前由贵妃位降为德妃</div>
          <div class="rl"><span>动机｜</span>其子原最受喜爱，贵妃之子出生后失宠；父陈邕掌两淮盐运，与沈家争利，上巳宴上沈琮当众羞辱陈邕。<br>
          <span>秘密｜</span>她下毒是真的，但她以为只要贵妃「病」上一场，便能拖住议储。她至今不知道自己下的毒有多重。<br>
          <span>不能说的理由｜</span>领药的事有档可查，她只能靠「除虫」二字撑住。<br>
          <span>关系｜</span>与贵妃：争宠争子争利；与皇后：她以为皇后不知情。</div></div>

        <div class="rolecard"><div class="rn">婉贵人 卫昭 · 二十二 · 母家削爵流放</div>
          <div class="rl"><span>动机｜</span>母家被沈家构陷，她当众说过「以命换命」——最大的动机，也是最响的烟幕。<br>
          <span>秘密｜</span>她送信是求贵妃为母家说一句话，信被长秋宫截走；她根本不知道信落到了谁手里。<br>
          <span>不能说的理由｜</span>承认送信，等于承认自己有事相求，反被当作动机。<br>
          <span>关系｜</span>与贵妃：怨；与皇后：她曾在中宫当过差，皇后知道她每一步。</div></div>

        <div class="rolecard"><div class="rn">太医 周鹤 · 四十 · 掌贵妃脉案</div>
          <div class="rl"><span>动机｜</span>无杀人动机。他的问题是怕——怕丢官，怕丢命。<br>
          <span>秘密｜</span>他改了贵妃的药方，一开始谎称是自己「诊察不精」，直到被呈上脉案，才吐出「出自长秋宫」那半张撕剩的纸。<br>
          <span>不能说的理由｜</span>说了，便是把中宫拖下水，他一家老小都在京城。<br>
          <span>关系｜</span>与皇后：受制；与婉贵人：旧识，曾为她母家诊治。</div></div>

        <div class="rolecard"><div class="rn">大宫女 秋棠 · 二十 · 贵妃陪嫁入宫</div>
          <div class="rl"><span>动机｜</span>无。她是这一案里唯一一个从头到尾只想救人的人。<br>
          <span>秘密｜</span>她三月初二就被人捏住了软肋——弟弟被押，她被人警告「别多问」。所以三月初三夜里，她没敢再争。<br>
          <span>不能说的理由｜</span>说出来，弟弟就没了。<br>
          <span>关系｜</span>与贵妃：主仆情深；与长秋宫内侍：被要挟；与春禧：同宫姊妹。</div></div>

        <div class="rolecard"><div class="rn">试毒宫女 春禧 · 十八 · 毓秀宫 · 每夜为贵妃试汤</div>
          <div class="rl"><span>动机｜</span>无。她连贵妃喝的蜜里有什么都不知道。<br>
          <span>秘密｜</span>三月初三戌时，她被一纸出自长秋宫的派差签条调去搬绸缎。她以为那是内务府的差事，走的时候还跟秋棠说了句「我去去就回」。<br>
          <span>不能说的理由｜</span>她怕的是「试毒不力」四个字——本职没做，回来人已经没了。所以她一句也没敢提自己是被调走的。<br>
          <span>关系｜</span>与秋棠：同宫姊妹；与长秋宫内侍：只见过那一张签条，没见过人。<br>
          <span style="color:#e79aa2">她是 C31 那条误导线唯一的目标。</span>银针乌了、人又不在，看着就是她瞒报。可那根针，本来就是乌的。</div></div>

        <div class="rolecard"><div class="rn">小太监 林忠 · 十九 · 景仁宫当差 · 曾在御药房</div>
          <div class="rl"><span>动机｜</span>执行者。德妃许他一个去御膳房的缺。<br>
          <span>秘密｜</span>整件事他从头到尾不知情由，只知道「娘娘吩咐的，照做」——所以他的供词干净、完整、只指向德妃。<br>
          <span>关系｜</span>与德妃：家生奴才；与秋棠之弟：同是御膳房旧人。</div></div>
      </div>
    </div>

    <div class="frame sec">
      <h2><span class="num">柒</span>写 给 主 持 人 的 话</h2>
      <p><b style="color:var(--gold-2)">卡壳预案（三级）：</b></p>
      <p><b style="color:var(--gold)">一级 · 玩家卡在「毒从哪来」：</b>提示他去毓秀宫<b>勘验</b>那只青玉盏，看盏底没化开的粉末。指向 C02 / C07。</p>
      <p><b style="color:var(--gold)">二级 · 玩家锁定了德妃，认为可以结案：</b>提示「贵妃亥时饮汤，寅时才断气。这三个时辰里，宫里发生了什么？」指向 C15 / C16。</p>
      <p><b style="color:var(--gold)">三级 · 玩家思路全断：</b>直接让他去内务府档房勘验《宫器清整知会签》，再去宫门值房看夜册，自己读出「戌时末」与「亥时」的先后。</p>
      <p><b style="color:var(--gold)">另备 · 玩家被伪证领走（指认了婉贵人 / 周鹤 / 秋棠）：</b>不要直接说「你错了」。只问他一句：「这条线索，还有没有第二样东西能说明它？」——C23 对 C24、C25 对 C26、C27 对 C28。让他自己去找那条推翻它的。</p>
      <p><b style="color:var(--gold)">另备 · 玩家把 C29（那半块封蜡）当成铁证：</b>问他：「六宫节礼的封蜡，是不是本来就该是同一炉的？」再让他去景仁宫找掌事宫女问一句（C30）。这一课比抓错人更值钱——<b>指向对了，证据也可能是废的。</b></p>
      <p><b style="color:var(--gold)">另备 · 玩家把 C31（发乌的银针）当成铁证、咬住春禧：</b>只问一句：「匣里七根针，为什么乌着四根？」让他拿着针去太医院递物问药童（C32）。这一条一旦破了，顺势要提醒他把前三日所有靠银针得到的判断重想一遍——C02、C07、C24 都不例外。（C24 的药童是靠<b>尝</b>辨出来的，不是靠针。）</p>
      <p><b style="color:var(--gold)">另备 · 玩家信了 C33 那张字条：</b>问他两个问题：「这纸是哪来的？」「写字的人，为什么不署名？」再去内务府档房问书吏（C34）。要点在于：<b>这不是错线索，是有人替你准备好的答案。</b>顺手与 C12 那封真信对读——一封被偷走，一封被送来。</p>
      <p><b style="color:var(--gold)">进阶提问（给想深一层的玩家）：</b>「本案死者身边有几重防线？」引导他数出三重——银针、试毒宫女、每夜必服的安胎方。然后问：「哪一重是真的？」答案是：没有一重。</p>
      <hr class="rule">
      <p><b style="color:var(--gold-2)">复盘收束（本子的体验就落在这里）：</b>把「德妃下毒 + 皇后断生路」这条双线讲一遍，重点落在<b>「皇后做的每一件事，写在档册上都合规」</b>——这才是宫斗的底色。最后把那封没送出去的信读出来：「妾愿以三年寂寂，换母家一纸清白。」</p>
