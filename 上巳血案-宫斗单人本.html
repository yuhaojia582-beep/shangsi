<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上巳血案 · 古代宫斗单人推理本</title>
<style>
:root{
  --ink:#0c0709;
  --panel:#1c1216;
  --line:rgba(217,180,91,.20); --line-2:rgba(217,180,91,.42);
  --gold:#d9b45b; --gold-2:#f4dc95;
  --red-2:#c9303a;
  --jade:#6f9c86;
  --paper:#efe3ce; --paper-2:#bcab90; --paper-3:#8b7b64;
  --shadow:0 18px 46px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 620px at 12% -8%, rgba(158,32,41,.20), transparent 62%),
    radial-gradient(900px 560px at 96% 4%, rgba(111,156,134,.10), transparent 58%),
    radial-gradient(800px 700px at 50% 118%, rgba(217,180,91,.09), transparent 62%),
    var(--ink);
  color:var(--paper);
  font-family:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  font-size:15px;line-height:1.85;-webkit-font-smoothing:antialiased;min-height:100%;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:
    repeating-linear-gradient(0deg, rgba(217,180,91,.028) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(217,180,91,.022) 0 1px, transparent 1px 3px);
}
#app{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:22px 20px 60px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.03)}
::-webkit-scrollbar-thumb{background:rgba(217,180,91,.26);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(217,180,91,.45)}

.frame{border:1px solid var(--line);border-radius:4px;
  background:linear-gradient(180deg, rgba(36,23,32,.86), rgba(20,12,16,.92));
  box-shadow:var(--shadow);position:relative;}
.frame::after{content:"";position:absolute;inset:5px;border:1px solid rgba(217,180,91,.10);border-radius:2px;pointer-events:none;}
.seal{display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,#a8232d,#7d151d);color:#fbeedd;font-size:12px;letter-spacing:.28em;
  padding:7px 9px 7px 11px;border-radius:3px;writing-mode:vertical-rl;line-height:1.15;font-weight:600;
  box-shadow:0 3px 14px rgba(158,32,41,.45), inset 0 0 0 1px rgba(255,225,190,.28);}
.rule{height:1px;border:0;background:linear-gradient(90deg,transparent,var(--line-2) 18%,var(--line-2) 82%,transparent);margin:20px 0;}
.kicker{font-size:11px;letter-spacing:.42em;color:var(--gold);text-transform:uppercase;opacity:.85;}
.muted{color:var(--paper-2)}
.dim{color:var(--paper-3)}

@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* 开场 */
#intro{max-width:980px;margin:0 auto;padding:44px 40px 40px;animation:fade .9s ease both}
.intro-top{display:flex;gap:26px;align-items:flex-start;justify-content:space-between}
.intro-title{font-size:52px;letter-spacing:.2em;line-height:1.18;font-weight:700;
  background:linear-gradient(180deg,#fbeecb 12%,var(--gold) 62%,#9c7a2e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.intro-sub{margin-top:8px;color:var(--paper-2);letter-spacing:.24em;font-size:13px}
.docket{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.docket div{background:rgba(20,12,16,.72);padding:12px 15px}
.docket dt{font-size:11px;color:var(--paper-3);letter-spacing:.2em;margin-bottom:3px}
.docket dd{font-size:14px;color:var(--paper)}
.intro-body{margin-top:24px;color:#dccfb9}
.intro-body p{margin-bottom:11px}
.intro-note{margin-top:22px;border-left:2px solid var(--gold);padding:14px 0 14px 16px;
  background:linear-gradient(90deg,rgba(217,180,91,.08),transparent);font-size:13.5px;color:var(--paper-2);}
.intro-note ol{padding-left:20px;margin-top:8px}
.intro-note li{margin-bottom:5px;line-height:1.9}
.intro-note b{color:var(--gold-2)}
.intro-actions{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}

.btn{border:1px solid var(--line-2);background:rgba(217,180,91,.07);color:var(--gold-2);
  font-family:inherit;font-size:14px;letter-spacing:.16em;padding:11px 26px;border-radius:3px;
  cursor:pointer;transition:.22s;position:relative;}
.btn:hover{background:rgba(217,180,91,.16);border-color:var(--gold);box-shadow:0 0 22px rgba(217,180,91,.2);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(145deg,#a8232d,#7f161e);border-color:rgba(255,220,180,.3);color:#fdeee0;box-shadow:0 6px 22px rgba(158,32,41,.4)}
.btn.primary:hover{background:linear-gradient(145deg,#c02b36,#981b24);box-shadow:0 8px 30px rgba(200,43,54,.5)}
.btn.ghost{background:transparent;color:var(--paper-2);border-color:var(--line)}
.btn.ghost:hover{color:var(--gold-2)}
.btn.sm{padding:7px 15px;font-size:12.5px;letter-spacing:.1em}

/* 主界面 */
#game{animation:fade .5s ease both}
.topbar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 20px;
  border:1px solid var(--line);border-radius:4px;
  background:linear-gradient(180deg,rgba(43,27,36,.92),rgba(22,13,17,.94));box-shadow:var(--shadow);}
.topbar .brand{font-size:19px;letter-spacing:.2em;color:var(--gold-2)}
.topbar .brand small{display:block;font-size:11px;letter-spacing:.3em;color:var(--paper-3);margin-top:2px}
.daypips{display:flex;gap:7px;margin-left:6px}
.pip{padding:5px 13px;font-size:12.5px;letter-spacing:.14em;border-radius:2px;border:1px solid var(--line);color:var(--paper-3);background:rgba(0,0,0,.24)}
.pip.on{border-color:var(--gold);color:#1a1014;background:linear-gradient(180deg,var(--gold-2),var(--gold));font-weight:700}
.pip.done{color:var(--jade);border-color:rgba(111,156,134,.5)}
.topbar .spacer{flex:1}
.apbox{display:flex;align-items:center;gap:12px}
.apbox .lab{font-size:11px;letter-spacing:.26em;color:var(--paper-3)}
.apdots{display:flex;gap:5px}
.apdot{width:11px;height:11px;border-radius:50%;border:1px solid rgba(217,180,91,.55);background:transparent;transition:.25s}
.apdot.on{background:radial-gradient(circle at 35% 32%,#fbe9b6,var(--gold));border-color:var(--gold-2)}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr) 310px;gap:16px;margin-top:16px;align-items:start}
@media(max-width:1180px){.layout{grid-template-columns:220px minmax(0,1fr)}.col-right{grid-column:1/-1}}
@media(max-width:820px){.layout{grid-template-columns:1fr}.col-right{grid-column:auto}}

.panel{border:1px solid var(--line);border-radius:4px;
  background:linear-gradient(180deg,rgba(33,21,28,.88),rgba(18,11,14,.94));box-shadow:var(--shadow);position:relative;}
.panel-h{padding:11px 16px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.3em;color:var(--gold);
  background:linear-gradient(90deg,rgba(217,180,91,.10),transparent);display:flex;justify-content:space-between;align-items:center;}
.panel-b{padding:12px}

.place{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;margin-bottom:7px;
  border:1px solid transparent;border-radius:3px;cursor:pointer;transition:.2s;background:rgba(255,255,255,.018);}
.place:hover{background:rgba(217,180,91,.09);border-color:rgba(217,180,91,.24)}
.place.on{background:linear-gradient(90deg,rgba(158,32,41,.28),rgba(158,32,41,.06));border-color:rgba(201,48,58,.6)}
.place.locked{opacity:.4;cursor:not-allowed}
.place.locked:hover{background:rgba(255,255,255,.018);border-color:transparent}
.p-ico{flex:0 0 30px;height:30px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:2px;font-size:14px;color:var(--gold);background:rgba(0,0,0,.3)}
.place.on .p-ico{border-color:var(--gold);background:rgba(217,180,91,.14)}
.p-name{font-size:14.5px;color:var(--paper);letter-spacing:.08em}
.p-sub{font-size:11.5px;color:var(--paper-3);line-height:1.5;margin-top:1px}
.p-badge{font-size:10px;color:var(--jade);margin-left:auto;white-space:nowrap;padding-top:3px}

.stage{padding:22px 26px 26px;min-height:420px}
.stage-h{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px}
.stage-h h2{font-size:26px;letter-spacing:.16em;color:var(--gold-2);font-weight:600}
.stage-h .sub{font-size:12.5px;color:var(--paper-3);letter-spacing:.14em;margin-top:4px}
.stage-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:380px;text-align:center;color:var(--paper-3)}
.stage-empty .big{font-size:60px;color:rgba(217,180,91,.16);margin-bottom:14px}
.stage-empty p{max-width:470px;font-size:13.5px;line-height:2}

/* 页签 */
.tabs{display:flex;gap:9px;margin-top:18px}
.tab{padding:8px 20px;border:1px solid var(--line);border-radius:2px;cursor:pointer;font-size:13.5px;
  letter-spacing:.2em;color:var(--paper-3);transition:.2s;background:rgba(255,255,255,.015);}
.tab:hover{border-color:var(--gold);color:var(--gold-2)}
.tab.on{background:linear-gradient(180deg,rgba(217,180,91,.24),rgba(217,180,91,.06));border-color:var(--gold);color:var(--gold-2)}
.tab .cnt{font-size:11px;margin-left:8px;opacity:.72;letter-spacing:.06em}
.tabnote{margin-top:13px;font-size:12.5px;color:var(--paper-3);line-height:1.9;
  border-left:2px solid rgba(217,180,91,.35);padding-left:11px;background:linear-gradient(90deg,rgba(217,180,91,.05),transparent);}

/* 场景（勘验 · 问话通用） */
.scene{position:relative;margin-top:16px;border:1px solid var(--line);border-radius:3px;overflow:hidden;
  background:radial-gradient(130% 96% at 50% 6%, #2a1c24, #0a0608 82%);box-shadow:inset 0 0 60px rgba(0,0,0,.6);}
.scene-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.scene svg{display:block;width:100%;height:auto}
.scene-pan{display:none;padding:6px 14px;font-size:11px;letter-spacing:.22em;color:var(--paper-3);
  text-align:center;border-top:1px solid var(--line);background:rgba(0,0,0,.34)}
.scene-tip{padding:9px 16px;border-top:1px solid var(--line);font-size:12.5px;letter-spacing:.05em;
  min-height:42px;display:flex;align-items:center;gap:10px;line-height:1.65;
  background:linear-gradient(90deg,rgba(217,180,91,.07),transparent 74%);color:var(--paper-3);transition:.2s}
.scene-tip b{color:var(--gold-2);font-weight:600;letter-spacing:.1em}
.scene-tip i{font-style:normal;color:var(--paper-3)}
.scene-tip.on{color:var(--paper-2)}
.scene-tip.on b{color:var(--gold-2)}
.scene-tip .go{color:#e79aa2;white-space:nowrap}
/* 热区 */
.hs{fill:transparent;stroke:transparent;stroke-width:1.6;cursor:pointer;pointer-events:all;transition:fill .18s,stroke .18s}
.hs:hover{fill:rgba(217,180,91,.10);stroke:var(--gold);stroke-dasharray:5 3}
.hs.sel{fill:rgba(217,180,91,.16);stroke:var(--gold);stroke-dasharray:5 3}
.hs.lock{cursor:not-allowed}
.hs.lock:hover{fill:rgba(255,255,255,.03);stroke:rgba(217,180,91,.4)}
.hs.fin:hover{fill:rgba(111,156,134,.11);stroke:var(--jade)}
/* 场景内状态点 */
.hsm{pointer-events:none}
.hsm.todo circle{fill:#d9b45b;opacity:.4;animation:breath 2.8s ease-in-out infinite}
.hsm.hit circle{fill:#f4dc95;opacity:.95}
.hsm.hit circle.ring{fill:none;stroke:#f4dc95;stroke-opacity:.5;stroke-width:1}
.hsm.miss circle{fill:#5f554b;opacity:.65}
@keyframes breath{0%,100%{opacity:.26}50%{opacity:.72}}
.sec-lab{margin-top:22px;margin-bottom:2px;font-size:11px;letter-spacing:.32em;color:var(--paper-3);
  padding-bottom:8px;border-bottom:1px solid var(--line)}

/* 搜查点 */
.spotgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:11px;margin-top:16px}
.spot{border:1px solid var(--line);border-radius:3px;padding:13px 15px 12px;cursor:pointer;transition:.22s;
  background:linear-gradient(160deg,rgba(217,180,91,.05),transparent 72%);position:relative;}
.spot:hover{border-color:var(--gold);background:linear-gradient(160deg,rgba(217,180,91,.15),transparent 72%);transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.34)}
.spot .sn{font-size:14px;color:#e6dac4;letter-spacing:.04em;margin-bottom:5px;padding-right:48px}
.spot .sh{font-size:12px;color:var(--paper-3);line-height:1.7}
.spot .sf{position:absolute;top:12px;right:13px;font-size:11px;letter-spacing:.1em}
.spot.hit{border-color:rgba(217,180,91,.55);background:linear-gradient(160deg,rgba(217,180,91,.18),transparent 72%)}
.spot.hit .sf{color:var(--gold)}
.spot.hit .sn{color:var(--gold-2)}
.spot.miss{opacity:.5;border-color:rgba(255,255,255,.07);background:none}
.spot.miss .sf{color:var(--paper-3)}
.spot.locked{opacity:.42;cursor:not-allowed;border-style:dashed}
.spot.locked:hover{transform:none;border-color:var(--line);background:linear-gradient(160deg,rgba(217,180,91,.05),transparent 72%);box-shadow:none}
.spot.locked .sf{color:var(--paper-3)}

/* 选中待确认：金框 + 呼吸光，与热区的 .sel 同一套语汇 */
.spot.pick{border-color:var(--gold);background:linear-gradient(160deg,rgba(217,180,91,.2),transparent 72%);
  box-shadow:0 0 0 1px rgba(217,180,91,.35),0 10px 26px rgba(0,0,0,.4);animation:pickPulse 2.2s ease-in-out infinite}
.spot.pick:hover{transform:none}
.spot.pick .sf{color:var(--gold-2)}
.spot.pick .sn{color:var(--gold-2)}
@keyframes pickPulse{0%,100%{box-shadow:0 0 0 1px rgba(217,180,91,.35),0 10px 26px rgba(0,0,0,.4)}
  50%{box-shadow:0 0 0 1px rgba(217,180,91,.7),0 10px 30px rgba(0,0,0,.5),0 0 18px rgba(217,180,91,.16)}}
.sdock{margin-top:12px;padding-top:11px;border-top:1px dashed rgba(217,180,91,.3);
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.sdock-t{flex:1;font-size:11.5px;color:var(--gold-2);letter-spacing:.1em;white-space:nowrap}
@media(max-width:430px){.sdock-t{flex:1 1 100%}}

/* 话题 */
.actlist{margin-top:16px;display:grid;gap:11px}
.act{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:3px;
  cursor:pointer;transition:.22s;background:linear-gradient(90deg,rgba(217,180,91,.05),transparent 70%);flex-wrap:wrap}
.act:hover{border-color:var(--gold);background:linear-gradient(90deg,rgba(217,180,91,.14),transparent 70%);transform:translateX(3px)}
.act.done{cursor:default;opacity:.6;border-color:rgba(111,156,134,.32);background:rgba(111,156,134,.05)}
.act.done:hover{transform:none;border-color:rgba(111,156,134,.32);background:rgba(111,156,134,.05)}
.act.locked{cursor:not-allowed;opacity:.44;border-style:dashed}
.act.locked:hover{transform:none;border-color:var(--line);background:linear-gradient(90deg,rgba(217,180,91,.05),transparent 70%)}
.act .a-no{flex:0 0 auto;font-size:11px;letter-spacing:.14em;color:var(--gold);border:1px solid var(--line);padding:3px 7px;border-radius:2px;white-space:nowrap}
.act.done .a-no{color:var(--jade);border-color:rgba(111,156,134,.42)}
.act.locked .a-no{color:var(--paper-3)}
.act .a-txt{flex:1;font-size:14.5px;color:#e6dac4;letter-spacing:.04em}
.act.done .a-txt,.act.locked .a-txt{color:var(--paper-3)}
.act .a-cost{font-size:11.5px;color:var(--paper-3);letter-spacing:.1em;white-space:nowrap}
.act.prove{background:linear-gradient(90deg,rgba(158,32,41,.14),transparent 70%);border-color:rgba(201,48,58,.4)}
.act.prove:hover{border-color:var(--red-2);background:linear-gradient(90deg,rgba(158,32,41,.24),transparent 70%)}
.act.prove .a-no{color:#e79aa2;border-color:rgba(201,48,58,.5)}
.act.pick{border-color:var(--gold);background:linear-gradient(90deg,rgba(217,180,91,.2),transparent 70%);
  box-shadow:0 0 0 1px rgba(217,180,91,.35),0 10px 26px rgba(0,0,0,.4);animation:pickPulse 2.2s ease-in-out infinite}
.act.pick:hover{transform:none}
.act.pick .a-no{color:var(--gold-2);border-color:rgba(217,180,91,.5)}
.act.pick .a-txt{color:var(--gold-2)}
.adock{flex:1 1 100%;padding-top:11px;border-top:1px dashed rgba(217,180,91,.3);
  display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* 阅读区 */
.read{animation:rise .45s ease both}
.dialogue{margin-top:20px;padding:20px 22px;border-left:2px solid rgba(201,48,58,.55);
  background:linear-gradient(90deg,rgba(158,32,41,.10),transparent 76%);font-size:15px;line-height:2.05;color:#e9ddc7;}
.dialogue p{margin-bottom:12px}
.dialogue p:last-child{margin-bottom:0}
.dialogue .say{color:#f3e4c6}
.dialogue .narr{color:var(--paper-2);font-size:14px}
.dialogue strong{color:#ffd9a0;font-weight:600}
.dialogue.barren{border-left-color:rgba(140,140,140,.35);background:linear-gradient(90deg,rgba(255,255,255,.035),transparent 76%)}

.cluepop{margin-top:18px;border:1px solid var(--line-2);border-radius:3px;padding:15px 17px;
  background:linear-gradient(160deg,rgba(217,180,91,.10),rgba(20,12,16,.6));animation:rise .5s .1s ease both;}
.cluepop .ch{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.cluepop .ct{font-size:15px;color:var(--gold-2);letter-spacing:.1em}
.tag{font-size:10.5px;letter-spacing:.16em;padding:2px 8px;border-radius:2px;border:1px solid currentColor;opacity:.9}
.tag.物证{color:#d59a5e} .tag.证词{color:#8fb3c9} .tag.时间{color:#7fc0a3}
.cluepop .cd{font-size:14px;color:#ded2bc;line-height:1.95}
.cluepop .cp{margin-top:10px;font-size:13.5px;line-height:1.9}
.cluepop .cp b{color:var(--gold);font-weight:600;letter-spacing:.06em}
.cluepop .cp.warn b{color:#d98b7a}

/* 线索簿 */
.cluebox{max-height:560px;overflow-y:auto;padding:12px}
.cluegrp{margin-bottom:14px}
.cluegrp .gh{font-size:11px;letter-spacing:.26em;color:var(--paper-3);margin-bottom:7px}
.cluecard{padding:9px 11px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;
  font-size:13px;color:#d5c9b4;cursor:pointer;transition:.2s;background:rgba(255,255,255,.02);}
.cluecard:hover{border-color:var(--gold);background:rgba(217,180,91,.1);color:var(--gold-2)}
.cluecard .cid{font-size:10px;color:var(--paper-3);letter-spacing:.1em;margin-right:6px}
.empty-note{color:var(--paper-3);font-size:13px;text-align:center;padding:26px 10px;line-height:2}

/* 弹窗 */
.modal{position:fixed;inset:0;background:rgba(6,3,5,.86);backdrop-filter:blur(5px);
  display:flex;align-items:center;justify-content:center;padding:24px;z-index:60;animation:fade .25s ease both;}
.modal-in{max-width:680px;width:100%;max-height:84vh;overflow-y:auto;border:1px solid var(--line-2);
  border-radius:4px;padding:26px 30px;background:linear-gradient(180deg,rgba(40,25,34,.98),rgba(19,11,15,.99));
  box-shadow:0 30px 80px rgba(0,0,0,.7);animation:rise .32s ease both;}
.modal-in h3{font-size:20px;color:var(--gold-2);letter-spacing:.14em;margin-bottom:5px}
.modal-in .ms{font-size:12px;color:var(--paper-3);letter-spacing:.16em;margin-bottom:16px}

.provegrid{display:grid;gap:8px;max-height:400px;overflow-y:auto;padding-right:4px}
.pv{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1px solid var(--line);border-radius:3px;
  cursor:pointer;font-size:13.5px;color:#cfc3ae;transition:.2s;background:rgba(255,255,255,.015);}
.pv:hover{border-color:var(--red-2);background:rgba(158,32,41,.13);color:#f0dcc8}
.pv .pid{font-size:10.5px;color:var(--paper-3);letter-spacing:.08em}
.pv .ptype{margin-left:auto;font-size:11px;color:var(--paper-3)}
.pv.dead{opacity:.4;cursor:not-allowed}
.pv.dead:hover{border-color:var(--line);background:rgba(255,255,255,.015);color:#cfc3ae}
.pv.dead .ptype{color:#a56a62}

/* ==================== 解密：物证辨读 / 暗号破译 ==================== */
.dmz{position:fixed;inset:0;background:rgba(6,3,5,.9);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:20px;z-index:70;animation:fade .25s ease both}
.dmz-in{max-width:620px;width:100%;max-height:88vh;overflow-y:auto;border:1px solid var(--line-2);
  border-radius:4px;padding:24px 28px 22px;background:linear-gradient(180deg,rgba(42,26,36,.99),rgba(17,10,14,.99));
  box-shadow:0 30px 80px rgba(0,0,0,.75);animation:rise .32s ease both}
.dmz-k{font-size:10.5px;letter-spacing:.3em;color:var(--gold);margin-bottom:6px}
.dmz-in h3{font-size:19px;color:var(--gold-2);letter-spacing:.12em;margin-bottom:4px}
.dmz-in .dmz-sub{font-size:12.5px;color:var(--paper-3);line-height:1.85;margin-bottom:16px}
.dmz-plate{margin:14px 0;padding:18px 16px;border:1px solid var(--line);border-radius:3px;
  background:rgba(0,0,0,.26);text-align:center;line-height:2.1}
.dmz-plate .glyph{display:inline-block;min-width:30px;margin:0 3px;font-size:22px;letter-spacing:.04em;
  color:#d8c9a8;font-family:"Songti SC",serif;cursor:pointer;border-bottom:1px dashed transparent;transition:.18s}
.dmz-plate .glyph.on{color:#0e0a0c;background:var(--gold-2);border-radius:2px;border-bottom-color:var(--gold)}
.dmz-plate .glyph.off{color:var(--paper-3);opacity:.5}
.dmz-plate .glyph.lock{cursor:default;opacity:.75}
.dmz-plate .glyph .mini{display:block;font-size:9px;letter-spacing:0;opacity:.65;margin-top:-2px}
.dmz-hint{font-size:12px;color:#a8988a;line-height:1.9;margin-top:4px}
.dmz-hint b{color:var(--gold-2)}
.dmz-try{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dmz-msg{font-size:12.5px;margin-top:10px;line-height:1.8;min-height:20px}
.dmz-msg.ok{color:#8fc9a0}
.dmz-msg.no{color:#dd8e84}
.dmz-read{margin-top:14px;padding:14px 16px;border:1px solid rgba(217,180,91,.36);border-radius:3px;
  background:linear-gradient(160deg,rgba(217,180,91,.11),transparent 70%)}
.dmz-read .rl{font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:8px}
.dmz-read p{font-size:13.5px;color:#e6d9c2;line-height:2}
/* 暗号对照表 */
.cyphtbl{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin-top:10px}
.cyphtbl .cc{padding:6px 4px;border:1px solid var(--line);border-radius:3px;text-align:center;font-size:12px;
  background:rgba(255,255,255,.02);cursor:pointer;transition:.18s}
.cyphtbl .cc:hover{border-color:var(--gold);background:rgba(217,180,91,.12)}
.cyphtbl .cc.used{opacity:.35}
.cyphtbl .cc b{display:block;color:var(--gold-2);font-size:14px;letter-spacing:.1em}
.cyphtbl .cc span{color:var(--paper-3);font-size:10.5px}
/* 解密入口徽记 */
.tag.dm{background:rgba(150,90,190,.2);color:#c9a5e0;border-color:rgba(150,90,190,.5)}
.dmchk{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#c9a5e0;margin-left:6px}
.dmchk::before{content:"⌘";font-size:12px}

/* ==================== 调查方向 ==================== */
.focusbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:11px 14px;margin-bottom:12px;
  border:1px solid rgba(217,180,91,.26);border-radius:3px;background:linear-gradient(160deg,rgba(217,180,91,.08),transparent 76%)}
.focusbar .fl{font-size:10.5px;letter-spacing:.24em;color:var(--gold);white-space:nowrap}
.focusbar .fc{font-size:12.5px;color:#e6d9c2;letter-spacing:.06em}
.focusbar .fx{margin-left:auto;font-size:11.5px;color:var(--paper-3)}
.focusgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:11px;margin-top:6px}
.fcard{padding:15px 16px;border:1px solid var(--line);border-radius:4px;cursor:pointer;transition:.2s;
  background:rgba(255,255,255,.015)}
.fcard:hover{border-color:var(--gold);background:rgba(217,180,91,.09);transform:translateY(-2px)}
.fcard.on{border-color:var(--gold-2);background:linear-gradient(160deg,rgba(217,180,91,.2),transparent 74%);
  box-shadow:0 0 0 1px rgba(217,180,91,.4)}
.fcard .fi{font-size:20px;margin-bottom:7px}
.fcard .fn{font-size:15px;color:var(--gold-2);letter-spacing:.1em;margin-bottom:6px}
.fcard .fd{font-size:12px;color:#b3a692;line-height:1.85}
.fcard .fb{margin-top:9px;font-size:11px;color:#8fc9a0;letter-spacing:.04em}
.fcard .fy{margin-top:5px;font-size:11px;color:#c9a5e0;letter-spacing:.04em}
.fcard.on .fb{color:var(--gold-2)}

/* ==================== 探听 ==================== */
/* 与「调查方向」并列的第二块：方向决定你「能查到什么」，
   探听决定你「肯不肯换一种办法去查」。所以配色刻意与方向分开——
   方向是金，探听是暗红（脏手），刑讯那一路另加一层朱色。 */
.eavesbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 14px;margin-bottom:12px;
  border:1px solid rgba(158,32,41,.34);border-radius:3px;
  background:linear-gradient(160deg,rgba(158,32,41,.09),transparent 76%)}
.eavesbar .el{font-size:10.5px;letter-spacing:.24em;color:#d98b7a;white-space:nowrap}
.eavesbar .ec2{font-size:12.5px;color:#e6d9c2;letter-spacing:.06em}
.eavesbar .ex{margin-left:auto;font-size:11.5px;color:var(--paper-3)}
.eavesbar .ex b{color:#e79aa2}
.eavesbar.used{opacity:.62;border-color:var(--line);background:none}
.eavesbar.used .el{color:var(--paper-3)}
.eavesbar.used .ec2{color:var(--paper-2)}
.evgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:11px;margin-top:6px}
.evcard{position:relative;padding:15px 16px 14px;border:1px solid var(--line);border-radius:4px;cursor:pointer;
  transition:.2s;background:rgba(255,255,255,.015)}
.evcard:hover{border-color:#c9727f;background:rgba(158,32,41,.12);transform:translateY(-2px)}
.evcard.hard:hover{border-color:var(--red-2);background:rgba(158,32,41,.2)}
.evcard.dead{opacity:.4;cursor:not-allowed;transform:none!important}
.evcard.dead:hover{border-color:var(--line);background:none}
.evcard .ei{font-size:19px;margin-bottom:7px}
.evcard .en{font-size:14.5px;color:#e8b3ab;letter-spacing:.08em;margin-bottom:6px}
.evcard.hard .en{color:#e79aa2}
.evcard .ed{font-size:12px;color:#b3a692;line-height:1.85}
.evcard .ep{margin-top:9px;font-size:11px;color:#d59a5e;letter-spacing:.04em}
.evcard.hard .ep{color:#e79aa2}
.evcard .eg{margin-top:5px;font-size:11px;color:#8fc9a0;letter-spacing:.04em}
.evcard .eb{margin-top:6px;font-size:10.5px;color:var(--paper-3);line-height:1.7}
.evpick{display:grid;gap:9px;max-height:52vh;overflow:auto}
.evpv{padding:12px 14px;border:1px solid var(--line);border-radius:3px;cursor:pointer;transition:.18s;
  display:flex;gap:9px;align-items:baseline;background:rgba(255,255,255,.015)}
.evpv:hover{border-color:#c9727f;background:rgba(158,32,41,.12)}
.evpv .etag{font-size:10.5px;color:#d98b7a;border:1px solid rgba(158,32,41,.45);border-radius:2px;
  padding:1px 6px;white-space:nowrap;flex:0 0 auto}
.evpv .evn{font-size:13px;color:#e6d9c2;line-height:1.7}
.evpv .evw{margin-left:auto;font-size:10.5px;color:var(--paper-3);white-space:nowrap}
/* 听墙角的三分运气：结果页给一个成色标记 */
.evmark{display:inline-block;margin-left:8px;font-size:10.5px;letter-spacing:.1em;
  padding:1px 7px;border-radius:2px;border:1px solid var(--line-2);color:var(--paper-3)}
.evmark.good{color:#8fc9a0;border-color:rgba(143,201,160,.45)}
.evmark.void{color:#dd8e84;border-color:rgba(221,142,132,.45)}

/* ==================== 结局 ==================== */
.endings{display:grid;gap:12px;margin-top:6px}
.ecard{padding:18px 20px;border:1px solid var(--line);border-radius:4px;cursor:pointer;transition:.2s;
  background:rgba(255,255,255,.015)}
.ecard:hover{border-color:var(--red-2);background:rgba(158,32,41,.1)}
.ecard.on{border-color:var(--gold-2);background:linear-gradient(160deg,rgba(217,180,91,.18),transparent 74%)}
.ecard .en{font-size:15.5px;color:var(--gold-2);letter-spacing:.1em;margin-bottom:7px}
.ecard .ed{font-size:12.5px;color:#b3a692;line-height:1.9}
.ecard .eg{margin-top:9px;font-size:11px;letter-spacing:.06em;color:var(--paper-3)}
.erank{font-size:30px;letter-spacing:.24em;color:var(--gold-2);font-weight:600;text-align:center;margin:2px 0 4px}
.esub{text-align:center;font-size:12px;letter-spacing:.28em;color:var(--gold);margin-bottom:16px}
.ebranch{font-size:13.5px;color:#e6d9c2;line-height:2.05;text-align:left}

/* 结案 */
#verdict{max-width:900px;margin:0 auto;animation:fade .5s ease both}
.vhead{text-align:center;padding:34px 20px 22px}
.vhead h1{font-size:38px;letter-spacing:.3em;color:var(--gold-2);font-weight:600}
.vhead p{color:var(--paper-3);letter-spacing:.2em;font-size:12.5px;margin-top:8px}
.q{padding:22px 26px;border-top:1px solid var(--line)}
.q .qn{font-size:11px;letter-spacing:.28em;color:var(--gold);margin-bottom:6px}
.q h4{font-size:17px;color:#f0e3ca;letter-spacing:.08em;font-weight:600;margin-bottom:14px}
.opts{display:grid;gap:9px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 15px;border:1px solid var(--line);border-radius:3px;
  cursor:pointer;transition:.2s;background:rgba(255,255,255,.018);font-size:14px;color:#dbcfb9;}
.opt:hover{border-color:var(--gold);background:rgba(217,180,91,.09)}
.opt.sel{border-color:var(--red-2);background:linear-gradient(90deg,rgba(158,32,41,.26),rgba(158,32,41,.05));color:#f7e6d4}
.opt .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line-2);flex:0 0 auto;position:relative}
.opt.sel .dot{border-color:var(--red-2)}
.opt.sel .dot::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--red-2)}
.opt .ohint{margin-left:auto;font-size:11px;color:var(--paper-3);letter-spacing:.08em}
.evpick{display:grid;gap:7px;max-height:340px;overflow-y:auto;padding-right:4px}
.ev{display:flex;align-items:center;gap:11px;padding:10px 13px;border:1px solid var(--line);border-radius:3px;
  cursor:pointer;font-size:13.5px;color:#cfc3ae;transition:.2s;background:rgba(255,255,255,.015);}
.ev:hover{border-color:var(--gold);background:rgba(217,180,91,.08)}
.ev.sel{border-color:var(--gold);background:linear-gradient(90deg,rgba(217,180,91,.2),transparent);color:var(--gold-2)}
.ev .box{width:13px;height:13px;border:1px solid var(--line-2);border-radius:2px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:10px}
.ev.sel .box{background:var(--gold);border-color:var(--gold);color:#1a1014}
.ev .eid{font-size:10px;color:var(--paper-3);letter-spacing:.08em}

/* 复盘 */
#reveal{max-width:1000px;margin:0 auto;animation:fade .55s ease both}
.score{text-align:center;padding:34px 24px 26px;border:1px solid var(--line-2);border-radius:4px;
  background:linear-gradient(180deg,rgba(43,27,36,.9),rgba(18,11,14,.94));box-shadow:var(--shadow);}
.score .rank{font-size:44px;letter-spacing:.4em;font-weight:700;
  background:linear-gradient(180deg,#fbeecb,var(--gold) 60%,#96742a);-webkit-background-clip:text;background-clip:text;color:transparent;}
.score .rsub{color:var(--paper-2);letter-spacing:.22em;font-size:12.5px;margin-top:10px}
.score .rbody{margin-top:18px;color:#ded2bc;font-size:14.5px;max-width:640px;margin-left:auto;margin-right:auto;line-height:2;text-align:left}
.checks{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chk{font-size:12.5px;padding:6px 14px;border-radius:2px;border:1px solid;letter-spacing:.1em}
.chk.ok{color:#8fc9a8;border-color:rgba(111,156,134,.6);background:rgba(111,156,134,.1)}
.chk.no{color:#dd8e84;border-color:rgba(201,48,58,.55);background:rgba(158,32,41,.12)}
.sec{margin-top:22px;padding:26px 30px}
.sec h2{font-size:21px;color:var(--gold-2);letter-spacing:.18em;margin-bottom:6px;font-weight:600}
.sec h2 .num{font-size:12px;color:var(--paper-3);letter-spacing:.2em;display:block;margin-bottom:4px}
.sec p{color:#ddd1bb;margin-bottom:11px}
.sec p:last-child{margin-bottom:0}
.tbl{width:100%;border-collapse:collapse;margin-top:14px;font-size:13.5px}
.tbl th{text-align:left;padding:9px 12px;color:var(--gold);font-weight:600;letter-spacing:.1em;
  border-bottom:1px solid var(--line-2);background:rgba(217,180,91,.06);font-size:12.5px}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);color:#d4c8b2;vertical-align:top;line-height:1.8}
.tbl tr.key td{background:rgba(158,32,41,.13);color:#f2e4cf}
.tbl tr.key td:first-child{box-shadow:inset 3px 0 0 var(--red-2)}
.chain{margin-top:14px}
.chainli{display:flex;gap:14px;padding:13px 16px;border-left:2px solid rgba(217,180,91,.4);
  background:linear-gradient(90deg,rgba(217,180,91,.07),transparent);margin-bottom:9px;font-size:14px;color:#dbcfb9;}
.chainli .cn{flex:0 0 auto;color:var(--gold);letter-spacing:.1em;font-size:12.5px;padding-top:2px}
.role{display:grid;gap:10px;margin-top:14px}
.rolecard{padding:14px 17px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.018)}
.rolecard .rn{font-size:15px;color:var(--gold-2);letter-spacing:.1em;margin-bottom:5px}
.rolecard .rl{font-size:13.5px;color:#cfc3ae;line-height:1.9}
.rolecard .rl span{color:var(--gold);font-size:12px;letter-spacing:.08em}
.foot{text-align:center;margin-top:26px;color:var(--paper-3);font-size:12px;letter-spacing:.16em;line-height:2}

/* ---------------- 窄屏 / 手机 ---------------- */
/* grid / flex 子项默认 min-width:auto，会让可横滑的孩子把整页撑宽 —— 一律放开 */

<script>
/* =========================================================
   上巳血案 · 古代宫斗单人推理本
   真相：德妃在节礼桂花蜜中下钩吻 / 皇后撤解药·撤试毒·传夜禁断其生路
   玩法：勘验（搜现场，含干扰项）+ 问话（呈证逼问）
   ========================================================= */

/* ---------------- 线索库（22条） ---------------- */
const CLUES = {
  c01:{name:"贵妃遗体的勘验",type:"时间",desc:"面色青紫，唇甲发绀，指端有细密红点，身上无一处外伤。",point:"验状显示：毒自口入，其征与钩吻相合。凶器是什么、经由谁的的手，尚在验状之外。",warn:"凶器从何而来，验状给不出答案。可把盏、瓶、药炉一路问下去。",from:"毓秀宫 · 勘验"},
  c02:{name:"盏底的灰白沉淀",type:"物证",desc:"青玉盏底沉着一层灰白粉末，未化于蜜水。以水调之，粉沉底不散；就烛火焙之，散出微辛之气。",point:"沉淀为事后掺入之粉末，掺杂仓促、未及化开——可见掺入发生在蜜已盛瓶之后。掺者的身份与时机，还须另寻。",warn:"掺手是在盛瓶之后动的——那么盛瓶的是谁、经手几回，便值得一问。",from:"毓秀宫 · 勘验"},
  c03:{name:"三月初三 · 太液池宫宴",type:"证词",desc:"皇后亲赐一盏长春酒于贵妃。贵妃以「近日脾胃不适」推辞，未起身接盏。满座皆静。皇后持盏立了半晌，笑道：「妹妹的病，倒是挑着日子来的。」宴散时贵妃先行，未向皇后辞。",point:"宫宴之上，皇后与贵妃当众结怨，满宫皆见。此为动机之一种，与当夜那盏汤之间尚隔一层。",warn:"动机有了，时辰还没有。宫宴散到亥时之间，各人在何处，是一条待查的线。",from:"长秋宫 · 问话"},
  c05:{name:"「我愿以命换命」",type:"证词",desc:"宫宴上沈琮（贵妃之弟）当众重提盐引旧案，语带讥讽。婉贵人执盏而起，只说八个字：「若我母家清白，我愿以命换命。」座中无人应声。三月初三酉时，有人见咸福宫宫人在毓秀宫外墙下徘徊。",point:"婉贵人在宴上语出惊人，案发前又有宫人在毓秀宫外墙下徘徊。举动是可查的，落在什么时辰更可查。",warn:"她当夜走的是哪条路、几时回的宫，问一句便知。",from:"咸福宫 · 问话"},
  c06:{name:"秋棠的当夜",type:"时间",desc:"亥时娘娘命我取节礼那瓶桂花蜜，冲一盏安神蜜汤。娘娘饮了半盏，说「这蜜不对，口里发麻」，命我去请太医。我到宫门，门吏说「今夜宫中有旨，各宫无旨不得出入」。子时娘娘腹痛，我又去，仍被拦。丑时娘娘已不能言语，我跪在门内哭求——门吏说，「已遣人禀报长秋宫了」。",point:"自饮汤至身故约三个时辰，其间两次求医皆被宫门拦下。秋棠所供，可以与她当夜的行迹两相核对。",warn:"门是谁拦的、依的哪一道令，比汤是谁端的更要紧。",from:"毓秀宫 · 问话"},
  c09:{name:"太医院脉案",type:"证词",desc:"周鹤称：贵妃孕已两月，胎象尚稳，此事宫中未宣，只太医院脉案有记。死因系钩吻中毒，由口入，发作应在亥时之后。",point:"脉案记：贵妃孕已两月，宫中未宣。此条须与遗体勘验、改方之事合看，方见分量。",warn:"此胎有谁知情？知情人越少，能动手的人越少。",from:"太医院 · 问话"},
  c10:{name:"那瓶桂花蜜",type:"物证",desc:"毓秀宫余下的小半瓶桂花蜜，蜜色较他宫所赐者深浊，瓶底沉有灰白粉末，以水调之则沉底不散。另取景仁宫、咸福宫同批节礼之桂花蜜并验，蜜色清亮，瓶底无物。",point:"六宫同批节礼，唯此一瓶蜜色深浊、瓶底有物。它为何独异，要看分装与交付那两环。",warn:"分装那一环经手者不止一人。从领单到交付，逐一手对过去。",from:"毓秀宫 · 勘验"},
  c12:{name:"涂改的分装单",type:"物证",desc:"内务府《上巳节六宫节礼分装单》载：各宫例得「桂花蜜二瓶」。毓秀宫一栏「二瓶」二字被刮去，改书「一瓶、蜜饯二盒」。墨色新于他行，改笔出自景仁宫掌事宫女之手。",point:"分装单上「二瓶」被刮改作「一瓶、蜜饯二盒」，墨色新于他行，笔出自景仁宫掌事宫女。改笔之人与改后这瓶蜜的去向，皆可再问。",warn:"改笔之下原先写的是什么，可与库册原底对读。",from:"内务府档房 · 勘验"},
  c13:{name:"御药房 · 三月初一领药档",type:"物证",desc:"《御药房出入档》记：三月初一辰时，景仁宫小太监林忠领「钩吻末」三钱，用途栏书「除园中虫豸」。钩吻外用杀虫，非禁药，然宫中已多年无人领取。",point:"《御药房出入档》载：三月初一辰时，景仁宫小太监林忠领钩吻末三钱，用途栏书「除园中虫豸」。此药外用杀虫，本非禁物，然宫中已多年无人领取。",warn:"三钱毒去了哪里？领的人未必用的人，可再追一步。",from:"御药房 · 勘验"},
  c15:{name:"被朱笔勾去的两味",type:"物证",desc:"贵妃安胎方原含「生甘草」与「紫苏」，为太医院按例配入，用以和药性、缓诸毒。三月初三上午的脉案上，此二味被朱笔勾去，改加「砂仁」，批注「脾胃不和，甘草性滞」。落笔者为太医周鹤。",point:"原方中之生甘草、紫苏被朱笔勾去，改加砂仁，批注「脾胃不和，甘草性滞」；落笔者为太医周鹤。改方之日与案发之日相同。",warn:"他是执笔的，未必是开口的。帘后有没有第二人，值得一问。",from:"太医院 · 勘验"},
  c16:{name:"内务府 ·「清整宫器」令",type:"物证",desc:"三月初三戌时，内务府传出「上巳后清整宫器」之令，收各宫银针、银箸、试毒之器，言「节后重验成色」。然《知会签》上画押的传令内侍，名在长秋宫册上。毓秀宫试毒之器亦在被收之列。",point:"三月初三戌时，内务府传出「清整宫器」之令，收各宫银针银箸；《知会签》上画押的传令内侍，名在长秋宫册上。此令是否合于旧例，往年档册可对。",warn:"往年此令何时出、由谁出，翻一翻旧档便知有无先例。",from:"内务府档房 · 勘验"},
  c17:{name:"未送出的信",type:"物证",desc:"长秋宫一名宫人的箱底，压着一封未送出的信。信是婉贵人所书，通篇为母家旧案求贵妃「于圣前进一言」，末句「妾愿以三年寂寂，换母家一纸清白」。无一字怨言，亦无一字涉毒。",point:"婉贵人所书之信落在长秋宫宫人箱底：通篇为母家求情，无一字涉毒。信既未送出，也未退回——它如何到了这口箱子里，是一条可查的线。",warn:"信如何入了那口箱子，是此条唯一未合上的环。",from:"长秋宫 · 勘验"},
  c19:{name:"被扣押的小太监",type:"证词",desc:"秋棠的弟弟在御膳房当差。三月初二午后，他被人以「盗用御膳」为由押走，押人的内侍出自长秋宫。至案发，人仍未放。秋棠供称：扣押当日，有人对她说过一句——「好好当你的差，别多问。」",point:"秋棠之弟于三月初二午后被以「盗用御膳」为由押走，押人的内侍出自长秋宫，至案发未放。押人的由头与当日御膳房的情形，可以两问。",warn:"押人的由头若查不实，这条线就该往下追问是谁的意思。",from:"毓秀宫 · 问话"},
  c21:{name:"节后的派差签条",type:"证词",desc:"三月初三戌时，毓秀宫试毒宫女春禧被派去帮着搬运上巳赏赐的绸缎。差事出自内务府，而转下画押的，是一枚长秋宫的私记。她走后，毓秀宫当夜无人试毒。",point:"三月初三戌时，试毒宫女春禧被派去搬运上巳赏赐；差事出自内务府，转下画押者却是长秋宫私记。她走后，毓秀宫当夜无人试毒。",warn:"差事是真的，签条是真的——那转下这一纸的人，是何居心？",from:"内务府档房 · 勘验"},
  c23:{name:"宫门值房 · 夜册",type:"时间",desc:"《宫门值房夜册》记：三月初三申时末，长秋宫传令「今夜宫中有警，宫门酉时即闭，各宫无旨不得出入」；酉时宫门落锁、各门加派二人。同夜亥时、子时、丑时，毓秀宫三次有人至门求见太医，皆被驳回，驳由皆为「夜禁」。",point:"《宫门值房夜册》载：申时末传令「宫门酉时即闭，各宫无旨不得出入」，酉时落锁；同夜毓秀宫三次求医皆被驳回。传令之时，宫宴未散、贵妃未饮汤。此令是常例还是特例，可查旧档。",warn:"把这道令与上一道令并排摆出来，再看它来的时候，宫里出了什么事。",from:"宫门值房 · 勘验"},
  c24:{name:"门吏的口供",type:"证词",desc:"值夜内侍供称：丑时毓秀宫宫女在门内哭求，他曾「遣人疾走长秋宫禀报贵妃危殆」。长秋宫回话只有四个字：「知道了，候。」此后无人来，也无人遣医。他再问，回话是「娘娘已歇」。",point:"值夜内侍供称，丑时曾遣人疾走长秋宫禀报，得回话四字：「知道了，候。」此后无人来、无人遣医。此四字出自谁的吩咐，尚可追问。",warn:"值房传话有定例：谁当值、几时传、传与谁，应有记档可比。",from:"宫门值房 · 问话"},
  c26:{name:"太医的翻供",type:"证词",desc:"周鹤在得知贵妃有孕、且所撤二味正是缓毒之药后翻供：三月初三上午长秋宫召他入内，皇后隔着帘子说——「贵妃脾胃弱，甘草性滞，去了罢。紫苏也换掉。」他答「此二味是太医院旧例」。帘内答：「旧例是给常人定的。她的药，我说了算。」他不敢再争。",point:"周鹤翻供称：三月初三上午长秋宫召见，帘内命去甘草、换紫苏，他答「此二味是太医院旧例」，帘内答「旧例是给常人定的」。此供宜与他先前的话对读。",warn:"两次供词可并列看：哪一句是他自己想的，哪一句是别人教他的。",from:"太医院 · 呈证"},
  c27:{name:"小太监林忠的供词",type:"证词",desc:"林忠（押于慎刑司）供：三月初一，德妃命他去御药房领钩吻末，说是「园里虫多」。三月初三酉时，德妃又命他到分装房，把一瓶已备好的桂花蜜「换到毓秀宫那份里」，并交代「瓶口封蜡要跟别的一样」。他所知仅此。（分装房在内廷当值，宫门之禁不禁当差走动，故他这一趟并不违禁。）",point:"林忠供出景仁宫在分装环节调换瓶盏之事。其供可与分装单、领药档、封蜡三处互证；至于中宫一线，此供尚未涉及。",warn:"他经手的只是分装那一环，再往上一层的线，还得另找凭据。",from:"内务府档房 · 勘验"},
  c28:{name:"长秋宫的「关切」",type:"证词",desc:"三月初三上午皇后召见周鹤之后，对身侧宫人说过一句话。此话由长秋宫一名宫人供出：「贵妃这一胎，是留不住的。留不住的东西，何必让她费心。」——与「撤药」一事的时点，正好衔接。",point:"长秋宫一名宫人供出，三月初三上午皇后曾言「贵妃这一胎，是留不住的」。转述需有旁证，此话可曾入档、可有人同闻，尚待一问。",warn:"转述须有第二人同闻。长秋宫当日在侧者几人，可以点名。",from:"长秋宫 · 问话"},
  c30:{name:"婉贵人的自陈",type:"证词",desc:"婉贵人见得那封信，久不能言。她自陈：三月初三托宫中管事送信，为母家求情。送信的宫人在毓秀宫外墙下徘徊，是因宫门已闭（酉时已行夜禁），进不去。信未送到，也未退回——后来在长秋宫宫人的箱中被寻出。「以命换命」说的是「以我三年寂寂，换母家一纸清白」。",point:"婉贵人自陈：三月初三遣人送信为母家求情，宫门已闭故在墙下徘徊；信未送到亦未退回，后在长秋宫宫人箱中寻出。她的举动与时辰可以对一遍。",warn:"送信之人还在，可问他把信交给了谁。",from:"咸福宫 · 呈证"},
  c31:{name:"那一碗没端上的药",type:"证词",desc:"秋棠供称：贵妃饮蜜汤后觉异，曾对她说「去把安胎的药煎来，我这几日都靠它」。秋棠跑去药房，药房已按夜禁闭门，她空手而回。贵妃服药的习惯是每夜必饮——药中本有甘草、紫苏二味。",point:"秋棠供称，贵妃饮蜜汤后曾命她去煎安胎药，药房已闭，空手而回。贵妃本每夜必服此药，药中含甘草、紫苏二味。煎药未成是事实，因由还须看当夜情形。",warn:"当夜药房为何闭门，是例禁还是有人吩咐，一句可查。",from:"毓秀宫 · 问话"},
  c33:{name:"先说了「虫」的人",type:"证词",desc:"你把御药房的领药档推到她面前。德妃只看了一瞬，便抬起头——「除虫的药末，也算罪证？」你还没说出那是什么药。",point:"你将领药档推至德妃面前，她未待你言明是何药，便答「除虫的药末，也算罪证？」——此条记的是她的应对，不是别的东西。",warn:"她备了这套说辞，是给谁听的？此处宜记下，来日对质再用。",from:"景仁宫 · 呈证"},

  /* ===== 误导线索组 · 甲：婉贵人 =====
     看起来是「私藏毒粉」的铁证，实为珍珠粉。证伪线索 c22。 */
  c04:{name:"妆匣夹层里的白粉",type:"物证",mislead:true,refute:["c22"],flag:"指向错误",
    desc:"你启开婉贵人的妆匣。木匣底下是活的，掀开那层薄板，下面压着一个折成方胜的纸包——白粉，约莫二钱，细腻无味。",
    point:"一只旧木匣的夹层里，藏着二钱许灰白色粉末；夹层本非放脂粉之处。此粉究竟是什么，尚待验明。",
    warn:"若验出是脂粉，这条便另作别论；若不是，再问它从何而来。",
    truth:"那是珍珠粉。婉贵人失宠后脂粉例份早停，她自己买珍珠磨来敷面。此粉入口不麻、细润如脂——钩吻之末不是这个样子。",
    from:"咸福宫 · 勘验"},

  c22:{name:"药童验过的那包粉",type:"物证",desc:"你把那包白粉送到太医院。药童拈起一点，凑近闻了闻——无味；再蘸一点含在舌尖上，片刻吐掉，摇头：「不麻。」他说钩吻的末入口发麻、舌根发紧，这一个不麻。又以水调开，粉沉底不散，指间一捻，细润如脂。他翻了翻咸福宫的采买档：三月初三，「珍珠二两」。",
    point:"药童所验：此粉不麻、无味、细润如脂。二钱白粉对二两珍珠——数量恰相仿佛。是否与盏底之物同源，还须比对。",
    warn:"两处白粉的品名若对得上，这个环就合上了；对不上，则须另寻出处。",
    from:"太医院 · 呈证"},

  /* ===== 误导线索组 · 乙：太医周鹤 =====
     灰白药末与盏底沉淀同色，看似他投毒。实为被撤的两味。证伪线索 c29。 */
  c11:{name:"私药匣里的一包药末",type:"物证",mislead:true,refute:["c29"],flag:"指向错误",
    desc:"太医院值房，周鹤的私药匣扣着锁，锁是坏的一掰就开。匣中一格，收着一小包药末——灰白色，细而微涩，气味极淡。你对着光看，越看越觉得，它与青玉盏底那层沉淀，像一个东西。",
    point:"太医周鹤的私药匣中藏有一包灰白色药末。改方之人是他，改方之日正是案发之日；贵妃盏底亦沉着灰白粉末。此药末的品名，尚待验明。",
    warn:"包上的封记、匣内的余痕，都还能验。验明了品名，这条线才有分晓。",
    truth:"那是生甘草与紫苏，他自己研磨的——被撤下来的两味。",
    from:"太医院 · 勘验"},

  c29:{name:"药童的辨认",type:"证词",desc:"你把那包药末递给药童。他拈一点送进嘴里，尝了尝，又吐出来，脸色忽然很难看：「这是生甘草和紫苏——磨成末的。」他说，周太医三月初三那天，把撤下来的两味各留了一份，夜里自己研磨。问他做什么用，太医只说了一句：「娘娘的药，我看着被撤的。」",

/* ---------------- 场景（勘验 · 问话） ----------------
   每处地点两幅：search = 勘验现场（带可点热区），talk = 问话场景（纯氛围）。
   热区 id 一律对应 spots 的 id；标记点默认落在热区中心，可用 mx / my 覆盖。
   未定义场景的地点，自动回退到原来的清单式排布。
----------------------------------------------------- */
/* ---------------- 场景绘制 kit ----------------
   十一幅场景共用同一套底子：墙 / 地 / 光柱 / 匾 / 棂窗 / 门 / 案 / 柜 / 架 /
   卷册 / 灯 / 炉 / 榻 / 人。改一处即全体生效，画风不会走散。
   坐标系：viewBox 0 0 1120 460；地平线默认 y=356。
---------------------------------------------------- */
const KIT = (()=>{
  let n = 0;
  const U = ()=> "k" + (++n) + "x";

  function defs(k,o){
    o = o||{};
    return `<defs>
<linearGradient id="${k}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.w1||"#2d1f28"}"/><stop offset="1" stop-color="${o.w2||"#150e12"}"/></linearGradient>
<linearGradient id="${k}f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.f1||"#1a1217"}"/><stop offset="1" stop-color="${o.f2||"#090507"}"/></linearGradient>
<linearGradient id="${k}r" x1="0.6" y1="0" x2="0.1" y2="1"><stop offset="0" stop-color="#f4dc95" stop-opacity="0"/><stop offset=".3" stop-color="#f4dc95" stop-opacity=".12"/><stop offset=".72" stop-color="#f4dc95" stop-opacity=".045"/><stop offset="1" stop-color="#f4dc95" stop-opacity="0"/></linearGradient>
<linearGradient id="${k}c" x1="0.5" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#c8d8ee" stop-opacity="0"/><stop offset=".3" stop-color="#c8d8ee" stop-opacity=".14"/><stop offset="1" stop-color="#c8d8ee" stop-opacity="0"/></linearGradient>
<radialGradient id="${k}l"><stop offset="0" stop-color="#ffd88c" stop-opacity=".46"/><stop offset="1" stop-color="#ffd88c" stop-opacity="0"/></radialGradient>
<pattern id="${k}b" width="112" height="42" patternUnits="userSpaceOnUse"><path d="M0 0H112M0 42H112" stroke="#d9b45b" stroke-opacity=".05" fill="none"/><path d="M56 0V42" stroke="#d9b45b" stroke-opacity=".035" fill="none"/></pattern>
</defs>`;
  }

  /* 墙 · 地 · 光柱 · 竖柱；bg 画在墙面之上、地面之下 */
  /* 房梁：给吊灯一个"挂点"，否则灯像悬在无形天花板上。beam:{x,w,h}
     刻意画得很淡（只比墙面亮一点点），免得在缩略图里成一条抢眼的横杠 */
  function beam(o){
    o = o||{};
    const list = Array.isArray(o.beam) ? o.beam : (o.beam ? [o.beam] : []);
    return list.map(b=>{
      const w = b.w||1120, x = b.x==null?0:b.x, h = b.h||13;
      /* 梁 = 顶面受压的暗色 + 一条极淡的下缘高光 + 底部的投影，模拟枋木 */
      return `<rect x="${x}" y="0" width="${w}" height="${h}" fill="#33222b" fill-opacity=".55"/>`
        + `<path d="M${x} ${h-1}H${x+w}" stroke="#d9b45b" stroke-opacity=".11"/>`
        + `<rect x="${x}" y="${h-2}" width="${w}" height="2" fill="#d9b45b" fill-opacity=".05"/>`
        + `<rect x="${x}" y="${h}" width="${w}" height="7" fill="#080406" fill-opacity=".5"/>`
        + `<rect x="${x}" y="0" width="2" height="${h}" fill="#d9b45b" fill-opacity=".07"/>`
        + `<rect x="${x+w-2}" y="0" width="2" height="${h}" fill="#d9b45b" fill-opacity=".07"/>`;
    }).join("");
  }

  function room(k,o){
    o = o||{};
    const fy = o.floorY==null ? 356 : o.floorY;
    const cols = (o.cols||[]).map(x=>`<path d="M${x} 0V${fy}"/>`).join("");
    return `<rect width="1120" height="${fy}" fill="url(#${k}w)"/>`
      + (cols ? `<g stroke="#d9b45b" stroke-opacity=".04" fill="none">${cols}</g>` : "")
      + (o.bg||"")
      + `<rect y="${fy-2}" width="1120" height="${462-fy}" fill="url(#${k}f)"/>
<rect y="${fy-2}" width="1120" height="${462-fy}" fill="url(#${k}b)"/>
<path d="M0 ${fy-2}H1120" stroke="#d9b45b" stroke-opacity=".22"/>`
      + (o.ray ? `<polygon points="${o.ray}" fill="url(#${k}r)"/>` : "")
      + (o.beam ? beam(o) : "");

      + (t ? `<text x="${x+w/2}" y="${y+h/2+(o.fs||20)*0.36}" text-anchor="middle" font-size="${o.fs||20}" fill="#d9b45b" fill-opacity=".6" letter-spacing="${o.ls||7}">${t}</text>` : "");

    for(let j=y+st; j<y+h-4; j+=st) bars += `<path d="M${x} ${j}H${x+w}"/>`;
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#18222e" stroke="#d9b45b" stroke-opacity=".34"/>`
      + (o.moon ? `<circle cx="${o.moon[0]}" cy="${o.moon[1]}" r="${o.moon[2]||13}" fill="#dfe8f2" fill-opacity=".2"/><circle cx="${o.moon[0]}" cy="${o.moon[1]}" r="${(o.moon[2]||13)*2.6}" fill="url(#${o.k}c)"/>` : "")
      + `<g stroke="#d9b45b" stroke-opacity=".15" fill="none">${bars}</g>`;

    o = o||{};
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#0b1017" stroke="#d9b45b" stroke-opacity=".32"/>
<circle cx="${x+w*0.72}" cy="${y+h*0.2}" r="${o.moon||14}" fill="#dfe8f2" fill-opacity=".18"/>
<rect x="${x}" y="${y}" width="${w*0.34}" height="${h}" fill="#3a2731" fill-opacity=".82" stroke="#d9b45b" stroke-opacity=".24"/>
<path d="M${x+w*0.3} ${y+8}v${h-16}" stroke="#d9b45b" stroke-opacity=".2"/>
<path d="M${x+w*0.82} ${y+h*0.52}h10" stroke="#d9b45b" stroke-opacity=".4"/>`;
  }

  /* 朱门 + 门钉 + 门环 */
  function gate(x,y,w,h,o){
    o = o||{};
    const rows = o.rows||5, cols = o.cols||4;
    const lw = w/2, mx = lw*0.15, my = h*0.075;
    const cw = (lw - 2*mx)/cols, rh = (h - 2*my)/rows;
    let studs = "";
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const cy = y + my + rh*(r+0.5);
      [x, x+lw].forEach(lx=>{
        const cx = lx + mx + cw*(c+0.5);
        studs += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${Math.max(3.4,Math.min(5,rh*0.14)).toFixed(1)}" fill="#d9b45b" fill-opacity=".24" stroke="#d9b45b" stroke-opacity=".34"/>`;
      });
    }
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#4a151b" fill-opacity="${o.op||".5"}" stroke="#d9b45b" stroke-opacity=".28"/>
<path d="M${x+w/2} ${y}V${y+h}" stroke="#d9b45b" stroke-opacity=".26"/>
${studs}
<circle cx="${x+w*0.4}" cy="${y+h*0.46}" r="9" fill="none" stroke="#d9b45b" stroke-opacity=".42" stroke-width="1.6"/>
<circle cx="${x+w*0.6}" cy="${y+h*0.46}" r="9" fill="none" stroke="#d9b45b" stroke-opacity=".42" stroke-width="1.6"/>`;
  }

  /* 案 / 桌 */
  function table(x,y,w,h,o){
    o = o||{};
    const th = o.th||13, ins = o.ins||10;
    return `<rect x="${x}" y="${y}" width="${w}" height="${th}" fill="#3d2b34" stroke="#d9b45b" stroke-opacity=".34"/>
<rect x="${x+ins}" y="${y+th}" width="${w-2*ins}" height="${Math.max(4,h-th)}" fill="#2b1c24" stroke="#d9b45b" stroke-opacity=".16"/>
<path d="M${x+ins+2} ${y+th}V${y+h}M${x+w-ins-2} ${y+th}V${y+h}" stroke="#d9b45b" stroke-opacity=".15"/>`;
  }

  /* 抽屉柜（药柜 / 档格）empty:[col,row] */
  function drawers(x,y,w,h,cols,rows,o){
    o = o||{};
    const cw = w/cols, rh = h/rows;
    let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#2b1c22" stroke="#d9b45b" stroke-opacity=".34"/>`;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const dx = x+c*cw, dy = y+r*rh;
      const em = o.empty && o.empty[0]===c && o.empty[1]===r;
      s += `<rect x="${dx+3}" y="${dy+3}" width="${cw-6}" height="${rh-6}" fill="${em?"#0d0a0b":"#efe3ce"}" fill-opacity="${em?".92":(o.fill||".09")}" stroke="#d9b45b" stroke-opacity="${em?".46":".19"}"/>`;
      if(!em) s += `<circle cx="${dx+cw-9}" cy="${dy+rh/2}" r="2.2" fill="#d9b45b" fill-opacity=".4"/>`;
    }
    return s;
  }

  /* 木架（档架 / 书架） */
  function rack(x,y,w,h,shelves,o){
    o = o||{};
    let s = `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#261820" stroke="#d9b45b" stroke-opacity=".3"/>`;
    for(let i=1;i<=shelves;i++){
      const yy = y + i*h/(shelves+1);
      s += `<path d="M${x} ${yy}H${x+w}" stroke="#d9b45b" stroke-opacity=".2"/>`;
    }
    return s + (o.items||"");
  }

  /* 一摞卷册 / 簿子（自下而上码） */
  function stack(x,y,w,n,o){
    o = o||{};
    let s = "";
    for(let i=0;i<n;i++){
      const yy = y - (i+1)*(o.step||7);
      s += `<rect x="${x+(i%3)*3}" y="${yy}" width="${w-(i%3)*6}" height="${(o.step||7)-1}" rx="1" fill="#efe3ce" fill-opacity="${(0.115+i*0.014).toFixed(3)}" stroke="#d9b45b" stroke-opacity=".2"/>`;
    }
    return s;
  }

  /* 摊开的长卷 / 文书（带界行） */
  function scroll(x,y,w,h,o){
    o = o||{};
    const lines = [];
    for(let i=1;i<(o.rows||5);i++) lines.push(`<path d="M${x+6} ${y+i*h/(o.rows||5)}H${x+w-6}"/>`);
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#efe3ce" fill-opacity=".15" stroke="#d9b45b" stroke-opacity=".3"/>
<g stroke="#d9b45b" stroke-opacity=".16" fill="none">${lines.join("")}</g>`
      + (o.seal ? `<rect x="${x+w-30}" y="${y+h-26}" width="17" height="17" rx="2" fill="#a8232d" fill-opacity=".55" stroke="#d9b45b" stroke-opacity=".34"/>` : "")
      + (o.mark ? `<path d="M${x+w*0.42} ${y+6}v${h-12}" stroke="#c9303a" stroke-opacity=".6" stroke-width="1.6"/>` : "");
  }

  /* 木匣 / 漆盒 */
  function box(x,y,w,h,o){
    o = o||{};
    const col = o.lacquer ? "#6d2028" : "#3d2b34";
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}" fill-opacity=".78" stroke="#d9b45b" stroke-opacity=".4"/>
<rect x="${x}" y="${y}" width="${w}" height="${h*0.3}" fill="#efe3ce" fill-opacity=".07" stroke="#d9b45b" stroke-opacity=".24"/>
<path d="M${x+w/2} ${y+h*0.3}v${h*0.7}" stroke="#d9b45b" stroke-opacity=".18"/>
<rect x="${x+w*0.42}" y="${y+h*0.5}" width="${w*0.16}" height="${h*0.22}" rx="1.5" fill="#d9b45b" fill-opacity=".42" stroke="#d9b45b" stroke-opacity=".6"/>`;
  }

  /* 灯：挂灯（cord 可给）+ 灯焰光晕 */
  function lamp(x,y,r,o){
    o = o||{};
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#${o.k}l)"/>
<path d="M${x} ${y-r*0.6}v${-(o.cord==null?26:o.cord)}" stroke="#d9b45b" stroke-opacity=".3"/>
<ellipse cx="${x}" cy="${y}" rx="9" ry="3.5" fill="#d9b45b" fill-opacity=".24"/>
<circle cx="${x}" cy="${y-9}" r="${Math.max(6,r*0.3).toFixed(1)}" fill="url(#${o.k}l)"/>
<path d="M${x} ${y-5}q3.6-9.5 0-15.5-3.6 6 0 15.5" fill="#ffd88c" fill-opacity=".78"/>`;
  }

  /* 博山炉（熏香） */
  function burner(x,y,o){
    o = o||{};
    return `<path d="M${x} ${y}v-26" stroke="#d9b45b" stroke-opacity=".3"/>
<ellipse cx="${x}" cy="${y}" rx="17" ry="5" fill="#3b2a26" stroke="#d9b45b" stroke-opacity=".3"/>
<path d="M${x-15} ${y-26}q0-19 15-19t15 19z" fill="#4a3a30" fill-opacity=".8" stroke="#d9b45b" stroke-opacity=".38"/>
<path d="M${x-11} ${y-42}q4-9 11-9t11 9z" fill="#5b4738" fill-opacity=".7" stroke="#d9b45b" stroke-opacity=".3"/>
<path d="M${x} ${y-56}v-8" stroke="#d9b45b" stroke-opacity=".22"/>
<path d="M${x-6} ${y-74}q6-9 0-16 6 7 12 0-6 7 0 16" fill="none" stroke="#f4dc95" stroke-opacity=".24" stroke-width="1.2"/>`;
  }

  /* 榻 / 坐具 */
  function couch(x,y,w,h,o){
    o = o||{};
    /* 座面在 y，底在 y+h。坐上去的人要用 fig(px, y+h, "seat") —— 以榻底为落座线，
       人才是「坐在榻里」而不是「被榻挡住半个身子」。 */
    return `<rect x="${x}" y="${y+16}" width="${w}" height="${h-16}" fill="#33232b" stroke="#d9b45b" stroke-opacity=".24"/>
<rect x="${x+8}" y="${y}" width="${w-16}" height="22" rx="8" fill="#5b4650" stroke="#d9b45b" stroke-opacity=".26"/>
<path d="M${x+30} ${y+6}q-6 10 0 16M${x+w-30} ${y+6}q6 10 0 16" fill="none" stroke="#d9b45b" stroke-opacity=".12"/>
<path d="M${x+10} ${y+h}v14M${x+w-10} ${y+h}v14" stroke="#d9b45b" stroke-opacity=".2"/>`;
  }

  /* 人：深色发廓 + 浅色脸 + 顶上一个发髻（避免两个圆髻画成米老鼠）
     y = 落地 / 落座线；pose: stand | seat | kneel */
  function person(x,y,pose,o){
    o = o||{};
    const R  = o.robe  || "#453139";
    const R2 = o.robe2 || "#57414c";
    const HA = "#241820", FA = "#5a4553";
    const op = o.op==null ? .95 : o.op;
    const G  = ".38";
    const f  = v => (+v).toFixed(1);

    function head(hx,hy,rx,ry){
      return `<ellipse cx="${hx}" cy="${f(hy+ry*0.06)}" rx="${f(rx*1.1)}" ry="${f(ry*1.06)}" fill="${HA}" stroke="#d9b45b" stroke-opacity=".22"/>
<ellipse cx="${hx}" cy="${f(hy+ry*0.4)}" rx="${f(rx*0.94)}" ry="${f(ry*0.86)}" fill="${FA}" stroke="#d9b45b" stroke-opacity="${G}"/>
<ellipse cx="${hx}" cy="${f(hy-ry*0.74)}" rx="${f(rx*0.8)}" ry="${f(ry*0.5)}" fill="${HA}" stroke="#d9b45b" stroke-opacity=".26"/>
<path d="M${f(hx-rx*0.66)} ${f(hy-ry*1.08)}h${f(rx*1.32)}" stroke="#d9b45b" stroke-opacity=".46" stroke-width="1.8" stroke-linecap="round"/>
<path d="M${f(hx-rx*0.4)} ${f(hy+ry*0.66)}q${f(rx*0.4)} ${f(ry*0.24)} ${f(rx*0.8)} 0" fill="none" stroke="#efe3ce" stroke-opacity=".1"/>`;
    }

    if(pose==="kneel"){
      return `<g opacity="${op}">
<path d="M${x-62} ${y}Q${x-54} ${y-36} ${x-24} ${y-42}L${x+24} ${y-42}Q${x+54} ${y-36} ${x+62} ${y}Z" fill="${R}" stroke="#d9b45b" stroke-opacity=".3"/>
<path d="M${x-34} ${y-8}q34 11 68 0" fill="none" stroke="#d9b45b" stroke-opacity=".1"/>
<path d="M${x-30} ${y-42}L${x-34} ${y-100}Q${x} ${y-114} ${x+34} ${y-100}L${x+30} ${y-42}Z" fill="${R}" stroke="#d9b45b" stroke-opacity=".32"/>
<path d="M${x-33} ${y-64}q33 11 66 0l3 14q-36 12-72 0z" fill="${R2}" stroke="#d9b45b" stroke-opacity=".3"/>
<path d="M${x-11} ${y-100}q11 20 22 0" fill="none" stroke="#d9b45b" stroke-opacity=".36"/>
<ellipse cx="${x}" cy="${y-54}" rx="25" ry="10" fill="${R2}" stroke="#d9b45b" stroke-opacity=".28"/>
<path d="M${x-5} ${y-122}v16M${x+5} ${y-122}v16" stroke="#d9b45b" stroke-opacity=".22"/>
${head(x, y-142, 15, 17)}
</g>`;
    }

    if(pose==="seat"){
      return `<g opacity="${op}">
<path d="M${x-52} ${y+2}q-4-30 16-38h72q20 8 16 38z" fill="${R}" stroke="#d9b45b" stroke-opacity=".3"/>
<path d="M${x-36} ${y-36}q36 12 72 0L${x+38} ${y-100}q-38 12-76 0Z" fill="${R}" stroke="#d9b45b" stroke-opacity=".34"/>
<path d="M${x-34} ${y-62}q34 11 68 0l2 14q-36 12-72 0z" fill="${R2}" stroke="#d9b45b" stroke-opacity=".32"/>
<path d="M${x-11} ${y-100}q11 20 22 0" fill="none" stroke="#d9b45b" stroke-opacity=".4"/>
<path d="M${x-36} ${y-98}q-20 30-12 62 9 7 19-3" fill="none" stroke="#d9b45b" stroke-opacity=".3" stroke-width="1.6"/>
<path d="M${x+36} ${y-98}q20 30 12 62-9 7-19-3" fill="none" stroke="#d9b45b" stroke-opacity=".3" stroke-width="1.6"/>
<ellipse cx="${x-30}" cy="${y-30}" rx="12" ry="7" fill="${R2}" stroke="#d9b45b" stroke-opacity=".26"/>
<ellipse cx="${x+30}" cy="${y-30}" rx="12" ry="7" fill="${R2}" stroke="#d9b45b" stroke-opacity=".26"/>
<path d="M${x-5} ${y-122}v18M${x+5} ${y-122}v18" stroke="#d9b45b" stroke-opacity=".22"/>
${head(x, y-140, 15, 17)}
</g>`;
    }

    return `<g opacity="${op}">
<path d="M${x-30} ${y-150}Q${x-39} ${y-74} ${x-47} ${y}L${x+47} ${y}Q${x+39} ${y-74} ${x+30} ${y-150}Z" fill="${R}" stroke="#d9b45b" stroke-opacity=".32"/>
<path d="M${x-11} ${y-150}q11 20 22 0" fill="none" stroke="#d9b45b" stroke-opacity=".4"/>
<path d="M${x-34} ${y-88}q34 11 68 0l3 15q-37 12-74 0z" fill="${R2}" stroke="#d9b45b" stroke-opacity=".32"/>
<path d="M${x-30} ${y-146}q-24 32-16 82 8 6 18-4" fill="none" stroke="#d9b45b" stroke-opacity=".3" stroke-width="1.6"/>
<path d="M${x+30} ${y-146}q24 32 16 82-8 6-18-4" fill="none" stroke="#d9b45b" stroke-opacity=".3" stroke-width="1.6"/>
<ellipse cx="${x-38}" cy="${y-62}" rx="12" ry="7" fill="${R2}" stroke="#d9b45b" stroke-opacity=".26"/>
<ellipse cx="${x+38}" cy="${y-62}" rx="12" ry="7" fill="${R2}" stroke="#d9b45b" stroke-opacity=".26"/>
<path d="M${x-5} ${y-170}v16M${x+5} ${y-170}v16" stroke="#d9b45b" stroke-opacity=".22"/>
${head(x, y-190, 16, 18)}
</g>`;
  }

  /* ── 问话人物（可联动）──────────────────────────────
     与 person() 分开：person 是「场景里的路人」，fig 是「被质问的那个人」。
     差别在于 fig 带一套情绪参数 mood，问话时随话题切换重画，画面才有回应。
       mood: calm 平坐 | low 低头 | away 别过脸 | rise 起身逼视 | shake 颤栗 | guard 戒惧抬手
     o.tone 可覆盖衣裳色（皇后用正红、太医用药青），o.mark 是额上/袖口的金色小饰。
     lamp 位置若给了 o.lampX/lampY，会在人物后补一团面光——呼应「审人的灯照着他」。 */
  function fig(x,y,pose,o){
    o = o||{};
    const mood = o.mood || "calm";
    const R  = o.tone   || "#43303a";
    const R2 = o.tone2  || (o.tone ? o.tone : "#57414c");
    const HA = "#241820", FA = "#5a4553";
    const f  = v => (+v).toFixed(1);
    const op = o.op==null ? 1 : o.op;

    /* 情绪驱动的形变量：低头、别脸、前倾、抬手 */
    const dy   = mood==="low"  ?  7 : mood==="rise" ? -6 : 0;
    const dx   = mood==="away" ?  9 : mood==="rise" ? -3 : 0;
    const tilt = mood==="low"  ?  3.5 : mood==="away" ? -4 : mood==="rise" ? -1.5 : 0;
    const lean = mood==="rise" ?  6 : mood==="guard" ? -4 : 0;
    const bob  = mood==="shake" ? .9 : 0;

    function face(hx,hy,rx,ry){
      return `<g transform="translate(${f(dx)} ${f(dy+bob)}) rotate(${f(tilt)} ${f(hx)} ${f(hy)})">
<ellipse cx="${hx}" cy="${f(hy+ry*0.06)}" rx="${f(rx*1.1)}" ry="${f(ry*1.06)}" fill="${HA}" stroke="#d9b45b" stroke-opacity=".24"/>
<ellipse cx="${hx}" cy="${f(hy+ry*0.4)}" rx="${f(rx*0.94)}" ry="${f(ry*0.86)}" fill="${FA}" stroke="#d9b45b" stroke-opacity=".4"/>
<ellipse cx="${hx}" cy="${f(hy-ry*0.74)}" rx="${f(rx*0.8)}" ry="${f(ry*0.5)}" fill="${HA}" stroke="#d9b45b" stroke-opacity=".26"/>
<path d="M${f(hx-rx*0.66)} ${f(hy-ry*1.08)}h${f(rx*1.32)}" stroke="#d9b45b" stroke-opacity=".48" stroke-width="1.8" stroke-linecap="round"/>
${mood==="low"||mood==="shake"?`<path d="M${f(hx-rx*0.46)} ${f(hy+ry*0.68)}q${f(rx*0.46)} ${f(ry*0.2)} ${f(rx*0.92)} 0" fill="none" stroke="#efe3ce" stroke-opacity=".13"/>`:""}
</g>`;
    }
    /* 情绪驱动的衣纹：rise 时肩线拉开、away 时衣摆偏一侧 */
    const shoulder = mood==="rise" ? 1.14 : 1;
    const hemShift = mood==="away" ? dx*0.6 : 0;

    if(pose==="kneel"){
      /* 跪姿要"矮而宽"：衣摆铺开压得很低，上身只占站姿的一半高，才看得出来是跪着 */
      return `<g opacity="${op}">
<path d="M${x-72+hemShift} ${y}Q${x-70} ${y-22} ${x-34} ${y-26}L${x+34} ${y-26}Q${x+70} ${y-22} ${x+72+hemShift} ${y}Z" fill="${R}" stroke="#d9b45b" stroke-opacity=".3"/>
<path d="M${x-44} ${y-6}q44 13 88 0" fill="none" stroke="#d9b45b" stroke-opacity=".09"/>
<path d="M${f(x-40*shoulder)} ${y-26}L${f(x-42*shoulder)} ${y-62}Q${x+lean} ${y-74} ${f(x+42*shoulder)} ${y-62}L${f(x+40*shoulder)} ${y-26}Z" fill="${R}" stroke="#d9b45b" stroke-opacity=".34"/>
<path d="M${x-40} ${y-40}q40 12 80 0l3 13q-43 12-86 0z" fill="${R2}" stroke="#d9b45b" stroke-opacity=".3"/>
<path d="M${f(x-12+lean)} ${y-64}q12 19 24 0" fill="none" stroke="#d9b45b" stroke-opacity=".4"/>
${mood==="guard"?`<path d="M${x-38} ${y-36}q-24-6-28-28" fill="none" stroke="${R2}" stroke-opacity=".9" stroke-width="8" stroke-linecap="round"/>
<path d="M${x+38} ${y-36}q20 8 18 28" fill="none" stroke="${R2}" stroke-opacity=".9" stroke-width="8" stroke-linecap="round"/>`:""}
<ellipse cx="${x}" cy="${y-32}" rx="28" ry="10" fill="${R2}" stroke="#d9b45b" stroke-opacity=".3"/>
<path d="M${x-6} ${y-86}v14M${x+6} ${y-86}v14" stroke="#d9b45b" stroke-opacity=".24"/>
${face(x, y-108, 15, 16)}
</g>`;
    }

    /* 站立 / 端坐：只差下半身，上半身共用 */
    const legs = pose==="seat"
      ? `<path d="M${x-54} ${y+2}q-4-31 17-39h74q21 8 17 39z" fill="${R}" stroke="#d9b45b" stroke-opacity=".32"/>`
      : `<path d="M${x-44} ${y-124}Q${x-50} ${y-52} ${x-56} ${y}L${x+56} ${y}Q${x+50} ${y-52} ${x+44} ${y-124}Z" fill="${R}" stroke="#d9b45b" stroke-opacity=".3"/>`;

    const arms = (pose==="seat")
      ? `<path d="M${x-38} ${y-100}q-20 31-12 63 9 7 19-3" fill="none" stroke="#d9b45b" stroke-opacity=".32" stroke-width="1.6"/>
<path d="M${x+38} ${y-100}q20 31 12 63-9 7-19-3" fill="none" stroke="#d9b45b" stroke-opacity=".32" stroke-width="1.6"/>
<ellipse cx="${x-31}" cy="${y-30}" rx="12" ry="7" fill="${R2}" stroke="#d9b45b" stroke-opacity=".28"/>
<ellipse cx="${x+31}" cy="${y-30}" rx="12" ry="7" fill="${R2}" stroke="#d9b45b" stroke-opacity=".28"/>`
      : `<path d="M${x-32} ${y-148}q-25 33-17 84 8 6 19-4" fill="none" stroke="#d9b45b" stroke-opacity=".32" stroke-width="1.6"/>
<path d="M${x+32} ${y-148}q25 33 17 84-8 6-19-4" fill="none" stroke="#d9b45b" stroke-opacity=".32" stroke-width="1.6"/>
<ellipse cx="${x-40}" cy="${y-63}" rx="12" ry="7" fill="${R2}" stroke="#d9b45b" stroke-opacity=".28"/>
<ellipse cx="${x+40}" cy="${y-63}" rx="12" ry="7" fill="${R2}" stroke="#d9b45b" stroke-opacity=".28"/>`;

    /* 端坐/站立时的两臂交叉于前——「戒惧」与「别脸」都靠这条小臂表达 */
    const lap = (mood==="away"||mood==="guard")
      ? `<path d="M${x-22} ${y-70}q22 15 44 0" fill="none" stroke="${R2}" stroke-opacity=".85" stroke-width="7" stroke-linecap="round"/>`
      : "";

    const top = pose==="seat" ? y-142 : y-192;
    return `<g opacity="${op}">
${legs}
<path d="M${f(x-36*shoulder)} ${y-100}q36 12 72 0L${f(x+38*shoulder+lean)} ${top+42}q-38 12-76 0Z" fill="${R}" stroke="#d9b45b" stroke-opacity=".36"/>
<path d="M${x-34} ${y-64}q34 11 68 0l2 14q-36 12-72 0z" fill="${R2}" stroke="#d9b45b" stroke-opacity=".32"/>
<path d="M${f(x-11+lean)} ${top+42}q11 20 22 0" fill="none" stroke="#d9b45b" stroke-opacity=".42"/>
${arms}${lap}
<path d="M${x-5} ${f(top+22)}v18M${x+5} ${f(top+22)}v18" stroke="#d9b45b" stroke-opacity=".24"/>
${o.mark||""}
${face(x, top, 15, 17)}
</g>`;
  }

  /* 一排卷册的册脊 */
  function spines(x,y,w,h,n,o){
    o = o||{};
    const sw = w/n;
    let s = "";
    for(let i=0;i<n;i++){

/* ================================================================
   探听（EAVES）—— 横向撬取「别条线」的线索
   ----------------------------------------------------------------
   动机：三日的筹只够攥住一条链，玩家选了一个方向，就够不着别的方向。
   勘验要讲证据，问话要讲凭据；**可宫里还有第三种办法：不谈法度，谈利害。**

     close  近侍 · 递话给银子     —— 买。他缺钱，你缺线索，两清。
     eaves  廊下的无名小卒 · 听墙角 —— 偷听。不用花什么，只是要看运气。
     eunuch 身边伺候的公公 · 逼他说 —— 拷问。最准、最省，也最脏。

   三条门路各自的取向：
     close   最贵最稳，哪一头都碰得着，可得 2 条。
     eaves   最便宜（只 1 筹），但只捞得到「转述、听见、传言」类的证词，
             而且**手气不好就只捞回一句无用的话**（missBody）。
     eunuch  最准（两三条里挑一条，要哪条拿哪条），但**只治得了自己人**，
             而且会烧掉往后的一条路（backlash）。

   平衡口径（关键）：
     · 探听**不收方向折扣**，整体跨方向（2 筹）+ 门路附加代价（1–2 筹）＝ 3–4 筹／条；
     · **三条门路各自每局只能走一次**——不限制次数的话，玩家会一路买到底，
       方向折扣这个取舍就废了；
     · 可撬的线索**只放各方向里的「证词」类**（不含误导线索与解密线索），
       目的是让玩家「看见另一头」，而不是「把另一头也查全」；

================================================================ */

/* ---------------- 环境探测 / 滚动定位 ----------------
   窄屏是单列布局：宫城条 → 案台 → 线索簿。任何操作后都不该滚到整页顶端
   （那样会停在宫城条上，看不到刚读到的内容），而要停在「案台」本身。
----------------------------------------------------- */
const mq = q => !!(window.matchMedia && window.matchMedia(q).matches);
const isNarrow = ()=> mq("(max-width:820px)");
const isTouch  = ()=> (navigator.maxTouchPoints||0) > 0 || ("ontouchstart" in window);
const calm     = ()=> mq("(prefers-reduced-motion: reduce)");
function topbarH(){
  const tb = document.querySelector(".topbar");
  return (tb && getComputedStyle(tb).position === "sticky") ? tb.offsetHeight : 0;
}
function scrollToEl(el, pad){
  if(!el || !el.getBoundingClientRect) return;
  const pad2 = pad || 0;
  const rect = el.getBoundingClientRect();
  const vh = window.innerHeight || 600;
  /* 只在「目标整体跑出视野」时才滚——不要跟玩家抢滚动。
     #stage 是个很高的长条（整幅现场长卷），玩家往下读时它的 top 早已是负数；
     旧写法无条件把 #stage 顶到视口上沿，于是每点一下就跳一次，
     手感就是「怎么又回到顶部了」。所以判据要看**交叠**，不是看 top 是否可见。 */
  const visibleTop    = Math.max(rect.top, 0);
  const visibleBottom = Math.min(rect.bottom, vh);
  const visibleH = Math.max(0, visibleBottom - visibleTop);
  /* 已经露出大半屏，就别动它 */
  if(visibleH >= Math.min(rect.height, vh) * 0.55) return;
  const y = rect.top + (window.pageYOffset || document.documentElement.scrollTop || 0) - pad2;
  const top = Math.max(0, Math.round(y));
  try{ window.scrollTo({top, behavior: calm() ? "auto" : "smooth"}); }
  catch(e){ window.scrollTo(0, top); }
}
/* 重绘后等一帧再滚，保证拿到的是新布局的位置 */
function scrollToStage(){
  requestAnimationFrame(()=>{
    const el = document.getElementById("stage");
    scrollToEl(el, isNarrow() ? topbarH() + 8 : 14);
  });
}
/* 窄屏才好用：大屏上案台始终在视野里，滚动反而晃眼 */
function focusStage(force){
  if(force || isNarrow()) scrollToStage();
}

/* 与方向条并列。走过的门路显示成「已用」，全部走完则整条收起。
   还有没到日子的门路时，用「另有 N 道未开」点一句——
   免得玩家以为一共就只有一条路。 */
function eavesBar(){
  const walked = EAVES.filter(e=>S.eaves[e.id]);
  const left   = EAVES.filter(e=>!S.eaves[e.id] && eavesOpen(e));
  const later  = EAVES.filter(e=>!S.eaves[e.id] && !eavesOpen(e));

  if(!left.length && walked.length){
    return `<div class="eavesbar used">
      <span class="el">探 听</span>
      <span class="ec2">${walked.length} 道门路都走过了</span>
      <span class="ex">${later.length?`另有 ${later.length} 道未到日子`:"这宫里肯跟你说话的人，已经说完了"}</span>
    </div>`;
  }
  if(!left.length && !walked.length){
    /* 第一日又恰好一道未开时才会走到这里（正常配置下走不到） */
    return `<div class="eavesbar used">
      <span class="el">探 听</span>
      <span class="ec2">明日才有能说上话的人</span>
      <span class="ex">${later.map(e=>e.ico).join(" ")}</span>
    </div>`;
  }
  const cheapest = Math.min.apply(null, left.map(eavesCost));
  const tax = S.harsh ? `　·　<b>刑讯记档 ＋${HARSH_TAX} 筹</b>` : "";
  const more = later.length ? `（另 ${later.length} 道未开）` : "";
  return `<div class="eavesbar">
    <span class="el">探 听</span>
    <span class="ec2">还有 ${left.length} 道门路可走${walked.length?`，已走 ${walked.length}`:""}${more}</span>
    <span class="ex">买 · 听 · 逼 · 堵${tax}　｜　最低 <b>${cheapest}</b> 筹</span>
    <button class="btn sm ghost" style="margin-left:auto" onclick="openEaves()">探 听</button>
  </div>`;
}

      三日查不完六宫。定一个方向，<b style="color:var(--gold)">该方向内的去处，本日只耗一筹</b>；方向之外的，仍耗两筹。<br>
      <b style="color:var(--gold-2)">三日的筹只够把一条链查到八成以上</b>——<b>「查毒源」「查夜禁」各能查透一条链</b>；
      「查防护」只看得到皇后链的一半，「查人心」两头都沾、两头都浅，但覆盖面最广。<br>
