function pickFocus(id){
  const f = FOCUS.find(x=>x.id===id); if(!f || !f.day.includes(S.round)) return;
  S.focus=id; S.focusDay=S.round; S.halfCount=0;
  const m=document.querySelector(".modal"); if(m) m.remove();
  renderGame();
}

/* ================================================================
   探听（EAVES）
   ----------------------------------------------------------------
   与「调查方向」并列的第二块。方向决定你「够得着哪一头」，
   探听决定你「肯不肯用别一种办法去够」。三条门路，各自每局一次。

   耗筹口径（刻意不收方向折扣）：
     总价 = EAVES.cost（跨方向价 1–2 筹）+ EAVES.need（门路的代价 1–3 筹）
     若有刑讯记档（S.harsh），第二日起再加 HARSH_TAX
   ================================================================ */
const HARSH_TAX = 1;          /* 动过刑之后，问话与呈证统一加价 */

/* ---- 可用性 ---- */
function eavesOf(id){ return EAVES.find(e=>e.id===id) || null; }
/* 这一门路今日走不走得通 */
function eavesOpen(ev){ return (ev.open||1) <= S.round; }
/* 这一条线索是否「已在手上」（已得的不必再撬） */
function got(cid){ return !!S.found[cid]; }
/* 悬赏清单里还没到手的（挑剩下的不留） */
function pending(list){ return (list||[]).filter(c=>!got(c)); }

/* ---- 总价 ---- */
function eavesCost(ev){
  return (ev.cost||2) + (ev.need||1) + (S.harsh ? HARSH_TAX : 0);
}
/* 扣筹：探听不走 spendFor（那个带方向折扣），单独扣 */
function spendEaves(ev){
  const c = eavesCost(ev);
  if(S.ap >= c){ S.ap -= c; S.eavesN++; return true; }
  if(S.harsh){
    toast("余筹不足。","慎刑司那盏灯的事传出去之后，人人防着你——往后凡问话、呈证、递话，都要多花一筹。",
      "（本次须 " + c + " 筹：门路 " + ev.cost + " + 代价 " + ev.need + " + 刑讯记档 " + HARSH_TAX + "。余筹 " + S.ap + " 筹。）");
    return false;
  }
  toast("余筹不足这一道门路。","门路本身要 " + (ev.cost||2) + " 筹，还得有 " + (ev.need||1) + " 筹打点／铺路——共 " + c + " 筹。",
    "（余筹 " + S.ap + " 筹。也可以先花一两筹去别处查，明日再来。）");
  return false;
}

/* ---- 弹层：选门路 ---- */
function openEaves(){
  const avail = EAVES.filter(eavesOpen);
  if(!avail.length){
    toast("还没有能说上话的人。","宫里认人。头一日你新来，谁也不肯接你的话——第二日再看。");
    return;
  }
  if(!S.ap){
    toast("今日余筹已尽。","请结束本日，明日再来。");
    return;
  }
  const cards = avail.map(ev=>{
    const done = !!S.eaves[ev.id];
    /* 这一门路还能掏出什么：pick / pickAll / pool 三种 */
    let cand = [];
    if(ev.pick)    cand = pending(ev.pick);
    if(ev.pickAll) cand = ev.pickAll;                 /* 刑讯：不必过滤，未得的才摆出来 */
    if(ev.pool)    cand = pending(ev.pool);
    const full = (ev.pick && !cand.length);           /* 清单掏空了 */
    const dead = done || full;
    const c = eavesCost(ev);
    const leftTxt = ev.pickAll ? (cand.length + " 条可挑")
                  : ev.pool    ? (cand.length + " 条里撞运气")
                  : (cand.length + " 条待撬");
    return `<div class="evcard ${dead?"dead":""} ${ev.id==="eunuch"?"hard":""}"
      ${dead?"":`onclick="pickEaves('${ev.id}')"`}>
      <div class="ei">${ev.ico}</div>
      <div class="en">${ev.name}</div>
      <div class="ed">${ev.desc}</div>
      <div class="ep">▸ 耗 <b style="color:var(--gold-2)">${c}</b> 筹　<span style="color:var(--paper-3)">（门路 ${ev.cost} ＋ 打点 ${ev.need}${S.harsh?" ＋ 刑讯记档 "+HARSH_TAX:""}）</span></div>
      <div class="eg">${dead ? (done?"◇ 这道门路本局已走过":"◇ 他嘴里没有你不知道的了") : ("◇ "+leftTxt)}</div>
      ${ev.backlash?`<div class="eb" style="color:#e79aa2">⚠ ${ev.backlash}</div>`:""}
    </div>`;
  }).join("");
  const m = document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="modal-in" style="max-width:680px">
    <h3>探 听 · 换 一 种 办 法 去 查</h3>
    <div class="ms">第 ${["一","二","三"][S.round-1]} 日 · 本方向之外的那些线，未必非要靠勘验与问话</div>
    <p class="muted" style="font-size:13px;line-height:1.95">
      三日的筹只够把一头攥紧。可宫里从不只有一条路——<b style="color:#e79aa2">不谈法度，谈利害。</b><br>
      这四道门路，<b style="color:var(--gold-2)">买、听、逼、堵</b>，专用来撬<b>别的方向</b>的线索：<b>讨来的从来不是铁证，是一条线头。</b><br>
      <span class="dim" style="font-size:12.5px">探听不比勘验便宜——它<b>不收方向折扣</b>，整体跨方向，另加门路代价。
      且<b>每道门路，本局只走一次</b>：这种手段，用过一回，宫里就长了记性。</span></p>
    <div class="evgrid">${cards}</div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px">
      <button class="btn ghost" onclick="this.closest('.modal').remove()">再 想 想</button>
    </div></div>`;
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
}

/* ---- 选门路 → 分流到「挑线索」或「听墙角」 ---- */
function pickEaves(id){
  const ev = eavesOf(id);
  if(!ev || S.eaves[id] || !eavesOpen(ev)) return;
  if(ev.pool){ doEavesPool(ev); return; }
  /* pickAll（刑讯）不必过滤已得——他知道的都摆出来，你要哪条拿哪条；
     pick（收买／堵嘴）只掏还没到手的，掏空了就没有了。 */
  const cand = ev.pickAll ? (ev.pickAll||[]).slice() : pending(ev.pick);
  if(!cand.length){
    toast("他嘴里没有你不知道的了。","这条街上能问出来的，你已经都拿到了。");
    return;
  }
  document.querySelectorAll(".modal").forEach(x=>x.remove());
  const rows = cand.map(cid=>{
    const c = CLUES[cid];
    return `<div class="evpv" onclick="commitEaves('${id}','${cid}')">
      <span class="etag">${c.type}</span>
      <span class="evn">${c.name}</span>
      <span class="evw">得手后录 <b style="color:var(--gold)">1</b> 条</span>
    </div>`;
  }).join("");
  const isHard = ev.id==="eunuch";
  const m = document.createElement("div"); m.className="modal";
  m.innerHTML = `<div class="modal-in" style="max-width:620px">
    <h3>${ev.approach}</h3>
    <div class="ms">${ev.name}</div>
    <p class="muted" style="font-size:13.5px;line-height:1.95">
      ${isHard
        ? "灯拨近了。他知道的事不止一条——<b style='color:#e79aa2'>你想先听哪一条？</b>"
        : "他把能说的都摆在桌上了——<b style='color:var(--gold-2)'>你要听哪一条？</b>"}<br>
      <span class="dim" style="font-size:12.5px">挑中的那一条，录进线索簿。<b>其余的问不出来。</b>（本次耗 ${eavesCost(ev)} 筹）</span></p>
    <div class="evpick" style="margin-top:16px">${rows}</div>
    ${ev.backlash?`<div style="margin-top:15px;padding:11px 13px;border:1px solid rgba(201,48,58,.42);border-radius:3px;background:rgba(158,32,41,.1)">
      <div style="font-size:12px;color:#e79aa2;line-height:1.85">⚠ <b>${ev.backlash}</b><br>
      这一手之后，<b>第二日起，凡问话与呈证，一律多耗 ${HARSH_TAX} 筹</b>——他们会记得你用过哪一间屋。</div></div>`:""}
    <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn sm ghost" onclick="this.closest('.modal').remove()">再 想 想</button>
    </div></div>`;
  m.onclick=e=>{if(e.target===m)m.remove();};
  document.body.appendChild(m);
}

/* ---- 定一条：扣筹、录入、出结果页 ---- */
function commitEaves(id,cid){
  const ev = eavesOf(id);
  if(!ev || S.eaves[id]) return;
  document.querySelectorAll(".modal").forEach(x=>x.remove());
  if(!spendEaves(ev)) return;
  S.eaves[id] = {got:[cid]};
  if(ev.backlash) S.harsh = true;
  if(!S.found[cid]) S.found[cid] = true;
  const c = CLUES[cid];
  S.view = {
    label: ev.name + " · " + ev.approach,
    body: (ev.body||[]).concat([["say", ev.pickNote || ev.approach + "。"]]),
    clues:[cid],
    from:"eaves"
  };
  renderGame(); scrollToStage();
}

/* ---- 听墙角：一分运气，三分薄面 ---- */
function doEavesPool(ev){
  document.querySelectorAll(".modal").forEach(x=>x.remove());
  if(!spendEaves(ev)) return;
  const cand = pending(ev.pool);
  const take = cand.slice(0, ev.batch||2);
  if(take.length){
    S.eaves[ev.id] = {got:take};
    take.forEach(c=>{ if(!S.found[c]) S.found[c]=true; });
    S.view = {label: ev.name + " · " + ev.approach, body: ev.body||[], clues:take, from:"eaves"};
  } else {
    /* 该方向听得见的都听完了 → 保底：把你本日方向里的一条，再听一遍（不给新线索） */
    const en = pending(ev.echo);
    S.eaves[ev.id] = {miss:true, echo:!!en.length};
    S.view = {label: ev.name + " · " + ev.approach,
      body: en.length ? ev.echoBody : ev.missBody, clues:[], from:"eaves"};
  }
  renderGame(); scrollToStage();
}

/* ---------------- 主界面 ---------------- */
function renderGame(){
  const pips = [1,2,3].map(r=>{
    const cls = r===S.round ? "pip on" : (r<S.round ? "pip done" : "pip");
    return `<span class="${cls}">${["第一日","第二日","第三日"][r-1]}</span>`;
  }).join("");
  const dots = Array.from({length:S.apMax[S.round]},(_,i)=>`<span class="apdot ${i<S.ap?"on":""}"></span>`).join("");

  const places = PLACES.map(p=>{
    const locked = p.open > S.round;
    const vis = spotsOf(p).filter(spotVisible).length + topicsOf(p).filter(topicVisible).length;
    const got = spotsOf(p).filter(sp=>spotVisible(sp)&&S.done[sp.id]).length
              + topicsOf(p).filter(t=>topicVisible(t)&&S.done[t.id]).length;
    let badge = "";
    if(locked) badge = `<span class="p-badge" style="color:var(--paper-3)">未开</span>`;
    else if(vis>0) badge = `<span class="p-badge">${got}/${vis}</span>`;
    return `<div class="place ${S.current===p.id?"on":""} ${locked?"locked":""}"
      ${locked?"":`onclick="selectPlace('${p.id}')"`}>
      <div class="p-ico">${p.ico}</div>
      <div style="flex:1;min-width:0">
        <div class="p-name">${p.name}</div>
        <div class="p-sub">${p.sub}</div>
      </div>${badge}
    </div>`;
  }).join("");

  app().innerHTML = `
  <section id="game">
    <div class="topbar">
      <div class="brand">上巳血案<small>大昭 · 景和十七年</small></div>
      <div class="daypips">${pips}</div>
      <div class="spacer"></div>
      <div class="apbox">
        <span class="lab">余 筹</span>
        <div class="apdots">${dots}</div>
        <span style="color:var(--gold-2);font-size:14px;min-width:20px;text-align:right">${S.ap}</span>
      </div>
      <button class="btn sm ghost" onclick="endDay(true)">结束本日</button>
    </div>

    <div class="layout">
      <div class="panel col-left">
        <div class="panel-h"><span>宫 城</span><span style="color:var(--paper-3);font-size:10.5px">六宫 + 三司</span></div>
        <div class="panel-b">
          <div class="places">${places}</div>
          <div class="stats" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--line);font-size:11.5px;color:var(--paper-3);line-height:1.9">
            <span>已获线索 <b style="color:var(--gold)">${clueCount()}</b> / ${TOTAL_CLUES}</span>
            <span>勘验 · 问话 <b style="color:var(--gold)">${S.settled}</b> 次</span>
          </div>
        </div>
      </div>

      <div class="panel col-mid">
        <div class="panel-h"><span>${S.current?PLACE_MAP[S.current].name:"查 案 台"}</span>
          <span style="color:var(--paper-3);font-size:10.5px">${["第一日 · 疑点","第二日 · 矛盾","第三日 · 定谳"][S.round-1]}</span></div>
        ${focusBar()}
        ${eavesBar()}
        <div class="stage" id="stage">${renderStage()}</div>
      </div>

      <div class="panel col-right">
        <div class="panel-h"><span>线 索 簿</span><span style="color:var(--paper-3);font-size:10.5px">${clueCount()} 条</span></div>
        <div class="cluebox">${renderCluebook()}</div>
      </div>
    </div>
  </section>`;
}

function renderStage(){
  /* 探听的结果页必须最先渲染：它从案台的「探听」发起，
     此刻玩家可能还没入任何一处（S.current 为空）——
     若先判 !S.current，这一页就会被「案卷已启」的空态吃掉，
     线索进了簿，话却一句都看不到。 */
  if(S.view) return renderRead();
  if(!S.current){
    return `<div class="stage-empty">
      <div class="big">卷</div>
      <p>案卷已启。左侧为宫中可往之处。<br>入一处，先择「勘验」或「问话」。</p>
      <p class="dim" style="font-size:12.5px">今日余筹 ${S.ap}。方向内的去处耗一筹，方向外耗两筹${S.harsh?"，刑讯记档之下问话再加一筹":""}；呈证一回，亦按此计。</p>
      <p class="dim" style="font-size:12.5px">够不着的那几条线，未必非要自己去查——<b style="color:#d98b7a">上头还有一道「探听」。</b>买、听、逼、堵，四条路子各有各的价。</p>
    </div>`;
  }

  const p = PLACE_MAP[S.current];
  const sps = spotsOf(p).filter(spotVisible);
  const tps = topicsOf(p).filter(topicVisible);
  const hasS = sps.length>0, hasT = tps.length>0;

  if(!hasS && !hasT){
    return `<div class="stage-h"><div><h2>${p.name}</h2><div class="sub">${p.sub}</div></div></div>
    <div class="stage-empty" style="min-height:300px">
      <div class="big">闭</div><p>今日此处无事可查。<br><span class="dim">换个地方，或结束本日。</span></p>
    </div>`;
  }

  let tab = S.tab;
  if(!hasS) tab="talk";
  if(!hasT) tab="search";
  if(tab!=="search"&&tab!=="talk") tab = hasS?"search":"talk";
  S.tab = tab;

  const tabsHtml = (hasS&&hasT) ? `<div class="tabs">
      <div class="tab ${tab==="search"?"on":""}" onclick="setTab('search')">勘 验<span class="cnt">${sps.filter(sp=>!S.done[sp.id]).length} 处</span></div>
      <div class="tab ${tab==="talk"?"on":""}" onclick="setTab('talk')">问 话<span class="cnt">${tps.filter(t=>!S.done[t.id]).length} 人</span></div>
    </div>` : "";

  const sc = (SCENES[p.id] && SCENES[p.id][tab]) || null;
  const note = tab==="search"
    ? (sc
        ? `<div class="tabnote">此间可以走动了。物事有明有暗，<b style="color:#d98b7a">搜错了，筹也照样花出去。</b></div>`
        : `<div class="tabnote">现场之物有明有暗，每处那句提示语是给你判方向的——<b style="color:#d98b7a">搜错了，筹也照样花出去。</b>虚线者，是你还没想到要查的去处。</div>`)
    : `<div class="tabnote">虚线者，<b style="color:#d98b7a">空口问不进去</b>，须先握有凭据。<span style="color:#e79aa2">朱色者，须呈证逼问</span>——由你挑一条证据推过去，挑对了，他才开口。</div>`;

  const sceneHtml = sc ? renderScene(sc, p, tab) : "";

  let listHtml = "";
  if(tab==="search"){
    listHtml = `<div class="sec-lab">案 上 清 单 · 可见 ${sps.length} 处</div><div class="spotgrid">${sps.map(sp=>{
      const done = S.done[sp.id];
      const lk = !done && spotLocked(sp);
      const pick = !done && !lk && S.pick===sp.id;      /* 已选中、待确认 */
      const cls = done ? (sp.clue?"hit":"miss") : (lk?"locked":(pick?"pick":""));
      const sf = done ? (sp.clue?"✓ 得":"已勘") : (lk?"——":(pick?"待勘":"可勘"));
      const sub = done ? (sp.clue?("已录："+CLUES[sp.clue].name):"已勘，无所得")
                       : (lk?"（尚无线索可依，想不到该查此处）":sp.hint);
      const act = done ? `onclick="showSpotResult('${sp.id}')"` : (lk?"":`onclick="pickSpot('${sp.id}')"`);
      const dm = decOf(sp.id);
      const dmBadge = (dm && !done) ? `<span class="dmchk">可辨读</span>` : "";
      const cc = costOf(sp.id);
      const costTxt = cc<2 ? "耗 一 筹" : "耗 两 筹";
      return `<div class="spot ${cls}" ${act}>
        <div class="sf">${sf}</div>
        <div class="sn">${sp.name}${dmBadge}</div>
        <div class="sh">${sub}</div>
        ${pick?`<div class="sdock">
          <span class="sdock-t">此 处 勘 验 · ${costTxt}</span>
          <button class="btn sm primary" onclick="event.stopPropagation();doSpot('${sp.id}')">勘 验</button>
          <button class="btn sm ghost" onclick="event.stopPropagation();clearPick()">再 想 想</button>
        </div>`:""}
      </div>`;
    }).join("")}</div>`;
  } else {
    listHtml = `<div class="sec-lab">从 何 问 起 · ${tps.length} 项</div><div class="actlist">${tps.map(t=>{
      const done = S.done[t.id];
      const lk = !done && topicLocked(t);
      const isProve = !!t.show;
      const pick = !done && !lk && S.pick===t.id;
      const cls = done?"done":(lk?"locked":(isProve?"prove":(pick?"pick":"")));
      const no = done?"✓":(lk?"无凭":(isProve?(S.ap>0?"呈证":"无筹"):(pick?"待问":"可问")));
      const tc = costOf(t.id);
      const cost = done?"已录":(lk?"须先得凭据":(S.ap>=tc?("耗 "+tc+" 筹"+(S.harsh&&/^t/.test(t.id)?" ⚠":"")):"无筹"));
      const tag = (t.clues&&t.clues.length) ? "" : '<span class="dim" style="font-size:12px">（未必有得）</span>';
      const click = done?`onclick="showTopicResult('${t.id}')"` : (lk?"":`onclick="pickTopic('${t.id}')"`);
      const act = isProve ? `openProve('${t.id}')` : `doTopic('${t.id}')`;
      return `<div class="act ${cls}" ${click}>
        <span class="a-no">${no}</span>
        <span class="a-txt">${t.label}${tag}</span>
        <span class="a-cost">${cost}</span>
        ${pick?`<div class="adock">
          <button class="btn sm primary" onclick="event.stopPropagation();${act}">${isProve?"呈 证":"问 话"}</button>
          <button class="btn sm ghost" onclick="event.stopPropagation();clearPick()">再 想 想</button>
        </div>`:""}
      </div>`;
    }).join("")}</div>`;
  }

  return `<div class="stage-h">
      <div><h2>${p.name}</h2><div class="sub">${p.sub}</div></div>
      <div style="text-align:right"><div class="kicker">今日余筹</div><div style="color:var(--gold-2);font-size:20px">${S.ap}</div></div>
    </div>
    ${tabsHtml}${note}${sceneHtml}${listHtml}`;
}

/* ---------------- 场景渲染 ---------------- */
/* 问话幕的「谁在答话 + 什么情绪」：
   cast 可以是一个人（对象）或一排人（数组）。每个话题用 who 指明问的是谁、react 指明情绪。
   规则优先级：当前选中的话题 → 最近问过的那个人的话题 → 默认。
   于是点不同的话题，画面里的人会各自换姿态——这就是问话幕的联动。 */
function talkCast(sc){
  const c = sc.cast;
  return Array.isArray(c) ? c : (c ? [c] : []);
}
function talkState(sc, tps){
  const cast = talkCast(sc);
  const pickId = S.pick;
  const named = cast.find(c=>c.name);

  /* 选中某话题：那个人摆出该话题的 react */
  if(pickId){
    const t = tps.find(x=>x.id===pickId);
    if(t) return {who:t.who||(named?named.name:null), mood:t.react||"calm"};
  }
  /* 已问过：停在最后一个被问过的人身上 */
  const doneT = tps.filter(x=>S.done[x.id] && x.react);
  if(doneT.length){
    const t = doneT[doneT.length-1];
    return {who:t.who||(named?named.name:null), mood:t.react};
  }
  return {who:named?named.name:null, mood:(named&&named.mood)||"calm"};
}
function renderScene(sc, place, tab){
  const sps = spotsOf(place).filter(spotVisible);
  const byId = {}; sps.forEach(s=>byId[s.id]=s);
  const hot = (sc.hot||[]).filter(h=>byId[h.id]);

  const marks = hot.map(h=>{
    const sp = byId[h.id];
    const done = !!S.done[sp.id];
    const cls = done ? (sp.clue ? "hit" : "miss") : "todo";
    const mx = h.mx!=null ? h.mx : h.x + h.w/2;
    const my = h.my!=null ? h.my : h.y + h.h/2;
    return `<g class="hsm ${cls}"><circle cx="${mx}" cy="${my}" r="${done?4:3.2}"/>`
         + (done && sp.clue ? `<circle class="ring" cx="${mx}" cy="${my}" r="8"/>` : "")
         + `</g>`;
  }).join("");

  /* 问话幕：按当前状态重画被问的人，叠在底景之上（底景里已不画人） */
  let figLayer = "";
  if(tab==="talk" && sc.cast){
    const tps = topicsOf(place).filter(topicVisible);
    const st = talkState(sc, tps);
    figLayer = talkCast(sc).map(c=>{
      const active = !c.name || !st.who || c.name===st.who;
      const mood = active ? st.mood : (c.mood||"calm");
      const rx = (c.react||{})[mood] || {};
      return K.fig(c.x + (rx.dx||0), c.y + (rx.dy||0), c.pose||"seat",
                   Object.assign({mood, tone:c.tone, tone2:c.tone2, mark:c.mark, op:active?(c.op==null?1:c.op):(c.dim||.5)}, rx));
    }).join("");
  }

  const rects = hot.map(h=>{
    const sp = byId[h.id];
    const done = !!S.done[sp.id];
    const lk = !done && spotLocked(sp);
    const cls = done ? "fin" : (lk ? "lock" : "");
    const act = done ? `showSpotResult('${sp.id}')` : (lk ? "" : `hsClick('${sp.id}')`);
    return `<rect class="hs ${cls}${S.tapSel===sp.id?" sel":""}" data-spot="${sp.id}" x="${h.x}" y="${h.y}" width="${h.w}" height="${h.h}" rx="${h.rx||6}"`
         + (act ? ` onclick="${act}"` : "") + `></rect>`;
  }).join("");

  const touch = isTouch();
  /* 只有勘验页（有热区、要点选）才需要横滑保精度；问话页是纯插画，缩放看全就好 */
  const tapable = hot.length > 0;

  const def = tab==="search"
    ? (touch
        ? "轻触物事，先看清是什么；<b>再点一次才勘验</b> —— 有明有暗，搜错了，筹照花。"
        : "把光标移到场景中的物事上 —— 有明有暗，看不清的，筹也照花。")
    : (sc.cast && S.pick ? "她看住你问的这句话。点下方朱色按钮，才算真问出口。" : "她就在那儿。从下方择一处问起。");

  return `<div class="scene">
    <div class="scene-scroll${tapable?" tapable":""}" onmouseover="sceneHover(event)" onmouseout="sceneOut(event)">
      <svg viewBox="0 0 1120 460" xmlns="http://www.w3.org/2000/svg">${sc.svg}${figLayer}${marks}${rects}</svg>
    </div>
    ${tapable ? `<div class="scene-pan">← 左 右 滑 动 看 全 景 →</div>` : ""}
    <div class="scene-tip" id="sceneTip" data-def="${def.replace(/<[^>]+>/g,"")}"><i>${def}</i></div>
  </div>`;
}

function sceneHover(e){
  const t = e.target;
  if(!t || !t.classList || !t.classList.contains("hs")) return;
  hsTip(t.getAttribute("data-spot"));
}
function sceneOut(e){
  const t = e.target;
  if(!t || !t.classList || !t.classList.contains("hs")) return;
  hsTipOff();
}
function hsTip(sid){
  const el = document.getElementById("sceneTip"); if(!el || !sid) return;
  const p = PLACE_MAP[S.current]; if(!p) return;
  const sp = spotsOf(p).find(x=>x.id===sid); if(!sp) return;
  const done = !!S.done[sid];
  const lk = !done && spotLocked(sp);
  const picked = !done && !lk && isTouch() && S.tapSel===sid;
  const st = done ? (sp.clue ? "已录 · "+CLUES[sp.clue].name : "已勘 · 无所得")
                  : (lk ? "尚无由头" : (picked ? "再点一次 · 勘验" : ("可勘 · 耗 "+costOf(sid)+" 筹")));
  const col = picked ? "#e79aa2" : (done ? "var(--jade)" : (lk ? "var(--paper-3)" : "var(--gold-2)"));
  el.className = "scene-tip on";
  el.innerHTML = `<b>${sp.name}</b><span style="color:var(--paper-3)">${done?"点击可回看":sp.hint}</span>`
               + `<span style="margin-left:auto;white-space:nowrap;color:${col}">${st}</span>`;
}
function hsTipOff(){
  /* 触屏没有「移开」这回事，别把刚点中的提示抹掉 */
  if(isTouch() && S.tapSel && !S.done[S.tapSel]){ hsTip(S.tapSel); return; }
  const el = document.getElementById("sceneTip"); if(!el) return;
  el.className = "scene-tip";
  el.innerHTML = `<i>${el.dataset.def||""}</i>`;
}
function paintSel(sid){
  const rs = document.querySelectorAll(".scene-scroll .hs");
  for(let i=0;i<rs.length;i++) rs[i].classList.toggle("sel", rs[i].getAttribute("data-spot")===sid);
}
/* 场景热区点击：触屏分两段——第一段只「看清」，第二段才真花那一筹 */
function hsClick(sid){
  const p = PLACE_MAP[S.current]; if(!p) return;
  const sp = spotsOf(p).find(x=>x.id===sid); if(!sp) return;
  if(S.done[sid]){ showSpotResult(sid); return; }
  if(spotLocked(sp) || (isTouch() && S.tapSel!==sid)){
    S.tapSel = sid; paintSel(sid); hsTip(sid); return;
  }
  doSpot(sid);
}
function backToTop(){
  try{ window.scrollTo({top:0, behavior: calm() ? "auto" : "smooth"}); }
  catch(e){ window.scrollTo(0,0); }
}
function updToTop(){
  const b = document.getElementById("toTop"); if(!b) return;
  b.classList.toggle("show", isNarrow() && (window.pageYOffset||0) > 420);
}
window.addEventListener("scroll", updToTop, {passive:true});
window.addEventListener("resize", updToTop);

function renderRead(){
  const v = S.view;
  const body = (v.body||[]).map(([k,t])=>{
    if(k==="say") return `<p class="say">${t}</p>`;
    if(k==="narr") return `<p class="narr">${t}</p>`;
    if(k==="dim") return `<p class="dim" style="font-size:12.5px">${t}</p>`;
    return `<p>${t}</p>`;
  }).join("");

  const cards = (v.clues||[]).map(cid=>{
    const c = CLUES[cid];
    const tag = v.from==="eaves"
      ? `<span class="evmark good">探听所得 · 未及核</span>`
      : "";
    return `<div class="cluepop">
      <div class="ch">
        <span class="tag ${c.type}">${c.type}</span>
        <span class="ct">${c.name}</span>${tag}
        <span style="margin-left:auto;font-size:10.5px;color:var(--paper-3);letter-spacing:.1em">得自${c.from}</span>
      </div>
      <div class="cd">${c.desc}</div>
      <div class="cp"><b>指向 · </b>${c.point}</div>
    </div>`;
  }).join("");
  /* 听墙角听空了的：给一块成色标，别让玩家以为是 bug */
  const barren = v.from==="eaves" && !(v.clues||[]).length;
  const mark = (v.from==="eaves" && !barren) ? "" :
    (barren ? `<div style="margin-bottom:10px"><span class="evmark void">这一趟白站了</span></div>` : "");

  return `<div class="stage-h">
      <div><h2>${S.current?PLACE_MAP[S.current].name:"探 听"}</h2><div class="sub">${v.label}</div></div>
      <button class="btn sm ghost" onclick="backToPlace()">返 回</button>
    </div>
    <div class="read">${mark}<div class="dialogue ${(v.clues&&v.clues.length)?'':'barren'}">${body}</div>${cards}</div>
    ${v.act?`<div style="margin-top:14px">${v.act}</div>`:""}
    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="backToPlace()">继续查别处</button>
      <button class="btn ghost" onclick="renderGame()">回到案台</button>
    </div>`;
}

function renderCluebook(){
  if(!clueCount()) return `<div class="empty-note">线索簿空着。<br>去搜，去问，去翻档册。</div>`;
  const groups = {"物证":[],"证词":[],"时间":[]};
  Object.keys(S.found).forEach(cid=>{ groups[CLUES[cid].type].push(cid); });
  let html = "";
  ["物证","证词","时间"].forEach(t=>{
    if(!groups[t].length) return;
    html += `<div class="cluegrp"><div class="gh">${t} · ${groups[t].length}</div>`;
    groups[t].forEach((cid,i)=>{
      /* 不显示内部编号：编号的奇偶与相邻关系会反向暴露真假配对 */
      html += `<div class="cluecard" onclick="showClue('${cid}')">
        <span class="cid">${String(i+1).padStart(2,"0")}</span>${CLUES[cid].name}</div>`;
    });
    html += `</div>`;
  });
  return html;
}

/* ---------------- 操作 ---------------- */
function selectPlace(id){
  S.current=id; S.view=null; S.tab=null; S.tapSel=null; S.pick=null; renderGame(); focusStage();
}
function setTab(t){
  S.tab=t; S.view=null; S.tapSel=null; S.pick=null; renderGame(); focusStage();
}
function backToPlace(){ S.view=null; S.tapSel=null; renderGame(); focusStage(); }
/* 清单两段式：先选中看清这是什么，再按按钮才真花那一筹。
   规则同触屏热区——点条目只「选中」，确认键才执行；点同一项可撤销。 */
function pickSpot(sid){
  if(S.done[sid]){ showSpotResult(sid); return; }
  const sp = spotsOf(PLACE_MAP[S.current]).find(x=>x.id===sid);
  if(!sp || spotLocked(sp)) return;
  S.pick = (S.pick===sid) ? null : sid;
  if(S.pick) S.tapSel = sid; else S.tapSel = null;
  renderGame(); focusStage();
}
function pickTopic(tid){
  if(S.done[tid]){ showTopicResult(tid); return; }
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t || topicLocked(t)) return;
  /* 呈证型不必先选中再确认——它本来就要在弹层里挑证据，多一层反而累 */
  if(t.show){ openProve(tid); return; }
  S.pick = (S.pick===tid) ? null : tid;
  renderGame(); focusStage();
}
function clearPick(sid){ S.pick=null; S.tapSel=null; renderGame(); focusStage(); }

/* ---- 调查方向：判定某条目是否属于本日选定方向 ---- */
function focusCur(){ return S.focusDay===S.round ? FOCUS.find(f=>f.id===S.focus) : null; }
function focusOf(eid){
  const f = FOCUS_OF[eid];
  if(f) return f;
  /* 未显式归类的问话条目，一律算「查人心」 */
  return (""+eid).startsWith("t") ? "heart" : null;
}
/* 该条目本日是否享受折扣 */
function isFocused(eid){
  const f = focusCur(); if(!f) return false;
  return focusOf(eid) === f.id;
}
/* 本次查询的实际耗筹：方向内减半（向上取整），最少 1。
   刑讯记档（S.harsh）只压「问话类」——勘验看的是物事，物事不怕你。 */
function costOf(eid){
  const tax = (S.harsh && /^t/.test("" + eid)) ? HARSH_TAX : 0;
  return (isFocused(eid) ? 1 : 2) + tax;
}
/* 扣筹：按 costOf 扣，不足则提示并失败 */
function spendFor(eid){
  const c = costOf(eid);
  if(S.ap >= c){
    S.ap -= c; S.settled++;
    if(c < 2) S.halfCount++;
    return true;
  }
  if(S.ap > 0 && c === 2){
    toast("余筹不足这一处的耗用。","此间不属你今日所查的方向，须耗两筹。","（余筹 " + S.ap + " 筹——换个方向内的去处，或结束本日。）");
    return false;
  }
  toast("今日余筹已尽。","请结束本日，明日再来。");
  return false;
}
function spend(){ /* 兼容旧调用点：默认按两筹（即无折扣） */
  return spendFor("__none__");
}

/* ================================================================
   解密引擎
================================================================ */
function decOf(eid){ return DECRYPT[eid] || null; }
/* 该条目的线索是否被加密且尚未解开 */
function isLockedClue(eid, clueId){
  const d = decOf(eid);
  return !!(d && d.clue && clueId===d.clue && !S.solved[eid]);
}

/* 打开解密面板 */
function openDecrypt(eid, after){
  const d = decOf(eid);
  if(!d || S.solved[eid]) return false;
  S.decTarget = eid;
  S.decAfter = after || null;
  S.decState = { picked:[], sel:0, done:false, msg:"", msgCls:"", filled:{}, tries:0 };
  renderDecrypt();
  return true;
}
function closeDecrypt(){
  const m = document.querySelector(".dmz"); if(m) m.remove();
  S.decTarget=null; S.decAfter=null; S.decState=null;
}
function renderDecrypt(){
  const eid = S.decTarget; const d = decOf(eid); if(!d) return;
  const st = S.decState;
  let old = document.querySelector(".dmz"); if(old) old.remove();

  let body = "";
  if(d.kind === "pick1"){
    body = pick1Panel(d, st);
  } else if(d.kind === "cipher"){
    body = cipherPanel(d, st);
  } else if(d.kind === "wax"){
    body = waxPanel(d, st);
  } else {
    body = scrapePanel(d, st);   /* scrape 为主 */
  }

  const m = document.createElement("div"); m.className="dmz";
  m.innerHTML = `<div class="dmz-in">
    <div class="dmz-k">${d.type==="cipher"?"暗 号 破 译":"物 证 辨 读"}</div>
    <h3>${d.title}</h3>
    <div class="dmz-sub">${d.sub}</div>
    ${body}
    <div class="dmz-try">
      ${st.done ? `<button class="btn primary" onclick="finishDecrypt()">收 起 此 物 　→</button>`
                : `<button class="btn primary" onclick="submitDecrypt()">就 是 这 样</button>
                   <button class="btn ghost" onclick="resetDecrypt()">重 来</button>`}
      <button class="btn ghost" onclick="closeDecrypt();renderGame()">先 放 下</button>
    </div>
    <div class="dmz-msg ${st.msgCls}">${st.msg}</div>
  </div>`;
  document.body.appendChild(m);
}

/* --- 刮墨型：选中要刮掉的字；刮净后按 reflow 重排展示 --- */
function scrapePanel(d, st){
  const chars = d.options.map((ch,i)=>{
    const on = st.picked.includes(i);
    return `<span class="glyph ${on?"off":""}" onclick="scrapeTap(${i})">${ch}</span>`;
  }).join("");
  /* 已刮净的部分，按 reflow 顺序预演「现出」的字 */
  const remainIdx = d.options.map((_,i)=>i).filter(i=>!st.picked.includes(i));
  const remain = remainIdx.map(i=>d.options[i]).join("");
  const reflowTxt = (d.reflow||[]).map(i=>d.options[i]).join("");
  const done = remainIdx.length === (d.reflow||[]).length;
  const preview = (d.text ? "" : "") +
    `<div style="margin-top:10px;font-size:13px;color:#a8988a">刮净后余下 <b style="color:var(--gold-2)">${remain||"—"}</b>`
    + (done ? `　→　纸背原稿：<b style="color:var(--gold-2)">${reflowTxt}</b>` : ``) + `</div>`;
  return `<div class="dmz-plate">${chars}</div>
    <div class="dmz-hint">${d.prompt}</div>${preview}`;
}
function scrapeTap(i){
  const st = S.decState; if(st.done) return;
  const at = st.picked.indexOf(i);
  if(at>=0) st.picked.splice(at,1); else st.picked.push(i);
  st.msg=""; st.msgCls=""; renderDecrypt();
}

/* --- 镜读型：纸面是反的，选出镜中翻正的那一句 --- */
function pick1Panel(d, st){
  const lines = (d.text||"").split("／").map(s=>{
    const rev = s.split("").reverse().join("");
    return `<div style="font-size:15px;color:#8a7c6b;letter-spacing:.06em;margin:3px 0">${rev}</div>`;
  }).join("");
  const opts = d.options.map((o,i)=>{
    const on = st.picked.includes(i);
    return `<div class="glyph ${on?"on":"lock"}" style="display:block;font-size:13.5px;line-height:1.7;
      min-width:0;margin:7px 0;padding:9px 12px;text-align:left;border:1px solid var(--line);border-radius:3px"
      onclick="pick1Tap(${i},this)">${o}</div>`;
  }).join("");
  return `<div class="dmz-plate" style="text-align:left">
      <div style="font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:6px">铜 镜 中 所 见</div>
      ${lines}
    </div>
    <div class="dmz-hint">${d.prompt}</div>
    <div style="margin-top:8px">${opts}</div>`;
}
function pick1Tap(i){
  const st = S.decState; if(st.done) return;
  st.picked = [i]; st.msg=""; st.msgCls=""; renderDecrypt();
}

/* --- 拼合型：点出最合得上的一块 --- */
function waxPanel(d, st){
  const g = d.options.map((ch,i)=>{
    const on = st.picked.includes(i);
    return `<span class="glyph ${on?"on":""}" style="font-size:30px" onclick="waxTap(${i})">${ch}</span>`;
  }).join("");
  return `<div class="dmz-plate">${g}</div>
    <div class="dmz-hint">${d.prompt}</div>`;
}
function waxTap(i){
  const st = S.decState; if(st.done) return;
  st.picked=[i]; st.msg=""; st.msgCls=""; renderDecrypt();
}

/* --- 暗号型：从对照表选字，依次填入密文 --- */
function cipherPanel(d, st){
  const keys = Object.keys(d.key);
  const tbl = keys.map(k=>{
    const used = st.filled && Object.values(st.filled).includes(k);
    return `<div class="cc ${used?"used":""}" onclick="cipherPick('${k}')"><b>${k}</b><span>？</span></div>`;
  }).join("");
  const slots = d.cipher.split("").map((k,i)=>{
    const v = (st.filled && st.filled[i]) || null;
    const on = st.sel===i;
    return `<span class="glyph ${v?"on":(on?"": "lock")}" style="${on?"box-shadow:0 0 0 1px var(--gold)":""}"
      onclick="cipherSel(${i})">${v||k}<i class="mini">${v?"":k}</i></span>`;
  }).join("");
  return `<div class="dmz-plate">${slots}</div>
    <div class="dmz-hint">${d.prompt}<br><b>密文（天干）：</b>${d.cipher.split("").join(" ")}</div>
    <div class="cyphtbl">${tbl}</div>`;
}
function cipherSel(i){ const st=S.decState; if(st.done) return; st.sel=i; st.msg=""; st.msgCls=""; renderDecrypt(); }
function cipherPick(k){
  const st = S.decState; if(st.done) return;
  st.filled = st.filled || {};
  st.filled[st.sel] = S.decTarget && DECRYPT[S.decTarget].key[k];
  /* 自动移到下一个空位 */
  const n = DECRYPT[S.decTarget].cipher.length;
  for(let x=1;x<=n;x++){ const j=(st.sel+x)%n; if(!st.filled[j]){ st.sel=j; break; } }
  renderDecrypt();
}

/* --- 提交判定 --- */
function submitDecrypt(){
  const eid = S.decTarget, d = decOf(eid), st = S.decState; if(!d) return;
  let ok = false, detail = "";
  if(d.kind==="cipher"){
    const got = d.cipher.split("").map((k,i)=> (st.filled && st.filled[i]) || "");
    ok = got.every((v,i)=> v === d.answer[i]);
    if(!ok) detail = "译出来的字连不成话。再看看表——每一字都该有它自己的意思。";
  } else if(d.kind==="wax"){
    ok = st.picked.length===1 && d.solution.includes(d.options[st.picked[0]]);
    if(!ok) detail = "缺口对不上。再比一比两片蜡咬合的地方。";
  } else if(d.kind==="pick1"){
    ok = st.picked.length===1 && d.solution.includes(d.options[st.picked[0]]);
    if(!ok) detail = "这一句读不通。镜里的字，后半句在前，前半句在后——再照一遍。";
  } else {
    /* 刮墨：选中的下标集合须恰好等于 solIdx */
    const solIdx = d.solIdx || [];
    const ps = [...st.picked].sort((a,b)=>a-b);
    const ss = [...solIdx].sort((a,b)=>a-b);
    ok = ps.length===ss.length && ps.every((v,i)=> v===ss[i]);
    if(!ok) detail = "刮多了，或刮少了。你要留下的，是最初那一行三个字。";
  }
  if(ok){
    st.done = true; st.msgCls="ok";
    st.msg = "——对了。";
    S.solved[eid] = true;
  } else {
    /* 解错有代价：每次错答扣 1 筹（用尽则只能放下，等来日再解）。
       余筹不足时不扣、也不判错——直接提示，让玩家先结束本日。 */
    if(S.ap < 1){
      st.msgCls="no";
      st.msg = detail + "　（今日余筹已尽，此物先搁下——明日再来。）";
    } else {
      S.ap -= 1; st.tries++;
      st.msgCls="no";
      st.msg = detail + "　（耗去一筹 · 今日余 " + S.ap + " 筹）";
      if(S.ap === 0) st.msg += "　余筹尽了。";
    }
  }
  renderDecrypt();
}
function resetDecrypt(){ const st=S.decState; st.picked=[]; st.filled={}; st.sel=0; st.msg=""; st.msgCls=""; renderDecrypt(); }
function finishDecrypt(){
  const eid = S.decTarget, d = decOf(eid), after = S.decAfter;
  closeDecrypt();
  /* 解密完成 → 现在才真正获得线索 */
  if(d.clue) S.found[d.clue] = true;
  if(typeof after === "function") after();
  else { renderGame(); scrollToStage(); }
}
/* 立即可读的「译出/刮出」结果文案 */
function decryptReadout(eid){ const d=decOf(eid); return d?d.readout:""; }

/* ---------------- 常规查询 ---------------- */
function doSpot(sid){
  const p = PLACE_MAP[S.current];
  const sp = spotsOf(p).find(x=>x.id===sid);
  if(!sp || S.done[sid]) return;
  if(!spendFor(sid)) return;
  S.done[sid]=true;
  S.tapSel=null; S.pick=null;
  /* 若该处的线索加密且未解 → 先解密，解完才录入 */
  if(sp.clue && isLockedClue(sid, sp.clue)){
    S.view = {label: sp.name, body: sp.body, clues: []};
    openDecrypt(sid, ()=>{
      S.view = {label: sp.name, body: sp.body.concat([["narr", decryptReadout(sid)]]), clues:[sp.clue]};
      renderGame(); scrollToStage();
    });
    return;
  }
  if(sp.clue) S.found[sp.clue]=true;
  S.view = {label: sp.name+(sp.clue?"":" · 勘验记录"), body: sp.clue?sp.body:sp.miss, clues: sp.clue?[sp.clue]:[]};
  renderGame(); scrollToStage();
}
function showSpotResult(sid){
  const sp = spotsOf(PLACE_MAP[S.current]).find(x=>x.id===sid);
  if(!sp) return;
  S.tapSel=null; S.pick=null;
  const d = decOf(sid);
  const body = (sp.clue ? sp.body : sp.miss) || [];
  const extra = (d && S.solved[sid]) ? [["narr", decryptReadout(sid)]] : [];
  /* 勘验过但解密没解开：结果页必须给「重解」入口，否则这条线索再也拿不回来 */
  const act = (sp.clue && isLockedClue(sid, sp.clue))
    ? `<button class="btn primary" onclick="reopenDecrypt('${sid}')">重 新 辨 读 此 物</button>` : "";
  S.view = {label: sp.name+(sp.clue?"":" · 勘验记录"), body: body.concat(extra), clues: sp.clue?[sp.clue]:[], act};
  renderGame(); scrollToStage();
}

function doTopic(tid){
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t || S.done[tid] || topicLocked(t) || t.show) return;
  if(!spendFor(tid)) return;
  S.done[tid]=true;
  S.pick=null; S.tapSel=null;
  const locked = (t.clues||[]).some(c=>isLockedClue(tid, c));
  if(locked){
    S.view = {label:t.label, body:t.body, clues:[]};
    openDecrypt(tid, ()=>{
      (t.clues||[]).forEach(c=>S.found[c]=true);
      S.view = {label:t.label, body:t.body.concat([["narr", decryptReadout(tid)]]), clues:t.clues||[]};
      renderGame(); scrollToStage();
    });
    return;
  }
  (t.clues||[]).forEach(c=>S.found[c]=true);
  S.view = {label:t.label, body:t.body, clues:t.clues||[]};
  renderGame(); scrollToStage();
}
function showTopicResult(tid){
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t) return;
  S.pick=null;
  const d = decOf(tid);
  const extra = (d && S.solved[tid]) ? [["narr", decryptReadout(tid)]] : [];
  /* 问话过但解密没解开：同样给「重解」入口 */
  const locked = (t.clues||[]).some(c=>isLockedClue(tid, c));
  const act = locked ? `<button class="btn primary" onclick="reopenDecrypt('${tid}')">重 新 辨 读 此 物</button>` : "";
  S.view = {label:t.label, body:(t.body||[]).concat(extra), clues:t.clues||[], act};
  renderGame(); scrollToStage();
}

/* ---- 解密补救：勘验/问话已 done 但解密未解开时，允许随时回来重解 ----
   doSpot/doTopic 只在未 done 时可达；若玩家当日点「先放下」或余筹耗尽，
   此前这条线索就永久丢失了（提示还说「明日再来」，实际无处可来）。 */
function decryptAfterOf(eid){
  for(const p of PLACES){
    const sp = (spotsOf(p)||[]).find(x=>x.id===eid);
    if(sp && sp.clue) return ()=>{
      S.view = {label: sp.name, body: (sp.body||[]).concat([["narr", decryptReadout(eid)]]), clues:[sp.clue]};
      renderGame(); scrollToStage();
    };
    const t = (topicsOf(p)||[]).find(x=>x.id===eid);
    if(t) return ()=>{
      (t.clues||[]).forEach(c=>S.found[c]=true);
      S.view = {label:t.label, body:(t.body||[]).concat([["narr", decryptReadout(eid)]]), clues:t.clues||[]};
      renderGame(); scrollToStage();
    };
  }
  return null;
}
function reopenDecrypt(eid){
  if(S.solved[eid]) return;
  const after = decryptAfterOf(eid);
  if(!after) return;
  openDecrypt(eid, after);
}

/* ---- 呈证 ---- */
function openProve(tid){
  if(S.ap<=0){ toast("今日余筹已尽。","请结束本日，明日再来。"); return; }
  const ids = Object.keys(S.found);
  if(!ids.length){ toast("你手上没有凭据。","空口问不进去——先去搜，去查，回头再来。"); return; }
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t) return;
  /* 手上若根本没有能与他对质的东西，就不让他白花这一筹 */
  const can = ids.filter(cid => (t.show||[]).includes(cid) && !S.denied[tid+":"+cid]);
  if(!can.length){
    toast("他还没有开口的由头。","空口问不进去。你手上这些东西，推到他面前，他只会看一眼，还给你。","（这一筹，不必花。先去别处搜一搜、翻一翻，手里有了东西再来。）");
    return;
  }
  S.pick=null;        /* 弹层已开，清单上的选中态撤掉，免得回来时还亮着 */
  const rows = ids.map(cid=>{
    const c = CLUES[cid];
    const dead = S.denied[tid+":"+cid];
    return `<div class="pv ${dead?"dead":""}" ${dead?"":`onclick="commitProve('${tid}','${cid}')"`}>
      <span class="ptype" style="margin-right:8px">${c.type}</span>
      <span>${c.name}</span>
      <span class="ptype">${dead?"已呈·被否":""}</span>
    </div>`;
  }).join("");
  const isVerify = !!t.proveLabel;
  const m = document.createElement("div");
  m.className="modal"; m.onclick=e=>{if(e.target===m)m.remove();};
  m.innerHTML = `<div class="modal-in">
    <h3>${t.proveLabel || "呈 证 逼 问"}</h3>
    <div class="ms">${t.label}</div>
    <p class="muted" style="font-size:13.5px;line-height:1.9">${isVerify?"挑一样东西递过去。":"挑一条凭据推过去。"}<b style="color:#e79aa2">${isVerify?"递错了，这一筹就白花了。":"挑错了，这一筹就白花了。"}</b>（本次耗 ${costOf(tid)} 筹）已被否认过的，不必再试。</p>
    <div class="provegrid" style="margin-top:16px">${rows}</div>
    <div style="margin-top:18px;text-align:right"><button class="btn sm ghost" onclick="this.closest('.modal').remove()">再 想 想</button></div>
  </div>`;
  document.body.appendChild(m);
}
function commitProve(tid,cid){
  document.querySelectorAll(".modal").forEach(x=>x.remove());
  const t = topicsOf(PLACE_MAP[S.current]).find(x=>x.id===tid);
  if(!t) return;
  if(!spendFor(tid)) return;
  S.pick=null; S.tapSel=null;
  if((t.show||[]).includes(cid)){
    S.done[tid]=true;
    (t.clues||[]).forEach(c=>S.found[c]=true);
    S.view = {label:t.label, body:t.body, clues:t.clues||[]};
  } else {
    S.denied[tid+":"+cid]=true;
    S.view = {label:t.label+" · 呈证未果", body:t.wrong, clues:[]};
  }
  renderGame(); scrollToStage();
}

function showClue(cid){
  const c = CLUES[cid];
  const m = document.createElement("div");
  m.className="modal"; m.onclick=e=>{if(e.target===m)m.remove();};

      <div class="cp"><b>指向 · </b>${c.point}</div>

function toast(t,s,small){
  const m = document.createElement("div");
  m.className="modal";
  m.innerHTML = `<div class="modal-in" style="max-width:430px;text-align:center">
    <h3>${t}</h3><p class="muted" style="font-size:13.5px;margin:10px 0 ${small?"7px":"18px"}">${s||""}</p>

function endDay(confirmFirst){
  const left = PLACES.filter(p=>p.open<=S.round).reduce((n,p)=>
    n + spotsOf(p).filter(sp=>spotVisible(sp)&&!S.done[sp.id]).length
      + topicsOf(p).filter(t=>topicVisible(t)&&!S.done[t.id]).length, 0);
  if(confirmFirst && S.ap>0 && left>0){
    const m=document.createElement("div"); m.className="modal";
    m.innerHTML=`<div class="modal-in" style="max-width:470px;text-align:center">
      <h3>今日尚有 ${S.ap} 筹未用</h3>
      <p class="muted" style="font-size:13.5px;margin:10px 0 8px">这一日未查的去处，来日未必仍想得起来。<br>可筹用尽了，就真的没有了。</p>
      <p class="dim" style="font-size:12.5px;margin-bottom:16px">线索簿：已获 ${clueCount()} 条，尚有 <b style="color:var(--gold)">${TOTAL_CLUES-clueCount()}</b> 条未入手——来日仍可回头补。</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:18px">
        <button class="btn" onclick="this.closest('.modal').remove()">再 查 一 会</button>
        <button class="btn primary" onclick="this.closest('.modal').remove();forceEndDay()">结 束 本 日</button>
      </div></div>`;
    m.onclick=e=>{if(e.target===m)m.remove();};
    document.body.appendChild(m); return;
  }
  forceEndDay();
}
function forceEndDay(){
  if(S.round>=3){ renderVerdict(); return; }
  S.round++; S.ap=S.apMax[S.round]; S.current=null; S.view=null; S.tab=null; S.tapSel=null;
  S.focus=null; S.focusDay=0; S.halfCount=0;   /* 次日须重定方向 */
  renderGame(); backToTop();
  openFocus();                                  /* 换日即提示定方向 */
}

/* ---------------- 结案 ---------------- */
const SUSPECTS = ["德妃 陈妙真","皇后 韩令仪","婉贵人 卫昭","大宫女 秋棠","太医 周鹤"];
/* 两条证据链（只列「承重的」几条——链的完整度按这里算）。
   设计要点：**每条链都要有一个「主场方向」**，让选它对的人真能把它查透；
   其余方向也有零星几条，算「路过所见」——够你看见另一头，但不足以查穿。
     德妃链 → 主场 poison（3 条），另 2 条散在 heart
     皇后链 → 主场 gate  （3 条），另 3 条散在 shield / heart
   这样「选方向」不是选难度，是选**你要把哪一头查到底**。 */
const D_CHAIN = ["c10","c12","c13","c27","c33"];
const E_CHAIN = ["c15","c16","c21","c23","c24","c28"];

function renderVerdict(){

    const c=CLUES[cid];
    return `<div class="opt" data-v="${cid}" onclick="pick('q4',this)">
      <span class="dot"></span><span>${c.name}</span>
      <span class="ohint">${c.type}</span></div>`;
  }).join("") + `<div class="opt" data-v="__none__" onclick="pick('q4',this)">
      <span class="dot"></span><span>皆可采信 · 我没有发现伪证</span></div>`)
    : `<div class="empty-note">你什么都没查到，也无从剔除。</div>`;

  app().innerHTML = `
  <section id="verdict">

    <div class="frame" style="margin-top:16px">

          ${SUSPECTS.map((s,i)=>`<div class="opt" data-v="${i}" onclick="pick('q1',this)">
            <span class="dot"></span><span>${s}</span>${['<span class="ohint">协办六宫节礼</span>','<span class="ohint">与贵妃结怨最深</span>','<span class="ohint">匣底藏着一包白粉</span>','<span class="ohint">端汤的人</span>','<span class="ohint">改药方的人</span>'][i]||''}</div>`).join("")}
        </div>
      </div>

      <div class="q">
        <div class="qn">第 二 问</div>
        <h4>是 谁 取 走 了 贵 妃 的 活 路 ， 使 其 必 死 ？</h4>
        <div class="opts" id="q2">
          ${SUSPECTS.map((s,i)=>`<div class="opt" data-v="${i}" onclick="pick('q2',this)">
            <span class="dot"></span><span>${s}</span></div>`).join("")}
          <div class="opt" data-v="9" onclick="pick('q2',this)">
            <span class="dot"></span><span>无人 · 只是毒发太快，来不及救</span></div>
        </div>
      </div>

      <div class="q">
        <div class="qn">第 三 问</div>
        <h4>呈 上 关 键 证 据</h4>
        <p class="dim" style="font-size:12.5px;margin-bottom:12px">你三日所获共 ${evIds.length} 条，可呈 <b style="color:var(--gold)">${need}</b> 条。</p>
        <div class="evpick" id="q3">${evHtml}</div>

        <div class="opts" id="q4" style="max-height:280px;overflow:auto">${misHtml}</div>
      </div>

          查清是一回事，呈报是另一回事。这一份折子递上去，是要给宫里所有人看的——
          你要报的，不止是真相，还有你自己往后三日的活路。</p>
        <div class="endings" id="q5">
          ${CHOICES.map(c=>`<div class="ecard" data-v="${c.id}" onclick="pick('q5',this)">
            <div class="en">${c.name}</div>

        </div>

        <button class="btn primary" onclick="submitVerdict()">呈 报 圣 裁</button>
        <button class="btn ghost" onclick="renderVerdict()">重 新 填 写</button>

      </div>

function pick(gid, el){
  /* 第五问的选项是 .ecard，选中态类为 .on（金色描边）；
     前四问的选项是 .opt，选中态类为 .sel。
     submitVerdict 读的正是 "#q5 .ecard.on" —— 这里若只加 .sel，
     卡片点了不变色、也永远选不上。 */
  const isCard = el.classList.contains("ecard");
  const cls  = isCard ? "on"  : "sel";
  const kind = isCard ? ".ecard" : ".opt";
  el.parentNode.querySelectorAll(kind).forEach(o=>o.classList.remove(cls));
  el.classList.add(cls);
}
function toggleEv(el){
  const cap = Math.min(3, document.querySelectorAll("#q3 .ev").length);
  const sel = el.parentNode.querySelectorAll(".ev.sel");
  if(!el.classList.contains("sel") && sel.length>=cap){ toast(`只呈 ${cap} 条。`,"关键证据贵精不贵多。"); return; }
  el.classList.toggle("sel");
}

function submitVerdict(){
  const q1 = document.querySelector("#q1 .opt.sel");
  const q2 = document.querySelector("#q2 .opt.sel");
  const q4 = document.querySelector("#q4 .opt.sel");
  const q5 = document.querySelector("#q5 .ecard.on");
  const evs = [...document.querySelectorAll("#q3 .ev.sel")].map(e=>e.dataset.cid);
  const err = document.getElementById("vErr");
  if(!q1||!q2){ err.textContent="前两问皆须作答。"; return; }
  const need = Math.min(3, Object.keys(S.found).length);
  if(evs.length < need){ err.textContent=`须举足 ${need} 条证据。`; return; }
  if(Object.keys(S.found).length>0 && !q4){ err.textContent="第四问须作答——剔出一条，或声明皆可采信。"; return; }
  if(!q5){ err.textContent="第五问须作答——你要报什么？"; return; }

  const a1 = +q1.dataset.v, a2 = +q2.dataset.v;
  const dHit = evs.filter(x=>D_CHAIN.includes(x)).length;
  const eHit = evs.filter(x=>E_CHAIN.includes(x)).length;
  const dropped = q4 ? q4.dataset.v : "__none__";
  const badEv = evs.filter(x=>CLUES[x].mislead);
  const choice = q5.dataset.v;
  S.chosen = choice;
  S.verdict = {a1,a2,evs,dHit,eHit,dropped,badEv,choice};
  renderReveal();
  backToTop();
}
/* 「攥住一条链」的判定：该链的证据，我手上有几条 / 该链一共几条。
   链的完整度不看「举了几条」，而看「S.found 里落了该链几条」——
   因为呈证只能举少数几条，真正的底子是三天里搜出来的那些。 */
function chainHeld(ids){
  const all = ids.filter(c=>!CLUES[c].mislead);
  const held = all.filter(c=>S.found[c]);
  return {held:held.length, all:all.length, full:held.length>=all.length, lvl: held.length/all.length};
}
/* 方向掌握度：玩家三天里所走方向，哪个方向查得最透 */
function focusMastery(){
  const by={};
  FOCUS.forEach(f=>by[f.id]={id:f.id,ico:f.ico,name:f.name,hit:0,total:0});
  Object.keys(FOCUS_OF).forEach(eid=>{
    const d=FOCUS_OF[eid]; if(!by[d]) return;
    const p=PLACE_MAP[entryPlace(eid)]; if(!p) return;
    const sp=(p.spots||[]).find(s=>s.id===eid);
    const tp=(p.topics||[]).find(t=>t.id===eid);
    const cs= sp ? (sp.clue?[sp.clue]:[]) : (tp?tp.clues||[]:[]);
    cs.filter(c=>CLUES[c]).forEach(c=>{ if(!CLUES[c].mislead){ by[d].total++; if(S.found[c]) by[d].hit++; } });
  });
  let best=null;
  Object.values(by).forEach(x=>{ if(x.total && (!best || x.hit/x.total > best.hit/best.total)) best=x; });
  return {by, best};
}
function entryPlace(eid){
  for(const p of PLACES){
    if((p.spots||[]).some(s=>s.id===eid)) return p.id;
    if((p.topics||[]).some(t=>t.id===eid)) return p.id;
  }
  return null;
}

/* ---------------- 结局判定（两层） ----------------
   第一层：调查方向 → 你把这案子「查成了什么形状」（掌握度）
   不是「两链都有才算好」。三天只能攥住一条链，这是本子的前提。
   判定看两条链各自的完整度，取最好的那一条当「主证链」：
     deep     主证链 ≥ 70% 且另一链也沾了边 → 你查透了一头，也看见了另一头
     solid    主证链 ≥ 70%（另一链没沾边） → 你把一头查到了底
     thin     主证链 ≥ 35%                  → 只摸到皮毛
     none     主证链 < 35%                  → 什么也没攥住
   阈值取 70%：两条链长短不一（德妃链 5 条 / 皇后链 9 条），
   所以「查透」按比例算——攥住 5 条中的 4 条，与 9 条中的 6 条，
   是同一档功夫。这样四个方向都够得着 deep，选哪条都不吃亏。
   第二层：结案取舍 → 报什么（CHOICES）
   二者组合出不同结局。
------------------------------------------------- */
function endingOf(v){
  const ok1 = v.a1===0, ok2 = v.a2===1;
  /* 「断对」还不够——手上得有东西。两链一条都没沾上，等于空口断案。 */
  const d = chainHeld(D_CHAIN), e = chainHeld(E_CHAIN);
  const hasAny = (d.held + e.held) > 0;
  const both = ok1 && ok2 && hasAny;
  /* 主证链 = 查得更透的那条 */
  const main = (d.lvl >= e.lvl) ? {name:"德妃链", ...d, side:"d"} : {name:"皇后链", ...e, side:"e"};
  const other = (main.side==="d") ? {name:"皇后链", ...e} : {name:"德妃链", ...d};
  const lvl = main.lvl>=0.7 ? (other.held>0 ? "deep" : "solid")
            : main.lvl>=0.35 ? "thin" : "none";
  const fm = focusMastery();
  const dirName = fm.best ? fm.best.name : "无";
  /* 结案档位的关键：你要报全部真相，就必须「查得出全部真相」；
     报得少，对查得浅的人反而是「稳」。 */
  const t = v.choice || "full";
  let title, sub, text, color;
  if(t==="full"){
    if(both && lvl==="deep"){
      title="铁 案"; sub="上 上 考"; color="#8fc9a0";
      text=`你把主证链查到了底——${main.name} ${main.held}/${main.all} 条凭据在手，另一头也没放过。\
三日里你走的是「${dirName}」这一路，却把案子查成了全须全尾。\
折子递上去，中宫与景仁宫，谁也翻不了。圣上要的是「查到谁报谁」，你做到了。\
只是从今日起，这宫里有两个人，会一辈子记得你的字迹。`;
    } else if(both && lvl==="solid"){
      title="孤 证"; sub="中 考"; color="#d59a5e";
      text=`你指对了人，却只握得住一条链。折子上「${main.name}」那半写满了凭据，另一头只有你的断语。\
朝上若有人替那一头说话，你这一份，挡不住。\
断案要断得狠，也要断得稳——换个方向再走一遍，或许就是另一种收梢。`;
    } else if(both){
      title="半 卷"; sub="下 考"; color="#dd8e84";
      text=`你只报了一半，而这一半也不是全对。折子递上去，该抓的人没抓，该放的没放。\
圣上翻了翻，搁在一旁——他什么也没说。宫里最怕的不是斥责，是这种不问。`;
    } else {
      title="错 卷"; sub="不 第"; color="#dd8e84";
      text=`你报错了人，还报得理直气壮。这是三份结局里最险的一种：指着一位有权有势的宫妃说她是凶手，\
凭据却是别人替她铺好的。三日之期过了，接下来，是本子之外的另一桩案子了。`;
    }
  } else if(t==="onlyD"){
    if(ok1){
      title="结 案"; sub="中 上 考"; color="#d59a5e";
      text=`德妃下毒一事，人证物证俱在，报得干净利落。中宫那半张，你按下了——\
这不失为一种稳。贵妃之死有了一个「凶手」，六宫有了一个交代，你也有了往后的日子。\
只是你自己心里知道：真正把门关上的人，还在原位上。`;
    } else {
      title="漏 刀"; sub="下 考"; color="#dd8e84";
      text=`你报了德妃的名，却漏了她真正的罪由；中宫那半张你按下不提，可连德妃这一半，你也没抓实。\
折子递上去，德妃喊冤，你拿不出证据。查得浅，报得也浅，两头落空。`;
    }
  } else if(t==="shield"){
    title="全 身"; sub="中 考"; color="#8fb3c9";
    text=`你把德妃写实了，把中宫写虚了——「忧虑过度、处置失当」，八个字一笔带过。\
这一份折子，长秋宫挑不出错，景仁宫也翻不了案。你保住了自己，也保住了一位中宫。\
往后这宫里若再死一个人，你今夜写的这八个字，会替你回答。`;
  } else { /* silent */
    if(lvl==="none"){
      title="卷 宗"; sub="中 上 考"; color="#8fb3c9";
      text=`「贵妃暴疾而薨。」六个字，一份干净的卷宗。你其实没查到什么，这倒与你要的「干净」正好相合。\
只是这不是你选了它，是它选中了你。你三日里走过的那些地方，会在你日后想起来的时候，一个一个回来。`;
    } else if(lvl==="deep"||lvl==="solid"){
      title="回 声"; sub="上 考"; color="#8fb3c9";
      text=`你查透了${main.name}${lvl==="deep"?"，也看见了另一头":""}，又亲手把卷宗合上，写成「暴疾而薨」。\
这是本子之外最重的一种选择——你知道真相，且知道从此不能再说。\
三日之期到了，折子递上去，一切干净。只有毓秀宫那盏冷了的蜜，还醒着。`;
    } else {
      title="沉 默"; sub="下 考"; color="#dd8e84";
      text=`你只摸到皮毛，就急着把卷宗合上。这不是「稳」，是心虚——你怕再多查一步，就不得不写点什么。\
折子是干净的，你也是干净的，只剩那半条没查完的线，在暗处搁着。`;
    }
  }
  return {title, sub, text, color, both, lvl, main, other, dirName, ok1, ok2, d, e,
          harsh:!!S.harsh, eavesN:S.eavesN||0};
}

/* ---------------- 复盘 ---------------- */
function renderReveal(){
  const v = S.verdict;
  const ok1 = v.a1===0, ok2 = v.a2===1;
  const both = ok1&&ok2, one = ok1||ok2;
  const dropped = (v.dropped && v.dropped!=="__none__") ? v.dropped : null;
  const droppedOk = !!(dropped && CLUES[dropped].mislead);
  const droppedWrong = !!(dropped && !CLUES[dropped].mislead);
  const badEv = v.badEv || [];
  const cleanEv = badEv.length===0;
  const end0 = endingOf(v);
  const full = both && end0.lvl==="deep";
  let rank, rsub, rbody;

  if(full && droppedOk){
    rank="明镜高悬"; rsub="上 上 考";
    rbody="两只手你都指认了，两头的证据你都握在手里，还自己揪出了那条安在别人身上的伪证。三日之内做到这一步，靠的不是运气——你看的不是「谁最可疑」，是谁在什么时候关了哪一扇门。";
  }else if(full){
    rank="明镜高悬"; rsub="中 考";
    rbody="这一案你断对了：下毒的是德妃，断生路的是皇后，两头的证据也都立得住。可那条明摆着的伪证，你还当它是真的。断对了案，未必看得清证据——真到有人翻案的时候，这半条会被拿住。";
  }else if(both){
    rank="明镜高悬"; rsub="中 考";
    rbody="两个人你都指对了。但呈上的证据偏于一头，链条的另一半还虚着。若朝上有人翻案，你未必接得住。断案断得对，还要立得住。";
  }else if(one){
    rank="雾里看花"; rsub="下 考";
    rbody="你摸到了一半。这桩案子有两只手：一只下了毒，一只把门关上、把解药撤了、把试毒的人调走。你只抓住了其中一只——剩下那只，此刻大概正在长秋宫里饮茶。";
  }else{
    rank="风波亭外"; rsub="不 第";
    rbody="你指错了人。这一案里最像凶手的是婉贵人，最容易被人忽略的是皇后。三日的筹，你用在了看得到的地方。宫里的案子从来不靠动机断，靠时辰、靠档册、靠谁在什么时候说了什么话。";
  }
  /* 第二层：结案取舍 → 结局 */
  const end = endingOf(v);
  let extra="";
  if(v.a1===2||v.a2===2) extra+='<br><span class="dim" style="font-size:13px">（婉贵人那条线：C04 妆匣夹层里那包白粉，其实是珍珠粉——入口不麻、无味、细润如脂，钩吻之末不是这个样子。她失宠后支不到脂粉，自己买珠子磨的，采买档上还记着「珍珠二两」。）</span>';
  if(v.a1===3||v.a2===3) extra+='<br><span class="dim" style="font-size:13px">（秋棠那条线：C18 她袖袋里那个空纸包，装的是薄荷与冰片——醒神散。她夜里守着贵妃，怕自己睡过去。她从头到尾只想让娘娘活下来。）</span>';
  if(v.a1===4||v.a2===4) extra+='<br><span class="dim" style="font-size:13px">（周鹤那条线：C11 他私药匣里那包灰白药末，是生甘草与紫苏——被皇后撤下来的两味。他偷偷留着，是想寻个机会给贵妃补回去。）</span>';
  if(droppedWrong) extra+='<br><span class="dim" style="font-size:13px">（你剔除的 '+dropped.toUpperCase()+'「'+CLUES[dropped].name+'」，是一条实打实的证据。剔除它不是网开一面，是自断臂膀。）</span>';
  /* —— 手段的账：探听与刑讯会改写你这一局的收尾 ——
     本子不设「道德分数」。它只做一件事：把你用过的办法，原样说还给你。 */
  if(end.harsh){
    extra+='<br><span style="color:#e79aa2;font-size:13px">（慎刑司那盏灯，替你问出了话。案子是清了，可第二日起，宫里凡答你的问，都先掂量过一遍——'
        +'你手上的供词，从此都带着那一间屋的影子。往后谁还敢跟你说真话，本子里没写。）</span>';
  } else if(end.eavesN>0){
    extra+='<br><span class="dim" style="font-size:13px">（这一局你走了 '+end.eavesN+' 道门路。买来的、听来的、堵来的——'
        +'它们替你补上了别条线的几处缺口。讨来的从来算不得铁证，可有几条线头，勘验一辈子也摸不着。）</span>';
  }

  const evRows = v.evs.length ? v.evs.map(cid=>{
    const c=CLUES[cid];
    const side = D_CHAIN.includes(cid) ? '<span style="color:#d59a5e">德妃链</span>'
              : (E_CHAIN.includes(cid) ? '<span style="color:#8fb3c9">皇后链</span>' : '<span class="dim">旁证</span>');
    return `<div class="chainli"><span class="cn">${cid.toUpperCase()}</span><span>${c.name} —— ${side}</span></div>`;
  }).join("") : `<p class="dim">你没有呈上任何证据。</p>`;

  app().innerHTML = `
  <section id="reveal">
    <div class="score frame">
      <div class="kicker">Verdict</div>
      <div class="rank">${rank}</div>
      <div class="rsub">${rsub}</div>
      <div class="rbody">${rbody}${extra}</div>
      <div class="checks">
        <span class="chk ${ok1?"ok":"no"}">下毒之人 · ${ok1?"断对":"断错（应为德妃）"}</span>
        <span class="chk ${ok2?"ok":"no"}">断其生路之人 · ${ok2?"断对":"断错（应为皇后）"}</span>
        <span class="chk ${v.dHit>=1&&v.eHit>=1?"ok":"no"}">双侧证据 · 德妃链 ${v.dHit} / 皇后链 ${v.eHit}</span>
        <span class="chk ${cleanEv?"ok":"no"}">所举证据 · ${cleanEv?"无伪证":("混入 "+badEv.map(x=>x.toUpperCase()).join(" / ")+" 伪证")}</span>
        <span class="chk ${droppedOk?"ok":"no"}">识破伪证 · ${droppedOk?("揪出 "+dropped.toUpperCase()):(dropped?"剔错（"+dropped.toUpperCase()+" 是实据）":"未剔（此案有坑）")}</span>
      </div>
      <div class="checks" style="margin-top:8px">
        <span class="chk ${end.d.lvl>=0.7?"ok":""}">德妃链 ${end.d.held}/${end.d.all}</span>
        <span class="chk ${end.e.lvl>=0.7?"ok":""}">皇后链 ${end.e.held}/${end.e.all}</span>
        <span class="chk ${end.lvl==="deep"?"ok":""}">主证链 · ${end.main.name} ${(end.main.lvl*100).toFixed(0)}%</span>
      </div>
      <div class="checks" style="margin-top:8px">
        <span class="chk" style="color:var(--paper-2);border-color:var(--line)">三日获线索 ${Object.keys(S.found).length} / ${TOTAL_CLUES}</span>
        <span class="chk" style="color:var(--paper-2);border-color:var(--line)">勘验 · 问话 ${S.settled} 次</span>
        <span class="chk" style="color:var(--paper-2);border-color:var(--line)">所走方向 · ${end.dirName}</span>
        ${end.eavesN?`<span class="chk ${end.harsh?"no":""}">探听门路 · ${end.eavesN} 道${end.harsh?"（含刑讯）":""}</span>`:""}
        ${Object.keys(S.found).length>=TOTAL_CLUES?'<span class="chk ok">线索保全 · 全数入手</span>':''}
      </div>
    </div>

    <div class="frame sec" style="margin-top:16px;border-color:#c9a5e0">
      <div class="kicker" style="color:#c9a5e0">Ending · 你呈上去的那一份折子</div>
      <div class="erank" style="color:${end.color}">${end.title}</div>
      <div class="esub">${end.sub}</div>
      <div class="ebranch">${end.text}</div>
      <div class="checks" style="margin-top:14px">
        <span class="chk" style="color:var(--paper-2);border-color:var(--line)">结案取舍 · ${(CHOICES.find(c=>c.id===v.choice)||{}).name||"—"}</span>
        <span class="chk" style="color:var(--paper-2);border-color:var(--line)">掌握度 · ${{deep:"主证链深查 + 另一头沾边",solid:"主证链深查",thin:"只摸到皮毛",none:"什么也没攥住"}[end.lvl]}</span>
      </div>
      <p class="dim" style="margin-top:12px;font-size:12.5px;line-height:1.95">
        同一桩案子，五个问法，四种折子。结局不只取决于你<b>断得对不对</b>，还取决于你<b>报得够不够全</b>——
        而报得全，前提是查得出。这就是「调查方向」与「结案取舍」两层的意思：
        方向决定你手里有多少，取舍决定你交出多少。<br>
        <b>三日筹数只够攥住一条链</b>，所以「铁案」要的不是「两条链都握满」，而是
        <b>把一头查到八成以上，同时那只手也没放过</b>——这正是选定方向后要做的取舍。</p>
    </div>

    <div class="frame sec">
      <h2><span class="num">壹</span>真 相 全 貌</h2>
      <p>贵妃沈婉不是死于一个人的手，而是死于两个人的默契。</p>
      <p><b style="color:var(--gold-2)">德妃陈氏</b>在上巳节礼的桂花蜜里下了钩吻末——她要贵妃死，因为沈家正与她父陈邕争两淮盐运，也因为贵妃之子一日日长，压着她的皇三子。她办六宫节礼，便有了单独调换那一瓶蜜的便利；她宫里的林忠，恰在御药房当过差。</p>
      <p><b style="color:var(--gold-2)">皇后韩氏</b>知道这件事。她在德妃身边有耳目。她没有揭发，也没有阻止。她做了三件事：<br>
      ——命太医撤去贵妃药中的生甘草与紫苏，让钩吻之毒发作时无所缓冲；<br>
      ——借「上巳后清整宫器」的常例，收走各宫试毒之器，调开毓秀宫的试毒宫女；<br>
      ——在宫宴未散、一切如常的申时末，便传下夜禁令锁了宫门——她并不知道贵妃今夜会不会饮那盏汤，她只是先把门锁上；待毓秀宫果然来求医，这道令便成了现成的「驳由」，把三次求医的人关在门内，并在丑时明知贵妃垂危之后，回了四个字：「知道了，候。」</p>
      <p>德妃下的是毒。皇后断的是生路。<b style="color:#ffd9a0">没有德妃，贵妃不会中毒；没有皇后，贵妃未必会死。</b>这两个人加在一起，才是一条完整的因果链。</p>
      <p class="dim">夜禁令这一层最见其心：此令一岁不过两道，上一道在上元；而这一道传下来的时候，宫宴未散、人还没事——它不是应变，是预备。皇后不赌贵妃今夜一定中毒，她只确保<b>一旦中毒，门是锁着的</b>。</p>
      <p class="dim">而皇后最深的一层动机，藏在太医院的脉案里——贵妃孕已两月，未宣。中宫无子九年，这一胎是她的催命符，所以她才会对宫人说：「贵妃这一胎，是留不住的。留不住的东西，何必让她费心。」</p>
      <p style="margin-top:12px"><b style="color:var(--gold-2)">还有一支手：</b>案发之后，有人往《慎刑司案卷》里夹了一张反手写的字条，把罪按在婉贵人头上（C07/C20）。纸是档房通用的竹纸，墨是宫中处处有的松烟墨，笔迹是故意反着写的——它指不出任何人，你也不该用它断任何人。可它说明了一件事：<b>你翻哪一本卷、查到哪一步，都有人在看着。</b>封卷之后来调看过这本书的，有景仁宫的人，也有长秋宫的人。</p>
      <p class="dim">——这一案里值得分辨的，从来不只「谁最可疑」，还有「哪一条证据根本立不住」。</p>
    </div>

    <div class="frame sec">
      <h2><span class="num">贰</span>三 月 初 三 · 全 时 序</h2>
      <table class="tbl">

    <div class="frame sec">
      <h2><span class="num">叁</span>手 法 拆 解</h2>
      <p><b style="color:#d59a5e">德妃的两步：</b>其一，借协办六宫节礼之便，涂改《分装单》，使毓秀宫那份由「蜜二瓶」改为「蜜一瓶、蜜饯二盒」，从而把掺毒的那一瓶单独隔离、单独交付；其二，命旧识林忠在分装房换瓶，封蜡照旧，使外观与他宫无异。钩吻末出自御药房外用杀虫的常例药，非禁药，不易引人起疑。</p>
      <p><b style="color:#8fb3c9">皇后的三步：</b>其一，<b style="color:var(--gold)">撤解药</b>——贵妃方中的生甘草、紫苏按例有和缓之效，撤去后毒性无所缓冲，发作骤急；其二，<b style="color:var(--gold)">去防备</b>——借常例收走试毒之器、调开试毒宫女，使贵妃无从自保；其三，<b style="color:var(--gold)">断生路</b>——在宫宴未散时便传夜禁令、锁宫门，拦下亥、子、丑三次求医，丑时明知垂危仍不遣医。前两步是布局，第三步是决定。</p>
      <p class="dim">本案最狠的地方在于：皇后从头到尾没有碰过那瓶蜜。她做的每一件事，写在档册上都是「合规」的——清整宫器是常例，改药方是关切，夜禁是戒备。所以只查「谁下了毒」，永远查不到她。</p>
      <p style="margin-top:12px"><b style="color:var(--gold-2)">附论 · 宫里的「试毒」是怎么一回事：</b>本朝的试毒之制，靠的是银器。可银针验的是<b>硫</b>，不是钩吻——蜜饯熏硫、药材熏硫，连蜜瓶口的封纸都熏过，六宫的银针本来就乌，六宫的银匙本来就干净。这一案的死者身边有三重防线：一根银针、一名试毒宫女、一个每夜必服的安胎方。银针验不出钩吻，试毒宫女被一纸差遣调走，安胎方里两味缓毒的药被朱笔勾掉。<b style="color:#ffd9a0">三重防线，没有一重是真的。</b></p>
      <p class="dim">所以这一案真正的题眼不是「谁下了毒」，是「<b>谁在什么时候把防护一层层拆掉，且每一层都拆得合规</b>」。银针那一条，是留给细心的玩家的：你若从头到尾信银器，这案子的三个关键判断都会歪。</p>
    </div>

    <div class="frame sec">
      <h2><span class="num">肆</span>完 整 线 索 链</h2>
      <p class="dim" style="margin-bottom:14px">每个关键结论，都有两条以上独立线索指向。这就是为什么这一案可以被「推理」出来，而不是靠猜。</p>
      <div class="chain">
        <div class="chainli"><span class="cn">结论一</span><span><b style="color:var(--gold-2)">毒在蜜里，不在汤里，且是分装后被掺入的。</b><br>
        → C01（遗体勘验：毒自口入，非暴卒）<br>
        → C02（盏底灰白沉淀，未化开——下毒在蜜盛瓶之后）<br>
        → C10（六宫同批节礼，唯毓秀宫这一瓶有毒）</span></div>

        <div class="chainli"><span class="cn">结论二</span><span><b style="color:var(--gold-2)">掺毒的是德妃。</b><br>
        → C12（分装单被涂改，「二瓶」改「一瓶、蜜饯二盒」，改笔出自景仁宫）<br>
        → C13（三月初一，景仁宫林忠领取钩吻末，宫中三年唯一一笔）<br>
        → C33（你还没说那是什么药，她已答「除虫的药末」——说辞早备好了）<br>
        → C27（林忠供词：德妃命其领药、命其换瓶、嘱其封蜡照旧）</span></div>

        <div class="chainli"><span class="cn">结论三</span><span><b style="color:var(--gold-2)">皇后在当日上午就知道贵妃要死，并撤去了她的缓冲。</b><br>
        → C15（药方被改，撤去生甘草、紫苏）<br>
        → C26（周鹤翻供：改方之命出自长秋宫，「她的药，我说了算」）<br>
        → C28（皇后当日对宫人言：「贵妃这一胎，是留不住的」）</span></div>

        <div class="chainli"><span class="cn">结论四</span><span><b style="color:var(--gold-2)">皇后在当夜撤走了贵妃的自保手段。</b><br>
        → C16（「清整宫器」令，收试毒之器，传令内侍出自长秋宫）<br>
        → C21（试毒宫女春禧被调走，派差签条由长秋宫转下）<br>
        → C19（案发前一日，秋棠之弟被长秋宫的人扣押，秋棠被警告「别多问」）</span></div>

        <div class="chainli"><span class="cn">结论五</span><span><b style="color:var(--gold-2)">皇后把三次求医关在门内，并在明知垂危后不遣医——这是「故意」，不是「疏忽」。</b><br>
        → C23（夜册：申时末宫宴未散时即下夜禁令、宫门酉时落锁；此令一岁不过两道；亥、子、丑三次求医被驳）<br>
        → C24（门吏供词：丑时禀报长秋宫，回话「知道了，候」，无人来、无人遣医）<br>
        → C31（那一碗没端上的安胎药，被同一道夜禁挡在门外）</span></div>

        <div class="chainli"><span class="cn">误导线 · 甲</span><span><b style="color:#dd8e84">婉贵人：最像凶手的人。</b><br>
        → C05（她说「以命换命」，宫人曾在毓秀宫外徘徊）<br>
        → C17（那封信是求情信，落在长秋宫宫人箱底，被人监视）<br>
        → C30（酉时宫门已闭，她的人进不去；三把银匙皆在，无可疑）<br>
        <span class="dim">外层的烟幕，由证词破除。</span></span></div>

        <div class="chainli"><span class="cn">误导线 · 乙</span><span><b style="color:#dd8e84">太医周鹤：手里握着灰白的药末。</b><br>
        → C11（私药匣里那包末，与盏底沉淀同色）<br>
        → C29（药童辨认：生甘草与紫苏，他偷偷留下研磨的）<br>
        <span class="dim">他的心虚不是因为杀了人，是因为偷偷留了药。</span></span></div>

        <div class="chainli"><span class="cn">误导线 · 丙</span><span><b style="color:#dd8e84">秋棠：端汤的人袖里有纸包。</b><br>
        → C18（旧褙子袖袋里的空纸包，纸上一圈白）<br>
        → C08（醒神散：薄荷与冰片，她怕自己守夜睡过去）<br>
        <span class="dim">她从头到尾，只想让娘娘活下来。</span></span></div>

        <div class="chainli"><span class="cn">误导线 · 丁</span><span><b style="color:#dd8e84">封蜡相同，就是同一个人？——这条指向对了人，证据却是废的。</b><br>
        → C25（分装房工具台上的残蜡，与毒蜜瓶口同色同纹）<br>
        → C14（掌事宫女与库册：六宫封蜡本是一炉出，一个色儿）<br>
        <span class="dim">误导线必须能被证伪，不能是死胡同——这是本子的规矩，六条皆如此。</span></span></div>

        <div class="chainli"><span class="cn">误导线 · 戊</span><span><b style="color:#dd8e84">发乌的银针：本朝验毒之制，原是一层纸。</b><br>
        → C32（清整收回的七根银针里，乌着四根，包括毓秀宫那根）<br>
        → C34（药童：银针验的是硫，不是钩吻；十验九乌）<br>
        <span class="dim">这一条不打人，打的是制度。本案的三重防线——银针、试毒宫女、安胎方，没有一重是真的。</span></span></div>

        <div class="chainli"><span class="cn">误导线 · 己</span><span><b style="color:#dd8e84">夹在案卷里的字条：有人替你准备好了一个答案。</b><br>
        → C07（「此事系咸福宫所为」——反手写的匿名字条）<br>
        → C20（纸墨手三样皆无从溯源；封卷后两宫都来调看过）<br>
        <span class="dim">它把矛头指向婉贵人，与 C17 那封真信恰成对照：一个是被偷走的真心，一个是送到你手边的假话。</span></span></div>
      </div>

      <div style="margin-top:22px;padding-top:18px;border-top:1px solid var(--line)">
        <div class="kicker" style="margin-bottom:10px">你呈上的证据</div>
        ${evRows}
      </div>
    </div>

    <div class="frame sec">
      <h2><span class="num">伍</span>本 案 的 误 导 线 索</h2>
      <p class="dim" style="margin-bottom:8px">本子里有六件「看着像铁证」的东西，分两型——</p>
      <p class="dim" style="margin-bottom:14px">
        <b style="color:#dd8e84">甲、乙、丙 ·「指向错人」</b>：东西是真的，安错了人。三个干净的人，各有各的心虚。<br>
        <b style="color:#dd8e84">丁、戊、己 ·「证据无效」</b>：指向的人也许没错，可这条证据本身什么都证明不了——<b>那样东西，满宫都有。</b>封蜡是一炉出的，银针是硫熏乌的，字条的纸是档房通用的。<br>
        六条都不是死胡同，每一条都必有另一条线索能把它推翻。<b style="color:#e79aa2">误导线索的规矩是：可以被骗，但不能被骗死。</b>
      </p>
      <div class="chain">
        <div class="chainli"><span class="cn">误导 · 甲</span><span><b style="color:#dd8e84">C04 妆匣夹层里的白粉</b>　<span class="dim">指向「婉贵人私藏毒粉」</span><br>
        <b style="color:var(--paper-2)">看起来：</b>失宠的贵人，把二钱白粉藏在匣底夹层。匣底夹层本就不是放脂粉的位置。<br>
        <b style="color:var(--paper-2)">真相：</b>珍珠粉。入口不麻、以水调开则沉底不散——钩吻之末才入口发麻、舌根发紧。她失宠后支不到脂粉，自己买珠子磨的。<br>
        <b style="color:var(--gold-2)">推翻它的线索：C22</b>（送验太医院：入口不麻、粉沉底不散；咸福宫采买档上记着「珍珠二两」）</span></div>

        <div class="chainli"><span class="cn">误导 · 乙</span><span><b style="color:#dd8e84">C11 私药匣里的一包药末</b>　<span class="dim">指向「太医周鹤投毒」</span><br>
        <b style="color:var(--paper-2)">看起来：</b>改药方的是他，改方之日正是贵妃死的那一日；他私匣里还藏着一包灰白药末，而贵妃盏底正沉着灰白色的粉。<br>
        <b style="color:var(--paper-2)">真相：</b>生甘草与紫苏，被撤下来的两味。他不敢明着违中宫的话，偷偷磨成末，想寻个机会给贵妃补回去。<br>
        <b style="color:var(--gold-2)">推翻它的线索：C29</b>（药童亲尝辨认：「娘娘的药，我看着被撤的」）<br>
        <span class="dim">这一条最狠：它是被真凶的另一只手逼出来的——皇后撤了药，才有了这包末。</span></span></div>

        <div class="chainli"><span class="cn">误导 · 丙</span><span><b style="color:#dd8e84">C18 秋棠袖袋里的纸包</b>　<span class="dim">指向「端汤的宫女下手」</span><br>
        <b style="color:var(--paper-2)">看起来：</b>那一夜汤是她端的，她袖里揣着一个空纸包，纸上留着一圈白。屋里没有第二个人碰过那盏汤。<br>
        <b style="color:var(--paper-2)">真相：</b>醒神散。她夜里守着贵妃，怕自己睡过去，困了就抿一点薄荷冰片。<br>
        <b style="color:var(--gold-2)">推翻它的线索：C08</b>（她说另一只袖子里还有半包；翻出来一验，辛凉刺鼻）</span></div>

        <div class="chainli"><span class="cn">误导 · 丁</span><span><b style="color:#dd8e84">C25 分装房里的封蜡残块</b>　<span class="dim">证据无效——这一条最特别</span><br>
        <b style="color:var(--paper-2)">看起来：</b>毒蜜瓶口的蜡，与景仁宫分装房那半块，同色同厚，连压出的纹路都像。换瓶的手，就在这间房里。<br>
        <b style="color:var(--paper-2)">真相：</b>宫中封蜡本由内务府一炉熬制、按宫分发。<b style="color:#e79aa2">它指向的人是对的（确是德妃），可它本身什么都证明不了。</b><br>
        <b style="color:var(--gold-2)">推翻它的线索：C14</b>（掌事宫女与库册：一炉出的，一个色儿）<br>
        <span class="dim">甲、乙、丙是「指向错人」，丁是「指向对了、证据是废的」。断案最容易栽在后一种——因为你正高兴。</span></span></div>

        <div class="chainli"><span class="cn">误导 · 戊</span><span><b style="color:#dd8e84">C32 通体发乌的试毒银针</b>　<span class="dim">证据无效——看着像「毒已经验出来了」</span><br>
        <b style="color:var(--paper-2)">看起来：</b>毓秀宫那根试毒银针通体乌黑。毒物早在案发之前就经了她的手、验了出来，却被收回去，没人报一句。试毒的人知情不报。<br>
        <b style="color:var(--paper-2)">真相：</b>银针乌，是碰到了<b>硫</b>——蜜饯、药材、蜜瓶口的封纸都熏过硫。它验不出钩吻；而七根银针里，乌着四根。<b style="color:#e79aa2">春禧不曾瞒报，她守的那道防线，一直是一层纸。</b><br>
        <b style="color:var(--gold-2)">推翻它的线索：C34</b>（药童：银针验的是砒，不是钩吻；「收它做什么？那东西本来也验不出什么」）<br>
        <span class="dim">这一条最伤：它不只推翻 C32，还把整个「试毒之制」一起推翻了——连你自己验过的香囊、蜜、白粉，凡靠银针得的判断，都要重来。</span></span></div>

        <div class="chainli"><span class="cn">误导 · 己</span><span><b style="color:#dd8e84">C07 案卷里夹着的一张字条</b>　<span class="dim">来源不明——看着像有人递给你内情</span><br>
        <b style="color:var(--paper-2)">看起来：</b>《慎刑司案卷》里夹着一张没头没尾的字条：「毓秀宫膳房有人下手，此事系咸福宫所为。三日之内，必得其证。」有人知道内情，也愿意告诉你。<br>
        <b style="color:var(--paper-2)">真相：</b>纸是档房通用的竹纸，墨是宫中处处有的松烟墨，字是<b>反手</b>写的——三样都无从溯源。它不是证据，是<b>诱饵</b>；有人算准了你会翻开这一页，也算准了你会想听那句话。<br>
        <b style="color:var(--gold-2)">推翻它的线索：C20</b>（档房书吏：纸、墨、手，一样都指不出来；而封卷之后，景仁宫与长秋宫的人都来调看过）<br>
        <span class="dim">这支手与婉贵人的真信，恰成一对：一封是她亲手写的求情书，落在别人箱底；一张是别人反手写的告密条，塞进你要翻的卷里。哪一封是真的，不看内容，看它从哪儿来。</span></span></div>
      </div>
      <p style="margin-top:16px">你剔除的是：<b style="color:${droppedOk?"var(--gold-2)":"#e79aa2"}">${dropped?dropped.toUpperCase()+"「"+CLUES[dropped].name+"」":"未剔除（你认为皆可采信）"}</b>${droppedOk?" —— 剔对了。":(droppedWrong?" —— 这一条是实打实的证据，剔错了。":" —— 这一案里，确实有伪证。")}</p>
    </div>

    <div class="frame sec">
      <h2><span class="num">伍·附</span>探 听 · 你 用 什 么 换 来 了 那 些 线 索</h2>
      <p class="dim" style="margin-bottom:12px">这一案里，除了勘验与问话，还有第三条路。<b style="color:#e79aa2">它不谈法度，只谈利害。</b>
      下面四条门路，是你本局走过／没走过的——它们各自能撬到哪一条线，也一并交代清楚。</p>
      <div class="chain">
        ${EAVES.map(ev=>{
          const used = S.eaves[ev.id];
          const stat = used
            ? (used.miss ? '<span style="color:#dd8e84">走过 · 空手而回</span>'
                         : '<span style="color:#8fc9a0">走过 · 得 '+(used.got||[]).length+' 条</span>')
            : '<span class="dim">本局未走</span>';
          const what = ev.pickAll ? (ev.pickAll||[]).map(c=>c.toUpperCase()+"「"+CLUES[c].name+"」").join("　")
                     : ev.pool    ? "（看运气，两三条里撞）"+(ev.pool||[]).map(c=>c.toUpperCase()).join(" ")
                     : (ev.pick||[]).map(c=>c.toUpperCase()+"「"+CLUES[c].name+"」").join("　");
          const gotTxt = used && used.got && used.got.length
            ? '<b style="color:var(--gold-2)">你取得：</b>'+used.got.map(c=>c.toUpperCase()+"「"+CLUES[c].name+"」").join("　")+'<br>' : "";
          return `<div class="chainli"><span class="cn">${ev.ico} ${ev.name.replace(/ ·.*/,"")}</span><span>
            <b style="color:#e8b3ab">${ev.name}</b>　<span class="dim">${ev.cost} + ${ev.need} 筹</span>　${stat}<br>
            <span class="dim">做法：${ev.approach}。</span><br>
            <b style="color:var(--paper-2)">可撬：</b>${what}<br>
            ${gotTxt}
            ${ev.backlash?`<b style="color:#e79aa2">代价：</b>${ev.backlash}之后，问话与呈证一律加一筹。`:"<b style='color:var(--paper-2)'>代价：</b>无（这一手不伤人）。"}
          </span></div>`;
        }).join("")}
      </div>
      <p style="margin-top:16px">
        <b style="color:var(--gold-2)">本子为什么要有这一层？</b>
        因为「三日不够用」不该只换来「那就少查点」——<b>它还可以换来「换一种办法去查」。</b>
        勘验和问话是一条正路：要凭据、要对质、要时辰对得上。可宫里从不只走正路。<br>
        <span style="color:#d98b7a">买、听、逼、堵，四步是往下走的——越往下越准，也越脏。</span>
        本子不给你道德分，只把账算清：<b>用过的办法，最后都会以某种形式还到你的卷宗上。</b>
        那一间慎刑司的屋子，你一旦用过，往后每一个答你话的人，都会先想起它。</p>
    </div>

    <div class="frame sec">
      <h2><span class="num">陆</span>人 物 · 动 机 与 秘 密</h2>
      <div class="role">
        <div class="rolecard"><div class="rn">皇后 韩令仪 · 三十二 · 正位中宫九年 · 无子</div>
          <div class="rl"><span>动机｜</span>贵妃孕已两月未宣，其子在朝中被议立储；兄韩骥任御史中丞，方被沈家参劾。「中宫无子」四个字，是她的死穴。<br>
          <span>秘密｜</span>她在德妃宫中安了耳目，三月初三之前就知道德妃要动手。她选了「不揭发，只补刀」。<br>
          <span>不能说的理由｜</span>一旦承认「我早知道」，便等于承认知情不救——那比下毒更难辩解。<br>
          <span>关系｜</span>与贵妃：三年不睦；与德妃：表面姐妹，实则互相提防、互相利用。</div></div>

        <div class="rolecard"><div class="rn">德妃 陈妙真 · 二十八 · 育皇三子 · 三年前由贵妃位降为德妃</div>
          <div class="rl"><span>动机｜</span>其子原最受喜爱，贵妃之子出生后失宠；父陈邕掌两淮盐运，与沈家争利，上巳宴上沈琮当众羞辱陈邕。<br>
          <span>秘密｜</span>她下毒是真的，但她以为只要贵妃「病」上一场，便能拖住议储。她至今不知道自己下的毒有多重。<br>
          <span>不能说的理由｜</span>领药的事有档可查，她只能靠「除虫」二字撑住。<br>
          <span>关系｜</span>与贵妃：争宠争子争利；与皇后：她以为皇后不知情。</div></div>

        <div class="rolecard"><div class="rn">婉贵人 卫昭 · 二十二 · 母家削爵流放</div>
          <div class="rl"><span>动机｜</span>母家被沈家构陷，她当众说过「以命换命」——最大的动机，也是最响的烟幕。<br>
          <span>秘密｜</span>她送信是求贵妃为母家说一句话，信被长秋宫截走；她根本不知道信落到了谁手里。<br>
          <span>不能说的理由｜</span>承认送信，等于承认自己有事相求，反被当作动机。<br>
          <span>关系｜</span>与贵妃：怨；与皇后：她曾在中宫当过差，皇后知道她每一步。</div></div>

        <div class="rolecard"><div class="rn">太医 周鹤 · 四十 · 掌贵妃脉案</div>
          <div class="rl"><span>动机｜</span>无杀人动机。他的问题是怕——怕丢官，怕丢命。<br>
          <span>秘密｜</span>他改了贵妃的药方，一开始谎称是自己「诊察不精」，直到被呈上脉案，才吐出「出自长秋宫」那半张撕剩的纸。<br>
          <span>不能说的理由｜</span>说了，便是把中宫拖下水，他一家老小都在京城。<br>
          <span>关系｜</span>与皇后：受制；与婉贵人：旧识，曾为她母家诊治。</div></div>

        <div class="rolecard"><div class="rn">大宫女 秋棠 · 二十 · 贵妃陪嫁入宫</div>
          <div class="rl"><span>动机｜</span>无。她是这一案里唯一一个从头到尾只想救人的人。<br>
          <span>秘密｜</span>她三月初二就被人捏住了软肋——弟弟被押，她被人警告「别多问」。所以三月初三夜里，她没敢再争。<br>
          <span>不能说的理由｜</span>说出来，弟弟就没了。<br>
          <span>关系｜</span>与贵妃：主仆情深；与长秋宫内侍：被要挟；与春禧：同宫姊妹。</div></div>

        <div class="rolecard"><div class="rn">试毒宫女 春禧 · 十八 · 毓秀宫 · 每夜为贵妃试汤</div>
          <div class="rl"><span>动机｜</span>无。她连贵妃喝的蜜里有什么都不知道。<br>
          <span>秘密｜</span>三月初三戌时，她被一纸出自长秋宫的派差签条调去搬绸缎。她以为那是内务府的差事，走的时候还跟秋棠说了句「我去去就回」。<br>
          <span>不能说的理由｜</span>她怕的是「试毒不力」四个字——本职没做，回来人已经没了。所以她一句也没敢提自己是被调走的。<br>
          <span>关系｜</span>与秋棠：同宫姊妹；与长秋宫内侍：只见过那一张签条，没见过人。<br>
          <span style="color:#e79aa2">她是 C32 那条误导线唯一的目标。</span>银针乌了、人又不在，看着就是她瞒报。可那根针，本来就是乌的。</div></div>

        <div class="rolecard"><div class="rn">小太监 林忠 · 十九 · 景仁宫当差 · 曾在御药房</div>
          <div class="rl"><span>动机｜</span>执行者。德妃许他一个去御膳房的缺。<br>
          <span>秘密｜</span>整件事他从头到尾不知情由，只知道「娘娘吩咐的，照做」——所以他的供词干净、完整、只指向德妃。<br>
          <span>关系｜</span>与德妃：家生奴才；与秋棠之弟：同是御膳房旧人。</div></div>
      </div>
    </div>

    <div class="frame sec">
      <h2><span class="num">柒</span>写 给 主 持 人 的 话</h2>
      <p><b style="color:var(--gold-2)">卡壳预案（三级）：</b></p>
      <p><b style="color:var(--gold)">一级 · 玩家卡在「毒从哪来」：</b>提示他去毓秀宫<b>勘验</b>那只青玉盏，看盏底没化开的粉末。指向 C02 / C10。</p>
      <p><b style="color:var(--gold)">二级 · 玩家锁定了德妃，认为可以结案：</b>提示「贵妃亥时饮汤，寅时才断气。这三个时辰里，宫里发生了什么？」指向 C23 / C24。</p>
      <p><b style="color:var(--gold)">三级 · 玩家思路全断：</b>直接让他去内务府档房勘验《宫器清整知会签》，再去宫门值房看夜册与门禁存根，自己读出「这道令一岁不过两道」与「三次求医皆被同一道令驳回」。</p>
      <p><b style="color:var(--gold)">另备 · 玩家被伪证领走（指认了婉贵人 / 周鹤 / 秋棠）：</b>不要直接说「你错了」。只问他一句：「这条线索，还有没有第二样东西能说明它？」——C04 对 C22、C11 对 C29、C18 对 C08。让他自己去找那条推翻它的。</p>
      <p><b style="color:var(--gold)">另备 · 玩家把 C25（那半块封蜡）当成铁证：</b>问他：「六宫节礼的封蜡，是不是本来就该是同一炉的？」再让他去景仁宫找掌事宫女问一句（C14）。这一课比抓错人更值钱——<b>指向对了，证据也可能是废的。</b></p>
      <p><b style="color:var(--gold)">另备 · 玩家把 C32（发乌的银针）当成铁证、咬住春禧：</b>只问一句：「匣里七根针，为什么乌着四根？」让他拿着针去太医院递物问药童（C34）。这一条一旦破了，顺势要提醒他把前三日所有靠银针得到的判断重想一遍——C02、C10、C22 都不例外。（C22 的药童是靠<b>尝</b>辨出来的，不是靠针。）</p>
      <p><b style="color:var(--gold)">另备 · 玩家信了 C07 那张字条：</b>问他两个问题：「这纸是哪来的？」「写字的人，为什么不署名？」再去内务府档房问书吏（C20）。要点在于：<b>这不是错线索，是有人替你准备好的答案。</b>顺手与 C17 那封真信对读——一封被偷走，一封被送来。</p>
      <p><b style="color:var(--gold)">另备 · 玩家把方向押死了，另一头一条也够不着：</b>这正是「探听」要解决的问题——提醒他上方那道暗红的条子。<b>「买」与「逼」能直接点名要哪一条</b>：选 poison 的人想看一眼皇后链，就走「近侍」拿 C21（派差签条）与 C16（清整宫器令）；选 gate 的人想看一眼德妃链，就走「逼他说」拿 C27（林忠供词）。<br>
      <span class="dim">要讲清的分寸：探听给的是<b>线头</b>，不是铁证——它撬来的线索多半只是「证词」，够你看见另一头的手，不够你把那一头也钉死。<b>这正是设计想要的：它补的是「广度」，不是「深度」。</b></span></p>
      <p><b style="color:var(--gold)">另备 · 玩家犹豫要不要动刑：</b>不要替他做决定，只把账念给他听——<b>「逼他说」是四道门路里最准的</b>（四五条里任挑一条，且不看他手上已有什么），代价是往后的问话与呈证一律加一筹。<br>
      <span class="dim">它不给道德分，也不惩罚：<b>它只是一笔明账。</b>若玩家选了它又抱怨后面贵，回他一句：「那一间屋的灯，是你自己拨近的。」这一句比任何说教都管用。</span></p>
      <p><b style="color:var(--gold)">进阶提问（给想深一层的玩家）：</b>「本案死者身边有几重防线？」引导他数出三重——银针、试毒宫女、每夜必服的安胎方。然后问：「哪一重是真的？」答案是：没有一重。</p>
      <p><b style="color:var(--gold)">进阶提问（第二组）：</b>「德妃下毒是真的，皇后做的每一件事也都在册上合规——那这一案里，谁犯了法？」带玩家走到那一步：<b>宫里的规矩，本身就是最锋利的凶器。</b>没人需要违法，就能把一个人关死在门里。</p>
      <hr class="rule">
      <p><b style="color:var(--gold-2)">复盘收束（本子的体验就落在这里）：</b>把「德妃下毒 + 皇后断生路」这条双线讲一遍，重点落在<b>「皇后做的每一件事，写在档册上都合规」</b>——这才是宫斗的底色。最后把那封没送出去的信读出来：「妾愿以三年寂寂，换母家一纸清白。」</p>
      <p class="dim">本子为架空原创，朝代、人物、事件皆无原型。不含血腥、虐待与歧视性情节；不使用真实案件与真实人物。</p>
    </div>
